# Supabase 免費方案一週沒有使用會暫停：每週一、四戳一下 API（會讀一次資料庫）
name: keep-alive
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: trips-dev
        run: curl -fsS "https://yuaynahknyetyjkcrzjw.supabase.co/functions/v1/api?forceFunctionRegion=ap-southeast-1&action=trips&list=t00000000:x"
      - name: trips-prod
        run: curl -fsS "https://bkjpjmdrkrduataccxlz.supabase.co/functions/v1/api?forceFunctionRegion=ap-southeast-1&action=trips&list=t00000000:x"
