.dp-theme:empty{display:none}
.dp-list{display:flex;flex-direction:column;gap:4px}
.dp-row{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 10px;border:0;border-radius:8px;background:var(--c-bg);color:var(--c-fg);font:inherit;text-align:left;cursor:pointer;width:100%}
.dp-row .tm{flex:none;font-size:12px;font-variant-numeric:tabular-nums;opacity:.8}
.dp-row .nm{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-row .tag{flex:none;font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:#fff}
.dp-row.me{background:#fff;border:2px dashed var(--c-fg);cursor:default}
.dp-row.hit{box-shadow:inset 0 0 0 2px #E24B4A}
.dp-row.hit .tag{color:#E24B4A}
.chips.sm.day-chips .chip.cand{flex:0 0 auto;padding:0 10px}   /* 「備選」兩個字，不跟數字一樣窄 */
.step{width:40px;height:40px;border-radius:50%;border:0;background:var(--fill);color:var(--text);font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.ed-check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px}
.ed-check input{width:20px;height:20px;accent-color:var(--accent-fg)}
.ed-check span{color:var(--muted);font-size:13px}
/* 開關（已訂位、後面的行程自動移動） */
/* 編輯面板的分段線：整條拉到面板左右邊緣 */
.af-gmlink{display:flex;align-items:center;gap:1px;margin:8px 0 0 auto;padding:2px 0;border:0;background:none;font:inherit;font-size:13px;color:var(--text2);cursor:pointer}
.af-gmlink i{font-size:15px}
.gm-field{position:relative}
.gm-field > i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}
.sheet .gm-field input{padding-left:38px}
.gm-paste{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:40px;margin-top:10px;border:0;border-radius:12px;background:var(--fill);font:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer}
.gm-steps{margin:18px 0 4px;padding-left:20px;font-size:13px;line-height:1.9;color:var(--text2)}
.sheet .gm-field textarea{padding-left:38px;min-height:44px;resize:none;line-height:1.5}
.gm-field > i{top:22px;z-index:1}
.gm-paste[hidden]{display:none}
.im-s1 .im-list > .im-row{animation:pushIn .28s cubic-bezier(.2,.8,.3,1)}   /* 導入：結果從上面推出來 */
@keyframes pushIn{from{opacity:0;transform:translateY(-8px)}}
.gm-steps b{color:var(--text)}
.ed-add-stop{width:100%;height:40px;margin-top:10px;border:0;border-radius:12px;background:#FAF7F3;color:var(--accent-fg);font:inherit;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}   /* 跟時間線的「＋ 加入行程」一樣 */
.ed-stops:empty{display:none}
.ed-t-wrap{position:relative;display:block}
.ed-t-wrap > .num{display:none;position:absolute;left:12px;top:50%;transform:translateY(-50%);z-index:1;width:22px;height:22px;border-radius:50%;background:var(--fill2);font-size:12px;font-weight:600;align-items:center;justify-content:center;pointer-events:none}
.ed-t-wrap.multi > .num{display:flex}
.sheet .ed-t-wrap.multi input{padding-left:44px}
.ed-t-wrap > .ed-stop-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:1}   /* 轉成多個地點：第一站也能拿掉 */
.sheet .ed-t-wrap.multi:has(.ed-stop-x:not([hidden])) input{padding-right:44px}
.ed-sub-open{border:0;background:none;padding:0;font:inherit;color:var(--text);text-align:left;cursor:pointer}   /* 合併區塊的每一站：點名字改那一站 */
.ed-stop{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--fill)}
.ed-stop .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--fill2);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.ed-stop .nm{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-stop-x{flex:none;width:28px;height:28px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:15px;cursor:pointer}
.ed-sep{border:0;border-top:1px solid var(--line);margin:20px -18px 0}
.ed-switch{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;cursor:pointer}
.ed-switch small{color:var(--muted);font-size:13px}
/* 時間有變才出現的開關：高度從 0 長出來，把下面的欄位往下推 */
/* 內容淡入，晚一拍才出現（收起來時先淡掉再收高度），看不到被切掉的那條邊 */
.ed-push{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s cubic-bezier(.4,0,.2,1) .06s}
.ed-push.on{grid-template-rows:1fr;transition-delay:0s}
.ed-push > div{overflow:hidden;min-height:0}
.ed-push .ed-switch{opacity:0;transition:opacity .14s ease}
.ed-push.on .ed-switch{opacity:1;transition:opacity .3s ease .1s}
@media (prefers-reduced-motion:reduce){.ed-push,.ed-push .ed-switch{transition:none}}
input.sw{-webkit-appearance:none;appearance:none;width:44px;height:26px;margin:0;border-radius:13px;background:#E3E3E3;position:relative;flex:none;cursor:pointer;transition:background .2s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
input.sw:checked{background:var(--accent-fg)}
input.sw:checked::after{transform:translateX(18px)}
input.sw:focus-visible{outline:2px solid var(--accent-bg);outline-offset:2px}
.ed-lock,.ed-hint{margin-top:12px;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.5}
.ed-lock{background:#FFF1E2;color:#8A4B22}
.ed-hint{background:var(--fill);color:var(--text2)}
.err{color:#C2412D;font-size:13px;margin-top:6px}
.ed-actions{position:sticky;z-index:5;bottom:calc(-24px - env(safe-area-inset-bottom));display:flex;gap:8px;margin:20px -18px 0;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.btn{height:44px;padding:0 16px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;justify-content:center}
.btn.ghost{border:0;background:var(--fill);color:var(--text)}
.btn.danger{color:#C2412D}
.btn.primary{flex:1;border:0;background:var(--accent-fg);color:#fff}
</style>

<script>

const tlScale = () => { const d = matchMedia('(min-width: 1024px)').matches ? 1.4 : 1.2; let v = d; try { v = +localStorage.getItem(TL_SCALE_KEY) || d; } catch {} return TL_SCALES.some(x => x[0] === v) ? v : d; };

const tl = document.getElementById('tl');
const tabsEl = document.querySelector('.tabs');
function updateTabFade() {

tabsEl.addEventListener('scroll', updateTabFade, { passive: true });
// 天數列捲到這一頁：某一天＝捲到正中間；總覽＝捲到最前面（第 1 天在總覽旁邊）、備選＝捲到最後面。
// 有一點彈的感覺：先衝過頭 8px 再彈回來（到頭了捲不過去，衝過頭的部分用位移做）。
// 不用捲（頭尾幾天、整排放得下）就不彈（試過照換頁方向也彈，太彈了）。第一次畫、減少動態效果就直接到位
let tabsAnim = 0, tabsDrawn = false, tabsPage = '';
function springTabs(page) {
  if (page === tabsPage && tabsDrawn) return;   // 同一頁重畫（存檔、換頁動畫結束）：不要打斷正在彈的
  const max = Math.max(0, tabsEl.scrollWidth - tabsEl.clientWidth), inner = tabsEl.firstElementChild, id = ++tabsAnim;
  inner.style.transform = ''; tabsPage = page;
  let to;
  if (page === 'overview') to = 0;

  else {
    const b = tabsEl.querySelector(`.tab[data-page="${page}"]`); if (!b) return;
    const br = b.getBoundingClientRect(), tr = tabsEl.getBoundingClientRect();
    to = Math.max(0, Math.min(max, tabsEl.scrollLeft + br.left + br.width / 2 - tr.left - tr.width / 2));

    if (id !== tabsAnim) return;

addEventListener('resize', updateTabFade);

// ---------- 小工具 ----------
const m = s => { const [h, mi] = s.split(':').map(Number); return h * 60 + mi; };

// 過了午夜還算同一天：記成 24:30、25:15，畫面上顯示 00:30、01:15。一天最晚排到隔天 05:00
const DAY_END = 29 * 60, NIGHT = 5 * 60;
const T = s => hhmm(m(s) % (24 * 60));                       // 顯示用
const clock = n => new Date(2026, 0, 1, Math.floor(n / 60) % 24, n % 60).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });   // 結束時間：跟時間輸入框同樣的格式

      // 交通時間：小泡泡放在上一張結尾和這一張開頭的正中間（太近就壓在兩張中間，重疊的話放在這一張的上緣）；
      // 空隙比泡泡高時，虛線把兩張卡片連起來。前後地點變了（換店、搬動）就變淡加問號
      // 從住處出發：虛線從最上面的住處卡片（在時間軸上面 10px）連下來；太近就把泡泡壓在這張卡片上緣（10/24 之前一律壓在上緣，沒有虛線）
      // 從住處出發＝homePrev 那張（id 'home'）；「Check in」這種連到住處的一般卡片也有 home，不能當成最上面的住處（10/27 虛線從最上面穿過航班卡片）
      const top0 = prev.id === 'home', end = top0 ? -HOME_GAP : y(prev.e) - 3, gap = y(it.s) - end, stale = routeStale(prev, it);
      if (gap > 18) { const ln = div('car-line' + (stale ? ' stale' : '')); ln.style.height = gap + 'px'; place(ln, Math.round(end)); }
      const el = div('car' + (stale ? ' stale' : ''), `<i class="ti ti-${modeIcon(parseRoute(it.troute).mode)}"></i>${esc(it.travel.replace(/\s+/g, ''))}${stale ? '<span class="q">?</span>' : ''}`);
      if (stale) el.title = '前後的地點變了，這個時間可能不準，可以重新計算';
      place(el, Math.round((top0 && gap <= 24 ? y(it.s) - 3 : gap >= 0 ? end + gap / 2 : y(it.s)) - 9));
    }
    const top = y(it.s), mins = m(it.e) - m(it.s), h = Math.max(mins * PX - 3, 28);
    const extra = clash.has(it.id) ? ' clash' : '';
    if (it.flight) {   // 航班卡片：灰底＋飛機圖示，不能拖，點了看機票
      const fb = div('blk flight' + (it.kind === 'dep' ? ' fdep' : '') + extra, flightBlockHtml(it, prev, h));
      fb.dataset.flid = it.flight.id; setCol(fb, it.id);

      return;
    }
    if (it.ride?.legs?.length) {   // 交通卡片：白底細框＋站點直線；太短放不下就先精簡顯示，點一下展開看完整的
      const ds = S(it), top = y(hhmm(ds)), h = Math.max((E(it) - ds) * PX - 3, 28);
      const rd0 = rideBlockHtml(it, h, day, ds, { s: ds - m(it.s), e: m(it.e) - E(it) }), rb = div('blk ride' + extra + (rd0.short ? ' short' : ''), rd0.html);
      rb.dataset.id = it.id; setCol(rb, it.id);
      if (rd0.short) makeExpander(rb, top, h, rb); else { rb.style.height = h + 'px'; place(rb, top); }
      return;
    }
    // 合併區塊：好幾站依序走；多選一：幾間都可以去，到時候挑一間。兩種都是可以展開的卡片
    const pick = !it.group && !!it.alts?.length;
    if (it.group || pick) {
      const g = div('grp ' + (it.cls || 'eat') + extra);
      g.dataset.id = it.id;
      g.setAttribute('role', 'button'); g.tabIndex = 0;
      const gal = alertParts(it, day, m(it.s), m(it.e));
      const sumN = Math.max(1, Math.floor((h - 56) / 22));   // 站名放得下幾行（至少一行）
      const rows = pick
        ? `<div class="cap">這幾間都可以去，到時候再一起選一間</div>${it.alts.map((a, i) => `
          <div class="stop" data-kind="alt" data-idx="${i}"><div class="num pick"></div>
            <div style="flex:1;min-width:0"><div class="n">${esc(a.name)}${warnTag(alertParts(a, day, m(it.s), m(it.s) + (+a.dur || m(it.e) - m(it.s))).warn)}</div>${a.desc ? `<div class="o">${esc(a.desc)}</div>` : ''}
              ${(() => { const aal = alertParts(a, day, m(it.s), m(it.s) + (+a.dur || m(it.e) - m(it.s))).rest; return aal || +a.dur ? `<div class="m">${+a.dur ? `<i class="ti ti-clock"></i> ${T(it.s)} · ${durLabel(+a.dur)}` : ''}${aal && +a.dur ? '　' : ''}${esc(aal)}</div>` : ''; })()}</div>
            ${a.map ? navBtn(a.map, a.name, a.pid) : ''}${subEditIc}
          </div>`).join('')}<button type="button" class="add-sub" data-kind="alt"><i class="ti ti-plus"></i> 新增選項</button>`
        : `${it.stops.map((st, i) => `
          <div class="stop${i < it.stops.length - 1 ? ' chain' : ''}" data-kind="stop" data-idx="${i}"><div class="num">${i + 1}</div>
            <div style="flex:1;min-width:0"><div class="n">${esc(st.name)}${warnTag(alertParts(st, day, m(st.s), m(st.s) + (+st.dur || 0)).warn)}</div>${st.orig ? `<div class="o">${esc(st.orig)}</div>` : ''}${st.desc ? `<div class="o">${esc(st.desc)}</div>` : ''}
              <div class="m"><i class="ti ti-clock"></i> ${T(st.s)} · ${durLabel(st.dur)}${st.area ? `　<i class="ti ti-map-pin"></i> ${esc(st.area)}` : ''}${(sal => sal ? `　${esc(sal)}` : '')(alertParts(st, day, m(st.s), m(st.s) + (+st.dur || 0)).rest)}</div></div>

          ? `<i class="ti ti-arrows-split-2"></i> ${esc(it.t)}`

        <div class="sum"><div class="d" style="-webkit-line-clamp:${pick ? 1 : sumN}">${pick
          ? esc(it.alts.map(a => a.name).join('／'))

    // 描述：標題（22）＋標籤（19）＋內距和間距（15）之外，每 22px 放一行；放不下就不顯示
    const descLines = (it, h) => { const n = Math.floor((h - 56) / 22); return it.desc && it.desc !== PENDING && n >= 1 ? `<div class="d" style="-webkit-line-clamp:${n}">${esc(it.desc)}</div>` : ''; };
    const compact = h < COMPACT_H;
    const al = alertParts(it, day, m(it.s), m(it.e));
    const hs = homeStay(it, day), hi = hs ? homeIc : '', dIt = hs && !it.desc ? { ...it, desc: hs.addr || '' } : it;   // 回住處休息：房子圖示、沒寫描述就放住處地址
    const b = div('blk ' + it.cls + (showNav ? ' has-nav' : '') + (compact ? ' compact' : '') + extra,

        : `<div class="t">${hi}${esc(it.t)}${warnTag(al.warn)}</div>${descLines(dIt, h)}<div class="bcs">${bcTime(it.s, it.e)}${bcBooked(it.booked)}<span class="bc">${durLabel(mins)}</span>${hs ? `<span class="bc"><i class="ti ti-bed"></i>${esc(shortName(hs.name))}${hs.cin && stayIdx(hs)[0] === dayNum(day) - 1 ? `・${hs.cin} 後入住` : ''}</span>` : it.area ? `<span class="bc"><i class="ti ti-map-pin"></i>${esc(it.area)}</span>` : ''}${bcExtra(false, al.rest, it.desc === PENDING)}</div>${showNav ? navBtn(it.map, it.t, it.pid) : ''}${editIc}`);

}

    const dw = [d.date, d.wd, city].filter(Boolean).join('．');   // 沒有日期（例如操作練習）就不要多出「．」

  if (!acctBtn.innerHTML) updateAcctBtn();   // 直接打開旅程連結：頭像還沒畫過
  fab.classList.toggle('day', isDay(page) || page === 'cand');
  // 左上角漢堡（回我的旅程、帳號、旅程設定都在選單裡）；地圖、編輯（手）是右下角兩顆。總覽沒有地圖、也沒有卡片可以編輯

  if (!eb.querySelector(editing ? '.ti-check' : '.ti-pencil')) eb.innerHTML = editing ? '<i class="ti ti-check"></i><span class="btn-lb">儲存</span>' : PENCIL_SVG + '<span class="btn-lb">編輯</span>';
  eb.setAttribute('aria-label', editing ? '儲存，離開編輯' : '編輯行程');

  if (dsWas && !dsSide.hidden) { dsSide.classList.remove('in'); void dsSide.offsetWidth; dsSide.classList.add('in'); }   // 從總覽、備選換到某一天：五顆一起從左邊滑出來（換天不重播）

  if (!loaded) { candEl.innerHTML = `<div class="ov-empty">${loadErrText()}</div>`; return; }

    // 外層只放營業時間（時鐘）、區域、其他提醒；預計時段不顯示（排進某一天時才用到，點開看得到）
    const parts = String(it.alert || '').split(/\s*[・·]\s*/).filter(Boolean), isHr = x => /營業|公休|休息|\d{1,2}:\d{2}/.test(x);

    const line = [hrs.length && seg('ti-clock', hrs.join('・')), area && seg('ti-map-pin', area), rest.length && seg('ti-alert-triangle', rest.join('・')), it.booked && seg('ti-circle-check', '已訂位')].filter(Boolean).join('');
    return `<div class="blk ${it.cls || 'eat'}${it.map && !multi ? ' has-nav' : ''}" data-id="${it.id}">

      ${names ? `<div class="d">${esc(names)}</div>` : it.desc === PENDING ? '<div class="d"><i class="ti ti-loader-2 spin"></i> 查詢中，查好會自動填上</div>' : it.desc ? `<div class="d">${esc(it.desc)}</div>` : ''}

  if (!all.length) body = '<div class="ov-empty">還沒有備選景點。按上面「加入新地點」搜尋店名，或貼上 Google 地圖的店家、清單連結</div>';

  else body = shown.map(card).join('');

  const stale = all.filter(c => !c.group && !c.alts?.length && c.map && !c.pid && !c.desc);
  candEl.innerHTML = `<button type="button" class="cand-import" id="candImport"><i class="ti ti-plus"></i>加入新地點<small>加入備選清單，隨時取用</small></button>
    ${stale.length ? `<button type="button" class="cand-redo" id="candRedo"><i class="ti ti-refresh"></i><span>有 ${stale.length} 個地點沒查到資料</span><b>重新查詢</b></button>` : ''}
    ${all.length > 1 ? `<div class="cand-bar">

wkPop.addEventListener('click', e => {

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !wkPop.hidden) wkPopClose(); });
// 多天並排上方的五顆：拖到某一天的時間線上放開＝加在那天那個時間（跟單日的側邊一樣，10/25）；點一下只提示要拖（不知道是哪一天），從備選是打開清單
const WK_CHIPS = document.getElementById('dsSide').innerHTML.replace('data-ds="cand"', 'data-ds="cand" aria-expanded="false"');
var wkCandOpen = false, wkSlot = null, wkKeep = false;   // wkKeep：放開後面板開著，虛線留在原地（10/25）

wkEl.addEventListener('click', e => {

wkEl.addEventListener('dragstart', e => {
  const b = e.target.closest('#wkChips [data-ds]'), c = e.target.closest('#wkCand .cp-item[data-id]');

});

  const dur = dndDur(dnd);

wkEl.addEventListener('dragover', e => { if (!dnd) return; const sp = wkSpot(e.clientX, e.clientY, 0); if (!sp) { wkSlotAt(null); return; } e.preventDefault(); wkSlotAt(sp); });

// 放開後沒有跳出面板（直接加好、或編輯碼按取消）：虛線就收掉
function wkKeepCheck() { setTimeout(() => { if (wkKeep && !sheet.classList.contains('on')) { wkKeep = false; wkSlotAt(null); } }, 800); }
// 面板的位置：放開那一欄的旁邊；面板關掉就恢復平常的位置（左上角）
function wkAnchor(col, y) {

let wkAnchSeen = false;
new MutationObserver(() => {

  else if (!on && wkAnchSeen) { wkAnchSeen = false; document.documentElement.classList.remove('wk-anch'); wkKeep = false; wkSlotAt(null); }

// 拖曳：按住卡片移動 → 半透明的卡片跟著滑鼠，放開的那一欄、那個時間就是新位置（15 分鐘一格）
let wkDrag = null, wkDragged = false;
wkEl.addEventListener('mousedown', e => {

  e.preventDefault();
});
const wkSpot = (x, y, dy = wkDrag?.dy || 0) => {

addEventListener('mousemove', e => {

// 拖卡片靠近左右（上下）邊緣：畫面自己捲過去，越靠邊越快
function wkEdge(x, y) {

addEventListener('mouseup', e => {

});
