<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light only">
<title>行程</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Isometra&display=swap">
<style>
:root{
  color-scheme:light;
  /* 旅行感配色：暖白底＋大地色系 */
  --page:#ffffff;--text:#2b2622;--text2:#6e665e;--muted:#a39a90;--line:#efeae3;--border:#e2dbd2;
  --accent-bg:#F7E6DA;--accent-fg:#9A4A25;           /* 陶土橘：選取中的天數 */
  --eat-bg:#FCEBDD;--eat-bd:#F0B48C;--eat-fg:#8A4B22;  /* 吃：芒果蜜桃 */
  --spa-bg:#E9F0E4;--spa-bd:#A9C49C;--spa-fg:#3F5E3A;  /* 按摩：香茅綠 */
  --cafe-bg:#F3ECE3;--cafe-bd:#CDB59A;--cafe-fg:#6B4E36; /* 咖啡：拿鐵奶茶 */
  --shop-bg:#E5EEF3;--shop-bd:#9DBDD0;--shop-fg:#355C74; /* 購物：霧藍 */
  --bar-bg:#F4E3E7;--bar-bd:#D7A2AE;--bar-fg:#7A2E40;    /* 酒吧：酒紅 */
  --see-bg:#EEEAF4;--see-bd:#BFB3D6;--see-fg:#5B4B7A;    /* 景點、活動：薰衣草 */
  --other-bg:#EFEDEA;--other-bd:#CFC8BF;--other-fg:#5E5850; /* 其他（交通、住宿）：灰米 */
  --now:#E24B4A;
  --hour:60px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:var(--page);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
/* 天數列：放得下時置中；放不下時可左右滑，兩側保留 16px 邊界 */
.tabs-row{display:flex;align-items:center;margin:0 -16px 10px}
.on-trips .tabs-row{display:none}
.tabs{overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;-webkit-overflow-scrolling:touch;scroll-padding:0 16px}
.tabs-in{display:flex;align-items:center;gap:2px;width:max-content;margin:0 auto;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
/* 還能往左／往右滑時，該側邊緣淡出 */
.tabs{--fl:0px;--fr:0px;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);
          mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
.tabs.fade-l{--fl:36px}
.tabs.fade-r{--fr:36px}
.tab{position:relative;flex:none;padding:5px 8px;border-radius:8px;font-size:13px;color:var(--text2);border:0;background:none}
/* 天數按鈕：正圓、數字置中 */
.tab.day{width:30px;height:30px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  line-height:1;font-variant-numeric:tabular-nums}
.tab.on{background:var(--accent-bg);color:var(--accent-fg);font-weight:600}
/* 單日大標題：英文書寫體，營造度假感 */
.day-title{font-family:"Isometra",cursive;font-size:36px;font-weight:400;line-height:1.15;color:var(--accent-fg);text-align:center}
.day-sub{font-size:13px;color:var(--text2);margin-top:4px;text-align:center}
.tl{position:relative;margin:14px 16px 40px 0;transition:height .25s ease;touch-action:pan-y pinch-zoom}
/* 卡片層：時間線固定不動，只有這一層左右滑 */
.cards{position:absolute;top:0;bottom:0;left:52px;right:0;overflow:hidden;z-index:1}   /* 蓋在「現在」那條線上面 */
.layer{position:absolute;inset:0}
.layer.drag{will-change:transform}
.layer.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.tl.sliding .now{opacity:0}
.mv{transition:top .25s ease}
/* 總覽：全部從每天的行程算出來，改了行程這裡自動跟著變 */
.ov{padding:16px 16px 48px;touch-action:pan-y pinch-zoom}
/* 第 1 天和總覽之間滑動換頁：新的那頁從滑過來的方向淡入 */
@keyframes inL{from{transform:translateX(-48px);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
.in-l{animation:inL .26s ease}
.in-r{animation:inR .26s ease}
.ov-sec{font-size:12px;font-weight:600;color:var(--muted);margin:22px 0 8px}
.ov-sec:first-child{margin-top:0}
/* 總覽分兩頁：每天（每天、這趟旅程、已訂位）／待辦清單（待辦、注意事項），用 Segmented Control 切換 */
.seg.ov-seg{margin:0 0 18px}
.ov-seg .seg-thumb{width:calc((100% - 6px) / 2)}
.ov-seg + .ov-sec{margin-top:0}
.ov-row{display:flex;align-items:flex-start;gap:10px;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;
  font:inherit;color:var(--text);text-align:left;cursor:pointer}
.ov-row:first-of-type{border-top:0}
.ov-when{flex:none;width:86px;font-size:12px;color:var(--text2);line-height:1.45}
.ov-when b{display:block;font-size:13px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.ov-places{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ov-place{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;font-weight:600;line-height:1.35}
.ov-place .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-row .ov-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c-bd)}
.ov-ok{flex:none;font-size:14px;color:var(--spa-fg)}
.ov-row .ti-chevron-right{flex:none;color:var(--muted);margin-top:1px}
.ov-stats{display:flex;flex-wrap:wrap;gap:6px}
.ov-stat{display:flex;align-items:baseline;gap:4px;padding:6px 10px;border-radius:10px;background:var(--c-bg);color:var(--c-fg);font-size:12px}
.ov-stat b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ov-chips{display:flex;flex-wrap:wrap;gap:6px}
.ov-chip{max-width:100%;padding:4px 10px;border-radius:999px;border:0;font:inherit;font-size:12px;background:var(--c-bg);color:var(--c-fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ov-chip b{font-weight:600;font-variant-numeric:tabular-nums}
.ov-empty{font-size:13px;color:var(--muted);padding:6px 0}
/* 總覽：待辦清單（可以勾，大家共用）、注意事項（條列） */
.ov-prog{font-weight:400;margin-left:6px;font-variant-numeric:tabular-nums}
.ck-list{display:flex;flex-direction:column}
.ck{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ck:first-child{border-top:0}
.ck-box{position:relative;flex:none;width:22px;height:22px;margin-top:-1px;padding:0;border:1.5px solid var(--border);border-radius:50%;background:#fff;color:#fff;
  font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ck-box::after{content:"";position:absolute;inset:-9px}
.ck-box i{opacity:0}
.ck.done .ck-box{background:var(--accent-fg);border-color:var(--accent-fg)}
.ck.done .ck-box i{opacity:1}
.ck-bullet{flex:none;width:5px;height:5px;margin:8px 8px 0;border-radius:50%;background:var(--accent-fg)}
.ck-txt{flex:1;min-width:0;padding:0;border:0;background:none;font:inherit;font-size:14px;line-height:1.45;color:var(--text);text-align:left;cursor:pointer;word-break:break-word}
.ck.done .ck-txt{color:var(--muted);text-decoration:line-through}
.ck-who{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--line);color:var(--text2);font-size:11px;line-height:18px;text-decoration:none;vertical-align:1px}
.ck{position:relative;background:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ck.ck-shift{transition:transform .15s ease}
.ck.ck-lift{z-index:2;box-shadow:0 6px 18px rgba(60,40,20,.16);border-radius:10px;border-top-color:transparent;transform-origin:center}
.ck-add{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.ck-add i{flex:none;width:22px;text-align:center;color:var(--muted);font-size:15px}
.ck-add input{flex:1;min-width:0;height:34px;padding:0;border:0;background:none;font:inherit;font-size:16px;color:var(--text)}
.ck-add input:focus{outline:none}
.ck-add input::placeholder{color:var(--muted)}
.hr{position:absolute;left:0;width:44px;text-align:right;font-size:11px;color:var(--muted)}
.ln{position:absolute;left:52px;right:0;border-top:1px solid var(--line)}
.blk{position:absolute;left:4px;right:0;padding:6px 10px 5px;border:0;border-radius:8px;overflow:hidden}
/* 名稱太長換行時，筆記按鈕接在最後一個字後面（不是夾在整段名稱右邊） */
.blk .t{font-size:15px;font-weight:600;line-height:22px;min-height:22px}
.blk .t .tm{font-size:12px;font-weight:400;white-space:nowrap;margin-left:4px}
/* 短卡片：標題列垂直置中 */
.blk.compact{display:flex;align-items:center;padding-top:0;padding-bottom:0}
.blk .s{font-size:12px;margin-top:1px}
/* 一句話描述：放在標題和時間中間，卡片放得下幾行就顯示幾行 */
.blk .d{font-size:12px;line-height:16px;margin:1px 0 2px;opacity:.85;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
/* 交通時間：小泡泡，左右置中在卡片欄（卡片 left:4px），放在上一張結尾和這一張開頭的正中間；離得遠就用虛線把兩張卡片連起來 */
.car{position:absolute;left:calc(50% + 2px);transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:1px;height:18px;box-sizing:border-box;padding:0 5px;
  border:1px solid var(--line);border-radius:999px;background:#fff;font-size:10px;line-height:16px;color:var(--text2);white-space:nowrap}
.car i{font-size:11px}
.car-line{position:absolute;left:calc(50% + 2px);width:1px;margin-left:-.5px;z-index:2;background:repeating-linear-gradient(to bottom,var(--line) 0 3px,transparent 3px 7px)}
.eat{background:var(--eat-bg);border-color:var(--eat-bd);color:var(--eat-fg);--c-bg:var(--eat-bg);--c-bd:var(--eat-bd);--c-fg:var(--eat-fg)}
.spa{background:var(--spa-bg);border-color:var(--spa-bd);color:var(--spa-fg);--c-bg:var(--spa-bg);--c-bd:var(--spa-bd);--c-fg:var(--spa-fg)}
.cafe{background:var(--cafe-bg);border-color:var(--cafe-bd);color:var(--cafe-fg);--c-bg:var(--cafe-bg);--c-bd:var(--cafe-bd);--c-fg:var(--cafe-fg)}
.shop{background:var(--shop-bg);border-color:var(--shop-bd);color:var(--shop-fg);--c-bg:var(--shop-bg);--c-bd:var(--shop-bd);--c-fg:var(--shop-fg)}
.bar{background:var(--bar-bg);border-color:var(--bar-bd);color:var(--bar-fg);--c-bg:var(--bar-bg);--c-bd:var(--bar-bd);--c-fg:var(--bar-fg)}
.see{background:var(--see-bg);border-color:var(--see-bd);color:var(--see-fg);--c-bg:var(--see-bg);--c-bd:var(--see-bd);--c-fg:var(--see-fg)}
.other{background:var(--other-bg);border-color:var(--other-bd);color:var(--other-fg);--c-bg:var(--other-bg);--c-bd:var(--other-bd);--c-fg:var(--other-fg)}
.grp{position:absolute;left:4px;right:0;z-index:2;background:var(--eat-bg);border:0;
  border-radius:8px;padding:6px 10px 5px;color:var(--eat-fg);cursor:pointer;overflow:hidden;transition:height .25s ease}
/* 合併區塊跟著類型換顏色（預設是吃） */
.grp.spa{background:var(--spa-bg);color:var(--spa-fg)}.grp.cafe{background:var(--cafe-bg);color:var(--cafe-fg)}
.grp.shop{background:var(--shop-bg);color:var(--shop-fg)}.grp.see{background:var(--see-bg);color:var(--see-fg)}
.grp.bar{background:var(--bar-bg);color:var(--bar-fg)}.grp.other{background:var(--other-bg);color:var(--other-fg)}
.grp .head{display:flex;justify-content:space-between;align-items:center}
.list{display:none;margin:8px -10px 0;background:#fff;background:color-mix(in srgb,var(--c-bg,var(--eat-bg)) 30%,#fff);border-top:1px solid var(--c-bd,var(--eat-bd));padding:2px 12px 4px;color:var(--text);cursor:default}
.grp.open .list{display:block}
.grp.open .sum{display:none}
/* 展開時標題列右邊顯示整張的時間（收合時時間在摘要裡，不重複） */
.grp .head .hd-tm{display:none;margin-left:auto;margin-right:8px;flex:none;font-size:12px;font-variant-numeric:tabular-nums;opacity:.85}
.grp.open .head .hd-tm{display:block}
.grp{container-type:inline-size}
@container (max-width: 260px){.grp.open .head .hd-tm{display:none}}   /* 時間重疊、卡片被擠窄時放不下，不顯示 */
.stop{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.num{width:22px;height:22px;border-radius:50%;background:var(--c-bg,var(--eat-bg));color:var(--c-fg,var(--eat-fg));font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.stop .n{font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;min-height:22px}
.stop .o{font-size:12px;color:var(--text2)}
.stop .m{font-size:11px;color:var(--muted);margin-top:3px}
.nav{width:22px;height:22px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.75);color:inherit;text-decoration:none;font-size:13px}
.nav{position:relative}
.nav::after{content:"";position:absolute;inset:-9px}
.nav:active{transform:scale(.92)}
/* 讓按鈕裡的圖示真正置中（拿掉字型行高造成的偏移） */
.nav i{display:block;width:1em;height:1em;line-height:1;text-align:center}
.nav i::before{display:block}
.blk > .nav{position:absolute;top:6px;right:8px}   /* 卡片本身的導航鈕放右上角；展開清單裡的照常排在每一列 */
.blk.compact > .nav{top:50%;transform:translateY(-50%)}
.blk.has-nav{padding-right:36px}
.stop .nav{align-self:center;border:1px solid var(--line);color:var(--text2)}
.blk{transition:height .25s ease,top .25s ease}
/* 幾間挑一間：每一家是平行的選項，用空心圓圈代替編號 */
.num.pick{background:transparent;border:2px solid var(--c-bd,var(--eat-bd));width:18px;height:18px;margin:3px 2px 0}
.list .cap{font-size:11px;color:var(--muted);padding-top:8px}
.list .cap + .stop{border-top:0}
/* 多個地點：編號圈圈之間用虛線連起來（依序走）；分隔線從店名那一欄開始畫，不切過虛線 */
.stop[data-kind="stop"]{position:relative;border-top:0}
.stop[data-kind="stop"]:not(:first-child)::after{content:"";position:absolute;top:0;left:32px;right:0;border-top:1px solid var(--line)}
.stop.chain::before{content:"";position:absolute;left:10.25px;top:38px;bottom:-6px;   /* 上下各跟圓圈留 5px */width:1.5px;opacity:.55;   /* 細細的短虛線：2px 一段、間隔 3px */
  background:repeating-linear-gradient(to bottom,var(--c-fg,var(--eat-fg)) 0 2px,transparent 2px 5px)}
.stop[data-kind="stop"] .num{position:relative;z-index:1}
/* 展開後：線條和編號跟著卡片的類型顏色；白色清單一路延伸到卡片底部，不留一大塊色塊 */
.grp.open{display:flex;flex-direction:column;padding-bottom:0}
.grp.open .list{flex:1 0 auto}
.now{position:absolute;left:52px;width:0;height:0;z-index:0}   /* 現在時間：時間刻度和卡片中間一個咖啡色小圓點 */
.now::before{content:"";position:absolute;left:-7px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--accent-fg)}
.now{pointer-events:none}
.tab.today::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent-fg)}
.ov-today{margin-left:6px;padding:0 6px;border-radius:999px;background:var(--accent-fg);color:#fff;font-size:10px;font-weight:600;vertical-align:1px}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(20,20,18,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:480px;margin:0 auto;max-height:82vh;overflow-y:auto;
  background:#fff;border-radius:18px 18px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .25s ease;overscroll-behavior:contain}
.sheet.on{transform:none}
/* 關起來的面板滑到畫面外之後整個藏起來：iPhone Safari 底部半透明的網址列會透出藏在下面的白色面板 */
.sheet:not(.on){visibility:hidden;transition:transform .25s ease,opacity .18s ease,visibility 0s .25s}
/* 面板打開時把頁面固定住、只留一個畫面高：iPhone 彈出鍵盤時就推不出下面的行程，露出來的只會是白色 */
html.sheet-lock{background:#fff}
html.sheet-lock body{position:fixed;left:0;right:0;bottom:0;overflow:hidden}
/* 浮出來的小視窗（輸入通關密碼、確認放棄）：放在鍵盤上方的可見範圍正中間，不會被鍵盤擋住 */
.sheet.dlg{left:16px;right:16px;bottom:auto;top:0;max-height:none;border-radius:18px;padding:18px 18px 0;
  transform:scale(.96);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.sheet.dlg.on{transform:none;opacity:1;pointer-events:auto}
.sheet.dlg:not(.on){transition:opacity .18s ease,transform .18s ease,visibility 0s .18s}
.sheet.dlg .grab{display:none}
.sheet.dlg .ed-actions{position:static;margin-top:18px;padding:12px 18px 16px;border-radius:0 0 18px 18px}
/* 拉桿：固定在面板最上面，內容往上捲時不會跟著捲走；整條白色橫條都可以按著往下拉 */
.grab{position:sticky;top:-8px;z-index:3;height:22px;margin:-8px -18px 2px;background:#fff;border-radius:18px 18px 0 0}
.grab::before{content:"";position:absolute;left:50%;top:8px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--border)}
.ed-full textarea{font-size:14px}
/* 照片：筆記最上方的大照片（直角）；編輯面板裡的預覽 */
/* 照片框固定 339:206（用 padding 撐高度，舊版 iPhone 也支援）；照片等比例放大到短邊填滿，置中裁掉多的部分 */
.ph-frame{position:relative;width:100%;height:0;padding-top:60.77%;overflow:hidden;background:var(--line)}
.ph-frame img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.sh-photo{margin:0 0 14px}
.ph-prev{position:relative}
.ph-drag{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}   /* 拖曳選顯示範圍：不捲動、不拉面板 */
.ph-drag.moving{cursor:grabbing}
.ph-hand{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .2s}
.ph-drag.moving .ph-hand{opacity:0}
.ph-badge{position:absolute;right:8px;bottom:8px;padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:12px}

.ph-prev.empty{display:flex;align-items:center;justify-content:center;height:64px;border:1px dashed var(--border);border-radius:10px;font-size:13px;color:var(--muted)}
.ph-row{display:flex;gap:8px;margin-top:8px}
.ph-row input{flex:1;min-width:0}
.ph-up{flex:none;font-size:15px;font-weight:500}
.ph-st{font-size:12px;color:var(--muted);margin-top:4px;min-height:0}
.ph-st:empty{display:none}
.ed-full .ed-hint{margin:0 0 8px}
.sh-head{display:flex;gap:10px;align-items:flex-start}
.sh-title{font-size:18px;font-weight:600;line-height:1.35}
.sh-sub{font-size:13px;color:var(--text2);margin-top:2px}
/* 點卡片打開的資訊：描述、時間、提醒（筆記之外，卡片本身的資料） */
.sh-desc{margin-top:12px;font-size:14px;line-height:1.6}
.sh-meta{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--text2)}
.sh-meta div{display:flex;align-items:flex-start;gap:6px;line-height:1.5}
.sh-meta i{flex:none;font-size:15px;margin-top:1px}
.sh-empty{margin-top:14px;font-size:13px;color:var(--muted)}
.sh-close{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--line);color:var(--text2);font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.sh-head .nav{border:1px solid var(--line);color:var(--text2);width:30px;height:30px}
.mine{margin:14px 0 4px;padding:10px 12px;border-radius:10px;background:var(--eat-bg);color:var(--eat-fg);font-size:14px;line-height:1.6}
.mine b{display:block;font-size:12px;font-weight:600;margin-bottom:2px}
.sh-sec{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.sh-list{margin:0;padding-left:18px;font-size:14px;line-height:1.7}
/* 完整筆記：預設收起來，點標題展開 */
.full-note{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.full-note summary{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;list-style:none}
.full-note summary::-webkit-details-marker{display:none}
.full-note summary i{transition:transform .2s}
.full-note[open] summary i{transform:rotate(180deg)}
.full-txt{margin-top:10px;font-size:14px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word}
.full-txt a{color:var(--accent-fg);word-break:break-all}
.sh-links a{display:block;font-size:13px;color:var(--accent-fg);margin:4px 0;word-break:break-all}

[hidden]{display:none!important}
/* 編輯模式：標題、副標主題可以直接點來打字 */
.inline-edit{outline:none;cursor:text;border-radius:4px;
  background-image:linear-gradient(to right,currentColor 50%,transparent 50%);background-size:6px 1.5px;background-repeat:repeat-x;background-position:0 100%}
.day-title.inline-edit{display:table;margin:0 auto;min-width:2em;background-size:8px 2px;padding-bottom:2px}   /* 虛線只畫在文字底下 */
.inline-edit:focus{background-image:none;background-color:var(--accent-bg)}
/* ---------- 編輯模式 ---------- */
.edit-btn{position:absolute;right:16px;bottom:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--text2);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.edit-btn i{display:block;line-height:1}
.editing .edit-btn{display:none}
/* ---------- 地圖 ---------- */
/* 分段切換（卡片樣式）：三段等寬，選中的那段是白色小塊，切換時滑過去 */
.seg{position:relative;display:flex;height:36px;padding:3px;border-radius:10px;background:#EFEBE5;box-sizing:border-box}
.seg-thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / 3);border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(60,40,20,.16);transition:transform .2s ease}
.seg[data-i="1"] .seg-thumb{transform:translateX(100%)}
.seg[data-i="2"] .seg-thumb{transform:translateX(200%)}
.seg button{position:relative;z-index:1;flex:1;min-width:0;padding:0;border:0;border-radius:8px;background:none;font:inherit;font-size:14px;color:var(--text2);cursor:pointer;transition:color .2s}
.seg button.on{color:var(--text);font-weight:600}
@media (prefers-reduced-motion:reduce){.seg-thumb{transition:none}}
.map-btn{position:absolute;left:16px;bottom:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--text2);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.map-btn i{display:block;line-height:1}
.map-btn[hidden],.editing .map-btn{display:none}
.map-view{position:relative;height:calc(100dvh - var(--hd, 160px));min-height:320px;background:#F3EFE8}
.map-view .gmap{position:absolute;inset:0}
/* 地圖模式：網頁背景換成地圖底色，iPhone 底部半透明網址列後面露出來的是米色，跟地圖連成一片 */
html.on-map:not(.sheet-lock),html.on-map:not(.sheet-lock) body{background:#f4f0e9}   /* 打開資訊面板時是白色，跟面板一樣 */
.map-msg{position:absolute;left:16px;right:16px;top:16px;z-index:2;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.94);
  box-shadow:0 2px 10px rgba(60,40,20,.12);font-size:13px;color:var(--text2);text-align:center}
.map-msg:empty{display:none}
/* 放大縮小：自己做的按鈕，跟頁首的按鈕同一個樣式（Google 內建的關掉） */
.map-zoom{position:absolute;right:12px;bottom:36px;z-index:2;display:flex;flex-direction:column;gap:8px}
.map-view.has-strip .map-zoom{bottom:80px}
/* 地圖最底下一條米色，蓋住 Google 標誌和版權字（使用者自己的決定，個人使用） */
.map-cover{position:absolute;left:0;right:0;bottom:0;height:72px;z-index:2;pointer-events:none;
  background:linear-gradient(to top,#f4f0e9 0,#f4f0e9 26px,rgba(244,240,233,0) 100%)}   /* 底下 26px 實色蓋住字樣，往上淡出 */
/* 底部的地點卡片列：左右滑、一張一張停；放在 Google 標誌和版權字的上面（那些依條款要看得到） */
.map-strip{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;gap:8px;padding:6px 16px 4px;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.map-strip::-webkit-scrollbar{display:none}
.map-strip:empty{display:none}
/* 備選的地圖：底下是類型標籤（不是一家一家的卡片），點了地圖只顯示那一類 */
.map-strip.types{scroll-snap-type:none;align-items:center;gap:6px;padding-bottom:8px}
.map-strip.types .chip{flex:none;height:32px;padding:0 13px;font-size:13px;box-shadow:0 2px 8px rgba(60,40,20,.12);border-color:var(--line)}
.map-strip.types .chip small{margin-left:4px;font-size:11px;opacity:.7}
.pin[hidden]{display:none}
.ms-card{flex:none;width:min(240px,72vw);scroll-snap-align:center;display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid var(--line);
  border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(60,40,20,.12);font:inherit;color:var(--text);text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.ms-card.on{border-color:var(--c-fg);box-shadow:0 3px 12px rgba(60,40,20,.2)}
.ms-card b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c-fg);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ms-card.alt b{background:#fff;color:var(--c-fg);border:1.5px dashed var(--c-fg)}
.ms-card.nonum b{width:10px;height:10px;margin-top:5px}
.ms-txt{min-width:0;flex:1}
.ms-txt div{font-size:14px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-txt span{display:block;margin-top:2px;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin.on{z-index:3}
.pin.on b{transform:scale(1.25);transition:transform .15s}
.map-view.far .pin.on span{display:block}
.map-zoom button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--text2);font-size:17px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 1px 4px rgba(60,40,20,.12)}
.map-zoom button:active{transform:scale(.94)}
.map-zoom i{display:block;line-height:1}
.pin{position:absolute;transform:translate(-11px,-11px);display:flex;align-items:center;gap:4px;padding:0;border:0;background:none;cursor:pointer;font:inherit;white-space:nowrap}
.pin b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c-fg);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pin.alt b{border-style:dashed;border-color:var(--c-fg);background:#fff;color:var(--c-fg)}
.pin span{max-width:110px;overflow:hidden;text-overflow:ellipsis;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.92);color:var(--text);
  font-size:11px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pin.dim{opacity:.45}
.map-view.far .pin span{display:none}   /* 拉遠時只留編號圓點，店名才不會疊在一起 */
/* 編輯列蓋掉天數列，高度跟天數列一樣（30px），進出編輯時頁首不會跳動 */
.editbar{display:none;align-items:center;gap:6px;height:30px;margin:0 0 10px;padding:0;background:none;color:var(--accent-fg);font-size:13px;font-weight:600}
.editing .editbar{display:flex}
.editing .tabs,.editing .tabs-row{display:none}
.eb-label{flex:1}
.eb-btn{height:26px;padding:0 12px;border-radius:999px;border:0;background:var(--accent-bg);color:var(--accent-fg);font-size:13px;font-weight:600;cursor:pointer}
.eb-btn.done{background:var(--accent-fg);color:#fff}
.car.stale,.car-line.stale{opacity:.5}
.car .q{margin-left:2px;font-weight:600}
.rt-list{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.rt-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
.rt-row:last-child{border-bottom:0}
.rt-row input{flex:none;width:18px;height:18px;accent-color:var(--accent-fg)}
.rt-row .rt-main{flex:1;min-width:0}
.rt-main>span{display:block}
.rt-row .rt-names{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row .rt-val{font-weight:600}
.rt-row .rt-val s{color:var(--muted);font-weight:400;margin-right:4px}
.rt-row .rt-sub{font-size:12px;color:var(--muted)}
.rt-row.off{opacity:.55}
.ed-travel{display:flex;gap:8px;align-items:center}
.ed-travel .seg{flex:1;min-width:0}
.ed-tmin{flex:none;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text2)}
.sheet .ed-tmin input{width:58px;height:36px;padding:0 6px;text-align:center}
.ed-travel-st{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.5}
.ed-travel-foot{display:flex;align-items:flex-start;gap:10px;margin-top:6px}
.ed-travel-foot .ed-travel-st{flex:1;min-width:0;margin-top:2px}
.ed-switch.sm{flex:none;margin:0;gap:6px;font-size:12px;color:var(--text2)}
.ed-switch.sm input.sw{width:34px;height:20px;border-radius:10px}
.ed-switch.sm input.sw::after{top:2px;left:2px;width:16px;height:16px}
.ed-switch.sm input.sw:checked::after{transform:translateX(14px)}
.ed-tfix{flex:1;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;background:#EFEBE5;font-size:14px;font-weight:600;color:var(--text)}   /* 手動填：只剩當時選的交通方式 */
.seg.ed-modes .md-min{margin-left:4px}
.seg.ed-modes .seg-thumb{width:calc((100% - 6px) / var(--n, 2));transform:translateX(calc(var(--i, 0) * 100%))}   /* 交通方式的數量不固定 */
.seg.ed-modes button{display:inline-flex;align-items:center;justify-content:center;gap:4px}
.seg.ed-modes button[disabled]{opacity:.4}
.eb-st{font-weight:400;color:var(--text2)}
.eb-st.err{border:0;background:none;padding:0;font:inherit;font-weight:600;color:#C2412D;cursor:pointer}
.tl-msg{position:absolute;left:52px;right:0;top:40px;text-align:center;font-size:14px;line-height:1.7;color:var(--muted);z-index:5;pointer-events:none}
.edit-ic{display:none;position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.75);
  align-items:center;justify-content:center;font-size:13px}
.edit-ic i{display:block;line-height:1}
.blk.compact .edit-ic{top:50%;transform:translateY(-50%)}
.editing .edit-ic{display:flex}
.editing .nav{display:none}
.sub-ed{display:none;align-self:center;width:22px;height:22px;flex:none;border-radius:50%;background:var(--line);color:var(--text2);
  align-items:center;justify-content:center;font-size:12px}
.sub-ed i{display:block;line-height:1}
.editing .sub-ed{display:flex}
.editing .stop{cursor:pointer}
/* 拖曳 */
/* 卡片長按＝編輯，不要選取文字或跳出系統的「拷貝」選單 */
.layer .blk,.layer .grp,.cand-page .blk,.st-row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.blk,.grp,.stop{transition-property:height,top,transform,background-color}
.pressing{transform:scale(.97);transition:transform .55s ease!important}
.stop.pressing{transform:none;background:rgba(0,0,0,.04)}
.dragging{pointer-events:none;opacity:.4}   /* 卡片留在原位變半透明，虛線框標出新位置 */
.drop-target{box-shadow:inset 0 0 0 2px var(--accent-fg)}
/* 拖進展開的卡片：整張虛線框，插入的位置畫一條線 */
.drop-into{box-shadow:inset 0 0 0 2px var(--accent-fg)}
.drop-into .list{background:color-mix(in srgb,var(--c-bg,var(--eat-bg)) 60%,#fff)}
.stop.ins,.add-sub.ins{box-shadow:0 -3px 0 var(--accent-fg)}
/* 把某一站／某個選項拖出來：原本那列變淡，手指下面跟著一張小卡片；時間軸上標出會放在幾點 */
.stop.sub-dragging{opacity:.3}
.sub-ghost{position:fixed;z-index:40;pointer-events:none;background:#fff;border-radius:10px;padding:8px 12px;margin:0;
  box-shadow:0 10px 24px rgba(60,30,10,.22);opacity:.92;border:0}
.sub-ghost .nav,.sub-ghost .sub-ed{display:none}
.drop-slot{position:absolute;left:50px;right:4px;z-index:4;border-top:2px dashed var(--accent-fg);pointer-events:none}
.drop-box{position:absolute;left:4px;right:0;z-index:31;border:2px dashed var(--accent-fg);border-radius:8px;pointer-events:none;
  background:color-mix(in srgb,var(--accent-fg) 6%,transparent)}
.drop-box span{position:absolute;left:6px;top:4px;font-size:12px;font-weight:600;color:var(--accent-fg);background:var(--bg,#fff);
  padding:1px 6px;border-radius:4px;box-shadow:0 1px 4px rgba(60,30,10,.18)}
.drop-slot span{position:absolute;left:0;top:2px;font-size:11px;font-weight:600;color:var(--accent-fg);background:var(--bg,#fff);padding:0 4px;border-radius:4px}
.drag-on .blk:not(.dragging),.drag-on .grp:not(.dragging){transition:box-shadow .12s}
.add-sub{display:none;width:100%;height:38px;margin:6px 0 4px;border:1px dashed var(--border);border-radius:10px;background:#fff;
  color:var(--text2);font-size:14px;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.editing .add-sub{display:flex}
/* 可展開的卡片：右上角是展開箭頭，鉛筆改放在標題後面，兩個按鈕才不會擠在一起 */
.grp .head .t{display:flex;align-items:center;gap:4px;min-width:0}
.grp .head .edit-ic{position:static;flex:none;margin-left:4px}
.grp .chev{padding:4px;margin:-4px}
.editing .blk,.editing .grp{cursor:pointer}
.editing .cards{cursor:copy}
.clash{box-shadow:inset 0 0 0 2px #E24B4A}
.tag-ok{white-space:nowrap}
.tag-q{white-space:nowrap;opacity:.8}
.sh-pending{margin-top:14px;padding:10px 12px;border-radius:10px;background:#FAF7F3;font-size:13px;line-height:1.5;color:var(--text2)}
.fab{position:fixed;right:max(20px,calc(50vw - 220px));bottom:calc(24px + env(safe-area-inset-bottom));z-index:40;width:52px;height:52px;border-radius:50%;
  border:0;background:var(--accent-fg);color:#fff;font-size:24px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(60,30,10,.22);cursor:pointer}
.fab i{display:block;line-height:1}
.editing .fab.day{display:flex}
/* ＋ 上方的淺色小按鈕：計算這天的交通（樣式跟頁首的編輯按鈕一樣，不搶 ＋ 的風頭） */
.fab-sub{position:fixed;right:calc(max(20px,calc(50vw - 220px)) + 7px);bottom:calc(88px + env(safe-area-inset-bottom));z-index:40;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:#fff;color:var(--accent-fg);font-size:18px;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(60,30,10,.12);cursor:pointer}
.fab-sub i{display:block;line-height:1}
.editing .fab-sub.day{display:flex}
.editing .toast{bottom:calc(140px + env(safe-area-inset-bottom))}   /* 編輯模式右下有兩顆按鈕，提示往上移 */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:10px 14px;border-radius:12px;background:#2b2622;color:#fff;font-size:14px;
  transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{flex:none;white-space:nowrap;border:0;background:none;color:#F7C9A8;font-size:14px;font-weight:600;padding:4px;cursor:pointer}
/* 編輯面板 */
.ed-field{display:block;margin-top:16px}
.ed-lab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.ed-lab-hint{font-weight:400;margin-left:4px}
.ed-lab-row{display:flex;align-items:center;gap:8px}
.ed-lab-row .ed-lab{flex:1;min-width:0}
.swap-btn{flex:none;display:inline-flex;align-items:center;gap:4px;margin:-6px -6px 0 0;padding:4px 8px;border:0;border-radius:999px;background:none;color:var(--accent-fg);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.swap-btn.open,.swap-btn:active{background:var(--accent-bg)}
#edSwapWrap .cand-drop{margin:0 0 8px}
.map-status{margin-top:6px;font-size:13px;line-height:1.5;color:var(--text2)}
.map-status i{vertical-align:-1px}
.map-status .ok{color:#3F5E3A;font-weight:600}
.map-status a{color:var(--accent-fg)}
.sheet input[type=text],.sheet input[type=password],.sheet input[type=time],.sheet textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--border);
  border-radius:10px;background:#fff;color:var(--text);font-family:inherit;-webkit-appearance:none;appearance:none}
.sheet input[type=time]{width:auto;min-width:120px}
.sheet textarea{resize:vertical;line-height:1.5}
.sheet input:focus,.sheet textarea:focus{outline:2px solid var(--accent-bg);border-color:var(--accent-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:14px;color:var(--text2);cursor:pointer}
.chip.on{border-color:transparent;background:var(--accent-bg);color:var(--accent-fg);font-weight:600}
.chip.on.eat{background:var(--eat-bg);color:var(--eat-fg)}.chip.on.spa{background:var(--spa-bg);color:var(--spa-fg)}
.chip.on.cafe{background:var(--cafe-bg);color:var(--cafe-fg)}.chip.on.shop{background:var(--shop-bg);color:var(--shop-fg)}
.chip.on.bar{background:var(--bar-bg);color:var(--bar-fg)}.chip.on.see{background:var(--see-bg);color:var(--see-fg)}.chip.on.other{background:var(--other-bg);color:var(--other-fg)}
.ed-row{display:flex;align-items:center;gap:12px}
.ed-to{font-size:15px;color:var(--text2)}
.ed-dur{min-width:96px;text-align:center;font-size:15px;font-weight:600}
/* 時間：一行「開始 → 結束 ｜ − 長度 +」，三個格子差不多寬、撐滿整行（長度那格稍寬，放得下「1h40m」）；結束是自動算的（灰色、不能點）。下一行長度快選 */
.ed-time{display:flex;align-items:center;gap:4px}
.sheet .ed-time input[type=time]{min-width:0;width:0;flex:1 1 0;padding:10px 4px;text-align:center}
.ed-time input[type=time]::-webkit-calendar-picker-indicator{display:none}   /* 電腦版瀏覽器的時鐘圖示會把格子撐寬；點格子一樣會跳出選擇器 */
.ed-time input[type=time]::-webkit-date-and-time-value{text-align:center}
.ed-arrow{color:var(--muted);flex:none;font-size:14px;margin:0 6px}
.ed-endbox{flex:1 1 0;min-width:0;font-size:16px;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:#F7F5F2;color:var(--muted);line-height:normal;white-space:nowrap;text-align:center;overflow:hidden}
.ed-mid{font-size:12px;color:var(--muted);margin-top:4px}
.ed-len{flex:1.2 1 0;min-width:0;display:flex;align-items:center;justify-content:space-between;margin-left:6px;height:44px}
.ed-len .step{width:26px;height:26px;flex:none;border:0;background:var(--line)}
.ed-len .ed-dur{min-width:0;font-size:14px;white-space:nowrap}
.chips.sm{flex:1;min-width:0;margin:0 0 0 4px}
.chips.sm{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.chips.sm::-webkit-scrollbar{display:none}
.chips.sm{gap:5px}
/* 備選頁：跟時間軸一樣的彩色卡片，由上往下排 */
.cand-page{padding:16px 16px 96px;touch-action:pan-y pinch-zoom}
/* ---------- 我的旅程（示意，還沒接資料） ---------- */
.trips-page{padding:16px 16px 110px}
.on-trips .tabs,.on-trips .edit-btn,.on-trips .map-btn{display:none}
.on-trips.on-new .trip-new{display:none !important}
.trip-card{display:block;width:100%;margin:0 0 14px;padding:0;border:0;border-radius:16px;background:#fff;text-align:left;font:inherit;color:inherit;
  box-shadow:0 0 0 1px var(--line),0 2px 8px rgba(60,40,20,.06);overflow:hidden;cursor:pointer}
.trip-cover{position:relative;height:132px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center}
.trip-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.trip-cover .en{font-family:"Isometra",cursive;font-size:34px;color:var(--accent-fg)}
.trip-badge{position:absolute;top:10px;right:10px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--accent-fg);font-size:12px;font-weight:600}
.trip-body{display:block;padding:12px 16px 14px}
.trip-name{font-size:16px;font-weight:600;line-height:1.35}
.trip-meta{margin-top:3px;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.trip-card.past{box-shadow:0 0 0 1px var(--line)}
.trip-card.past .trip-cover{height:76px;background:#F1EEEA}
.trip-card.past .trip-cover .en{font-size:26px;color:var(--muted)}
.trip-demo{margin-left:6px;font-size:11px;font-weight:400;color:var(--muted)}
.trip-new{position:fixed;right:max(20px,calc(50vw - 220px));bottom:calc(24px + env(safe-area-inset-bottom));z-index:40;height:46px;padding:0 18px 0 14px;border:0;border-radius:999px;
  background:var(--accent-fg);color:#fff;font:inherit;font-size:15px;font-weight:600;display:none;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(60,30,10,.22);cursor:pointer}
.trip-new i{font-size:20px;line-height:1}
.on-trips .trip-new{display:flex}
/* 總覽頁副標題：點了回到「我的旅程」 */
.trip-sw{display:inline-flex;align-items:center;gap:3px;max-width:100%;padding:3px 8px 3px 11px;border:0;border-radius:999px;background:#F3EFEA;
  font:inherit;font-size:13px;color:var(--text2);cursor:pointer;vertical-align:middle}
.trip-sw i{font-size:14px;line-height:1;color:var(--muted)}
.editing .trip-sw{pointer-events:none;opacity:.5}
.trip-sw span{min-width:0;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-members{display:flex;flex-wrap:wrap;gap:6px}
.ov-members span:not(.ov-empty){padding:4px 10px;border-radius:999px;background:#F3EFEA;font-size:13px;color:var(--text)}
.inv{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.inv-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:#fff;font:inherit;text-align:left;color:var(--text);cursor:pointer}
.inv-btn > i:first-child{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-bg);color:var(--accent-fg);font-size:18px;display:flex;align-items:center;justify-content:center}
.inv-btn > span{flex:1;min-width:0}
.inv-btn b{display:block;font-size:15px}
.inv-btn small{display:block;margin-top:1px;font-size:12px;color:var(--text2)}
.inv-btn > i:last-child:not(:first-child){color:var(--muted);font-size:18px}
.ov-stays{display:flex;flex-direction:column;gap:8px}
.ov-sec-row{display:flex;align-items:baseline}
.ov-sec-act{margin-left:auto;padding:0;border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--accent-fg);cursor:pointer}
button.ov-stay{width:100%;font:inherit;text-align:left;cursor:pointer}
.ov-stay.add > i:last-child{color:var(--accent-fg)}
/* 住宿列表：左邊編號圈圈＋虛線串起第一間、第二間…，右邊卡片是照片、名稱、日期、晚數 */
.st-list{display:flex;flex-direction:column;gap:12px}
.st-item{position:relative;display:flex;align-items:center;gap:10px}
.st-item + .st-item::before{content:"";position:absolute;left:13px;bottom:50%;height:calc(100% + 12px - 28px);margin-bottom:14px;border-left:1.5px dashed var(--line)}
.st-step{flex:none;position:relative;z-index:1;width:28px;height:28px;border:1.5px solid;border-radius:50%;background:var(--page);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.st-row{flex:1;min-width:0;text-decoration:none;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border:1px solid var(--border);border-radius:16px;background:#fff;font:inherit;text-align:left;color:var(--text);cursor:pointer;box-shadow:0 1px 4px rgba(60,40,20,.06)}
.st-pic{flex:none;position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px}
.st-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.st-row > span:nth-child(2){flex:1;min-width:0}
.st-row b{display:block;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st-row small{display:block;margin-top:3px;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-row small.st-n{margin-top:1px}
.st-row > i:last-child{color:var(--muted);font-size:18px}
.st-list + .wiz-add{margin-top:6px}
/* 住處資訊：地址一行一行，點了複製 */
.st-addrs{display:flex;flex-direction:column;gap:6px}
.st-al{display:flex;align-items:flex-start;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;font:inherit;text-align:left;color:var(--text);cursor:pointer}
.st-al span{flex:1;min-width:0;font-size:15px;line-height:1.5;user-select:text;-webkit-user-select:text}
.st-al i{flex:none;color:var(--muted);font-size:17px;margin-top:3px}
.st-al-wait{font-size:12px;color:var(--muted)}
.st-when{font-size:15px;color:var(--text)}
.st-photo .clr-wrap{display:none}   /* 住處照片只留「上傳」，不用貼網址 */
.st-photo .ph-row{justify-content:flex-end}
/* 編輯住處：地址放大放明顯，點了開 Google 地圖 */
.st-addr{display:flex;align-items:center;gap:10px;margin:-2px 0 14px;padding:4px 2px;color:var(--text);text-decoration:none}
.st-addr > i:first-child{flex:none;font-size:22px;color:var(--accent-fg)}
.st-addr > span{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.4}
.st-addr small{display:block;font-size:11px;font-weight:400;color:var(--text2);margin-bottom:1px}
.st-addr > i:last-child{flex:none;color:var(--muted);font-size:18px}
.st-cal + .st-cal{margin-top:8px}
.st-cal .cal-h{justify-content:center}
.cal-d.out{color:#D5CEC5;cursor:default;display:flex;align-items:center;justify-content:center}
/* 其他住處：半透明的粗色帶蓋在數字上（像螢光筆），從入住日中間畫到退房日中間 */
.cal-bar{position:absolute;top:2px;bottom:2px;z-index:2;opacity:.22;pointer-events:none}   /* 跟選取中的範圍一樣粗 */
.cal-bar.r{left:50%;right:0}
.cal-bar.l{left:0;right:50%}
.cal-bar.r.end{left:calc(50% - 18px);border-radius:18px 0 0 18px}   /* 入住日：圓頭從數字開始 */
.cal-bar.l.end{right:calc(50% - 18px);border-radius:0 18px 18px 0}   /* 退房日：圓頭停在數字 */
.st-legend{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:12px;color:var(--text2)}
.st-legend i{display:inline-block;width:16px;height:10px;margin-right:6px;border-radius:5px;vertical-align:-1px;opacity:.3}
.ov-stay{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:#fff;color:var(--text);text-decoration:none}
.ov-stay > i:first-child{flex:none;width:34px;height:34px;border-radius:50%;background:var(--other-bg);color:var(--other-fg);font-size:18px;display:flex;align-items:center;justify-content:center}
.ov-stay > span{flex:1;min-width:0}
.ov-stay b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-stay small{display:block;margin-top:1px;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-stay > i:last-child{color:var(--muted);font-size:18px}
.seg.ed-modes.m3 button{font-size:13px;gap:2px}
.ov-hero{position:relative;display:block;width:100%;margin:0 0 14px;padding:0;border:0;border-radius:16px;background:none;text-align:left;font:inherit;cursor:pointer}
.ov-hero .cover{height:160px}
.ov-hero.has .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,14,10,.55),rgba(20,14,10,0) 55%)}
.ov-hero .cover .en{margin-bottom:34px}
.ov-hero-t{position:absolute;left:16px;right:56px;bottom:12px;color:var(--accent-fg)}
.ov-hero.has .ov-hero-t{color:#fff}
.ov-hero-t b{display:block;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-hero-t span{display:block;margin-top:1px;font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.ov-hero-cam{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:16px}
.setup{margin:0 0 16px;padding:12px 14px 6px;border-radius:16px;background:#FAF7F3}
.setup-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.setup-toggle{display:flex;align-items:center;gap:8px;padding:2px 0;border:0;background:none;font:inherit;color:var(--text);cursor:pointer}
.setup-toggle b{font-size:15px}
.setup-toggle span{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.setup-toggle i{font-size:16px;color:var(--muted);transition:transform .2s}
.setup:not(.fold) .setup-toggle i{transform:rotate(180deg)}
.setup-skip{margin-left:auto;padding:4px 0;border:0;background:none;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
/* 收合：列表高度動畫（grid 0fr ↔ 1fr） */
.setup-rows{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}
.setup-rows > *{min-height:0}
.setup-rows{overflow:hidden}
.setup.fold .setup-rows{grid-template-rows:0fr}
.setup.fold{padding-top:10px;padding-bottom:10px}   /* 收起來：只剩標題這一行，上下留白一樣 */
.setup.fold .setup-h{margin-bottom:0}
.setup-row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;font:inherit;text-align:left;color:var(--text);cursor:pointer}
.setup-row:first-of-type{border-top:0}
.setup-row > i:first-child{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--accent-fg);font-size:16px;display:flex;align-items:center;justify-content:center}
.setup-row > span{flex:1;min-width:0}
.setup-row b{display:block;font-size:14px}
.setup-row small{display:block;font-size:12px;color:var(--text2)}
.setup-row > i:last-child:not(:first-child){color:var(--muted)}
.setup-row.ok b{color:var(--muted);text-decoration:line-through}
.setup-row.ok > i:first-child{background:none;color:var(--spa-fg);font-size:22px}
.cv-prev{margin-top:16px;touch-action:none}
.cv-prev .cover{height:170px}
.cv-st{min-height:18px;margin-top:6px;font-size:12px;color:var(--text2)}
.cv-acts{display:flex;gap:8px;margin-top:6px}
.cv-acts .btn{flex:1;height:40px;font-size:14px}
.cv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cv-grid button{aspect-ratio:1;border:0;border-radius:10px;background:#EFEBE5 center/cover no-repeat;cursor:pointer}
.ov-foot{margin-top:28px;padding-top:2px;border-top:1px solid var(--line)}
.inv-btn.trip-set{margin-top:12px}
.inv-btn.trip-set > i:first-child{background:#F3EFEA;color:var(--text2)}
.inv-code{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:14px 16px;border-radius:14px;background:#FAF7F3}
.inv-code span{font-size:13px;color:var(--text2)}
.inv-code b{font-size:26px;font-weight:700;letter-spacing:.18em;color:var(--accent-fg);font-variant-numeric:tabular-nums}
.inv-code small{flex-basis:100%;font-size:12px;color:var(--text2)}
.sheet input.code-input{font-size:24px;letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums}
.share-text{margin-top:16px;padding:12px 14px;border-radius:12px;background:#FAF7F3;font-size:14px;line-height:1.6;color:var(--text);word-break:break-all;-webkit-user-select:text;user-select:text}
.inv-reset{align-self:center;margin-top:2px;padding:6px;border:0;background:none;font:inherit;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer}
.trips-empty{padding:60px 16px;text-align:center;font-size:14px;color:var(--text2);line-height:1.7}
.trips-empty small{display:block;margin-top:14px;font-size:12px;color:var(--muted)}
.trips-carry{margin-top:22px;text-align:center}
.trips-carry button{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1px solid var(--border);border-radius:999px;background:#fff;font:inherit;font-size:14px;color:var(--text);cursor:pointer}
.trips-carry small{display:block;margin:8px auto 0;max-width:280px;font-size:12px;line-height:1.5;color:var(--muted)}
.trips-empty .en{font-family:"Isometra",cursive;font-size:30px;color:var(--accent-fg);margin-bottom:8px}
/* ---------- 建立旅程（示意） ---------- */
.wiz{padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.wiz-prog{display:flex;gap:4px;margin:0 0 4px}
.wiz-prog span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wiz-prog span.on{background:var(--accent-fg)}
.wiz-h{margin:18px 0 2px;font-size:20px;font-weight:700}
.wiz-p{margin:0;font-size:14px;color:var(--text2);line-height:1.5}
.wiz input[type=text]{display:block;width:100%;min-height:44px;font-size:16px;padding:10px 12px;border:1px solid var(--border);
  border-radius:10px;background:#fff;color:var(--text);font-family:inherit;-webkit-appearance:none;appearance:none;text-align:left}
.wiz input:focus{outline:2px solid var(--accent-bg);border-color:var(--accent-fg)}
/* 日期：自己畫的月曆，第一下點出發、第二下點回程（iPhone 內建的日期選擇器一點開就會自動填今天） */
.cal{margin-top:2px;padding:10px 10px 6px;border:1px solid var(--border);border-radius:14px;background:#fff}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h b{font-size:15px;font-variant-numeric:tabular-nums}
.cal-h button{width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-h button:disabled{opacity:.3}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal-w{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 4px}
.cal-d{position:relative;height:40px;border:0;background:none;padding:0;font:inherit;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;cursor:pointer}
.cal-d span{position:relative;z-index:1;display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center}
.cal-d.past{color:var(--muted)}
.cal-d.today span{box-shadow:inset 0 0 0 1px var(--border)}
.cal-d.in::before,.cal-d.s.has-e::before,.cal-d.e::before{content:"";position:absolute;top:2px;bottom:2px;left:0;right:0;background:var(--accent-bg)}
.cal-d.s.has-e::before{left:50%}
.cal-d.e::before{right:50%}
.cal-d.s span,.cal-d.e span{background:var(--accent-fg);color:#fff;font-weight:600;box-shadow:none}
.wiz-note{margin-top:10px;font-size:13px;color:var(--text2);line-height:1.5}
.wiz-note.err{color:#C2412D}
.wiz-stay{margin-top:16px;padding:14px;border-radius:14px;background:#FAF7F3}
.wiz-stay .ed-field:first-child{margin-top:0}
.wiz-stay-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px}
.wiz-stay-h button{border:0;background:none;color:var(--muted);font-size:18px;padding:0;cursor:pointer}
.chips.nights{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips.nights::-webkit-scrollbar{display:none}
.chips.nights .chip{flex:none;height:32px;padding:0 12px;font-size:13px;font-variant-numeric:tabular-nums}
.wiz-add{display:flex;align-items:center;gap:6px;margin-top:12px;padding:0;border:0;background:none;font:inherit;font-size:15px;color:var(--accent-fg);cursor:pointer}
.wiz-opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.wiz-opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:14px;background:#fff;font:inherit;text-align:left;color:var(--text);cursor:pointer}
.wiz-opt > i{flex:none;width:36px;height:36px;border-radius:50%;background:#F3EFEA;color:var(--text2);font-size:19px;display:flex;align-items:center;justify-content:center}
.wiz-opt b{display:block;font-size:15px}
.wiz-opt small{display:block;margin-top:1px;font-size:12px;color:var(--text2)}
.wiz-opt.on{border-color:var(--accent-fg);background:#FFFBF8}
.wiz-opt.on > i{background:var(--accent-bg);color:var(--accent-fg)}
.wiz-opts.grid{display:grid;grid-template-columns:1fr 1fr;margin-top:0}
.wiz-opts.grid .wiz-opt{padding:10px 12px;gap:8px}
.wiz-opts.grid .wiz-opt > i{width:30px;height:30px;font-size:16px}
.wiz-opts.grid .wiz-opt small{display:none}
.ps-field{position:relative}
.tl-add{position:absolute;left:4px;right:0;z-index:3;height:40px;border:1px dashed transparent;border-radius:12px;background:#FAF7F3;color:var(--accent-fg);font:inherit;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tl-add.empty{height:auto;padding:22px 12px;flex-direction:column;gap:2px;font-size:15px}
.tl-add.empty i{font-size:22px}
.tl-add small{font-size:12px;font-weight:400;color:var(--text2)}
.editing .tl-add{display:none}
.af-s1{min-height:72vh}
.af-search{position:relative}
.af-search > i{position:absolute;left:12px;top:13px;color:var(--muted);font-size:18px;z-index:1}
.sheet .af-search input{padding-left:38px}
.af-plain[hidden]{display:none}
.af-plain{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:#fff;font:inherit;text-align:left;color:var(--text);cursor:pointer}
.af-plain > i{flex:none;width:32px;height:32px;border-radius:50%;background:#F3EFEA;color:var(--text2);font-size:17px;display:flex;align-items:center;justify-content:center}
.af-plain small{display:block;font-size:12px;color:var(--text2)}
.af-cands{display:flex;flex-wrap:wrap;gap:6px}
.af-cands .chip{height:32px;padding:0 12px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.af-card{margin-top:14px;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff}
.af-mapwrap{position:relative}
.af-map{position:relative;height:170px;background:#EFEBE5}
.af-map.nomap::after{content:"地圖載入不了，位置以 Google 的資料為準";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.af-pin{position:absolute;transform:translate(-50%,-100%);font-size:34px;line-height:1;color:var(--accent-fg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));pointer-events:none}
.af-recenter{position:absolute;right:10px;bottom:10px;z-index:2;width:36px;height:36px;border:0;border-radius:50%;background:#fff;color:var(--accent-fg);font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
.af-recenter[hidden]{display:none}
.af-info{padding:12px 14px 4px}
.af-info b{font-size:16px}
.af-rate{margin-left:8px;font-size:13px;color:#B7791F}
.af-info small{display:block;margin-top:2px;font-size:13px;color:var(--text2);line-height:1.45}
.af-acts{display:flex;gap:8px;padding:10px 14px 14px}
.af-acts .btn{flex:1;height:42px;font-size:15px}
.af-time{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sheet .af-time input[type=time]{width:auto;min-width:120px}
.af-end{font-size:16px;color:var(--text2);font-variant-numeric:tabular-nums}
.ps-list{position:absolute;left:0;right:0;top:100%;z-index:30;margin-top:4px;padding:4px;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(60,40,20,.14)}
.ps-list[hidden]{display:none}
.ps-list button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;font:inherit;text-align:left;color:var(--text);cursor:pointer}
.ps-list button:active,.ps-list button:hover{background:#FAF7F3}
.ps-list i{flex:none;color:var(--muted);font-size:17px}
.ps-list span{min-width:0}
.ps-list b{display:block;font-size:15px;font-weight:600}
.ps-list small{display:block;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-lab-hint .ti-map-pin-check{color:var(--spa-fg)}
.cover{position:relative;display:flex;align-items:center;justify-content:center;height:150px;border-radius:16px;overflow:hidden;background:var(--accent-bg)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .en{font-family:"Isometra",cursive;font-size:34px;color:var(--accent-fg);padding:0 16px;text-align:center;line-height:1.1}
.wiz-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:480px;margin:0 auto;display:none;gap:8px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--page);border-top:1px solid var(--line)}
.on-new .wiz-bar{display:flex}
.wiz-bar .btn.ghost{min-width:96px}
.cand-page .blk{position:relative;left:auto;right:auto;margin-bottom:8px;padding-bottom:8px}
.cand-page .blk .d{-webkit-line-clamp:2}
.btn.cand-import{width:100%;margin-bottom:12px;gap:6px}
.cand-bar{display:flex;align-items:center;margin-bottom:12px}
.cand-chips{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.cand-chips::-webkit-scrollbar{display:none}
/* 跟天數列一樣：還能往左／往右滑時，該側邊緣淡出 */
.cand-chips{--fl:0px;--fr:0px;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);
          mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
.cand-chips.fade-l{--fl:24px}
.cand-chips.fade-r{--fr:24px}
.chips.sm.cand-filter{flex-wrap:nowrap;width:max-content;margin:0}
.chips.sm.cand-filter .chip,.cand-sortbtn{box-sizing:border-box;height:26px;line-height:1;-webkit-appearance:none;appearance:none}   /* 標籤和切換鈕一樣高 */
.chips.sm.cand-filter .chip{flex:none;padding:0 10px;font-size:12px}
.cand-sep{flex:none;width:1px;height:20px;margin:0 8px;background:var(--border)}
.cand-chips:empty + .cand-sep{display:none}   /* 標籤往左滑時被這條線擋住，不會蓋到切換鈕 */
.cand-sortbtn{flex:none;width:34px;margin-left:auto;padding:0;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cand-sortbtn i{line-height:1}
.cand-sortbtn.flip i{animation:sortSpin .3s ease}
@keyframes sortSpin{from{transform:rotate(-90deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.cand-list.anim{animation:dropIn .22s ease}
.clr-wrap{position:relative;display:block;flex:1;min-width:0}
.sheet .clr-wrap input{padding-right:40px}
.clr-btn{position:absolute;top:50%;right:4px;width:32px;height:32px;margin-top:-16px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:15px;display:grid;place-items:center;cursor:pointer}
.clr-btn:active{background:var(--line)}
.clr-wrap input:placeholder-shown + .clr-btn,.clr-wrap input:disabled + .clr-btn{display:none}
.cand-grp{display:flex;align-items:center;gap:6px;margin:14px 0 6px;font-size:13px;font-weight:600;color:var(--c-fg);background:none}
.cand-grp b{font-size:11px;font-weight:600;color:var(--muted)}
.im-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.im-list:empty{display:none}
.im-row{position:relative;padding:10px;border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;gap:6px}
.im-row input[type=text],.im-row select{width:100%;height:38px;padding:0 10px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:16px;background:#fff;color:inherit;min-width:0}
.im-top{display:flex;align-items:center;gap:8px}
.im-top .im-use{flex:none;width:20px;height:20px;accent-color:var(--accent-fg)}
.im-top .im-name{font-weight:600}
.im-row2{display:flex;gap:6px}
.im-note{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.im-note i{flex:none;font-size:14px}
.im-facts{font-size:12px;color:var(--text2);padding:0 2px}
.im-note:empty{display:none}
.im-wait{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;padding-right:28px}
.im-wait b{font-weight:inherit;display:flex;align-items:center;gap:4px}
.im-wait b i{flex:none}
.im-wait span{font-size:11px;word-break:break-all;opacity:.8}
.im-row.bad .im-wait{color:#B23B3B}
.im-lhead{display:flex;align-items:center;gap:6px;font-size:14px;padding:2px 2px 0}
.im-lhead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im-lhead span{font-size:12px;color:var(--muted);flex:none}
.im-lhead button{flex:none;border:0;background:none;color:var(--accent-fg);font:inherit;font-size:12px;padding:4px 0 4px 4px;cursor:pointer}
.im-row.im-lite{padding:8px 10px;gap:4px}
.im-row.im-listhead{border:0;padding:4px 0 0}
.im-x{position:absolute;top:6px;right:6px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:inherit;font-size:16px;cursor:pointer}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips.sm .chip{height:30px;padding:0 4px;font-size:13px;flex:1 1 0;min-width:0}   /* 每個長度標籤一樣寬，平均排滿一行 */
#edCls .chip,#sbCls .chip,#afCls .chip{flex:none;height:30px;padding:0 12px;font-size:13px}   /* 類型標籤跟日期、長度標籤一樣大 */
/* 類型標籤維持一行：排不下就左右滑，還能滑的那一側邊緣淡出（之後類型會變多） */
#edCls,#sbCls,#edDay,#afCls,#afDay{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;--fl:0px;--fr:0px;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);
          mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
#edCls::-webkit-scrollbar,#sbCls::-webkit-scrollbar,#edDay::-webkit-scrollbar,#afCls::-webkit-scrollbar,#afDay::-webkit-scrollbar{display:none}
#edCls.fade-l,#sbCls.fade-l,#edDay.fade-l,#afCls.fade-l,#afDay.fade-l{--fl:24px}
#edCls.fade-r,#sbCls.fade-r,#edDay.fade-r,#afCls.fade-r,#afDay.fade-r{--fr:24px}
/* 加入行程的日期：跟頁首的天數一樣是正圓數字，「備選」是膠囊 */
#afDay{gap:4px;align-items:flex-start}
.af-dd{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:42px;padding:0;border:0;background:none;font:inherit;cursor:pointer}
.af-dd .chip{width:34px;height:34px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.af-dd.on .chip{border-color:transparent;background:var(--accent-bg);color:var(--accent-fg);font-weight:600}
.af-dd small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.af-dd.on small{color:var(--accent-fg)}
#afDay .chip.cand{flex:none;height:34px;padding:0 12px;border-radius:999px;margin-left:4px}
#edDay .chip{flex:1 0 auto;min-width:30px;padding:0 6px}   /* 天數少：平均排滿一行；天數多到放不下：不再縮小，改成左右滑 */
.chips.sm.day-chips .chip{white-space:nowrap}
.btn.cand-open{width:100%;justify-content:flex-start;gap:8px;margin-top:16px}   /* 跟其他欄位一樣隔 16px */
.cand-open .cnt{margin-left:auto;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-bg,#f3e6dc)}
.cand-pick{display:flex;flex-direction:column;gap:6px}
.sh-head + .day-pick{margin-top:16px}
.cand-drop{margin-top:8px;padding:8px;border:1px solid var(--border);border-radius:12px;animation:dropIn .18s ease}
.cand-drop .cand-pick{max-height:248px;overflow-y:auto;margin:0;-webkit-overflow-scrolling:touch}
.cand-drop .cp-filter{flex-wrap:nowrap;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.cand-drop .cp-filter::-webkit-scrollbar{display:none}
.cand-drop .cp-filter .chip{flex:none;padding:0 12px}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.cand-chev{transition:transform .18s ease}
.cand-open.open .cand-chev{transform:rotate(180deg)}
.sheet.swap > *:not(.grab){animation:dropIn .2s ease}   /* 跟標題隔開，跟編輯面板的欄位間距一樣 */
.cp-item[hidden]{display:none}
.cp-main{flex:1;min-width:0;display:flex;flex-direction:column}
.cp-desc{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-item{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 12px;border:0;border-radius:8px;background:var(--c-bg,var(--eat-bg));text-align:left;font:inherit;color:inherit;cursor:pointer}
.cp-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c-fg,var(--accent-fg))}
.cp-name{min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-dur{flex:none;font-size:12px;opacity:.7}
.day-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dp-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;height:52px;border:1px solid var(--border);border-radius:10px;background:#fff;font:inherit;color:inherit;cursor:pointer}
.dp-day b{font-size:16px}
.dp-day small{font-size:11px;opacity:.7}
.dp-day.on{background:var(--accent-fg);border-color:var(--accent-fg);color:#fff}
.dp-day.on small{opacity:.9}
.dp-theme{font-size:13px;color:var(--muted);margin-top:8px}
.dp-theme:empty{display:none}
.dp-list{display:flex;flex-direction:column;gap:4px}
.dp-row{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 10px;border:0;border-radius:8px;background:var(--c-bg);color:var(--c-fg);font:inherit;text-align:left;cursor:pointer;width:100%}
.dp-row .tm{flex:none;font-size:12px;font-variant-numeric:tabular-nums;opacity:.8}
.dp-row .nm{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-row .tag{flex:none;font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:#fff}
.dp-row.me{background:#fff;border:2px dashed var(--c-fg);cursor:default}
.dp-row.hit{box-shadow:inset 0 0 0 2px #E24B4A}
.dp-row.hit .tag{color:#E24B4A}
.chips.sm.day-chips .chip.cand{flex:0 0 auto;padding:0 10px}   /* 「備選」兩個字，不跟數字一樣窄 */
.step{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--text);font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.ed-check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px}
.ed-check input{width:20px;height:20px;accent-color:var(--accent-fg)}
.ed-check span{color:var(--muted);font-size:13px}
/* 開關（已訂位、後面的行程自動移動） */
/* 編輯面板的分段線：整條拉到面板左右邊緣 */
.ed-sep{border:0;border-top:1px solid var(--line);margin:20px -18px 0}
.ed-switch{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;cursor:pointer}
.ed-switch small{color:var(--muted);font-size:13px}
input.sw{-webkit-appearance:none;appearance:none;width:44px;height:26px;margin:0;border-radius:13px;background:var(--border);position:relative;flex:none;cursor:pointer;transition:background .2s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
input.sw:checked{background:var(--accent-fg)}
input.sw:checked::after{transform:translateX(18px)}
input.sw:focus-visible{outline:2px solid var(--accent-bg);outline-offset:2px}
.ed-lock,.ed-hint{margin-top:12px;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.5}
.ed-lock{background:#FFF1E2;color:#8A4B22}
.ed-hint{background:var(--line);color:var(--text2)}
.err{color:#C2412D;font-size:13px;margin-top:6px}
.ed-actions{position:sticky;z-index:5;bottom:calc(-24px - env(safe-area-inset-bottom));display:flex;gap:8px;margin:20px -18px 0;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.btn{height:44px;padding:0 16px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;justify-content:center}
.btn.ghost{border:1px solid var(--border);background:#fff;color:var(--text)}
.btn.danger{color:#C2412D;border-color:#F2C9C0}
.btn.primary{flex:1;border:0;background:var(--accent-fg);color:#fff}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="editbar"><span class="eb-label"><i class="ti ti-pencil"></i> <span id="ebDay"></span>編輯中 · <span id="ebSt" class="eb-st">點空白處新增</span></span>
      <button type="button" class="eb-btn" id="editCancel">取消</button><button type="button" class="eb-btn done" id="editDone">完成</button></div>
    <div class="tabs-row">
    <nav class="tabs"><div class="tabs-in">
      <button class="tab" data-page="overview">總覽</button><button class="tab day" data-page="d1" aria-label="第 1 天">1</button><button class="tab day" data-page="d2" aria-label="第 2 天">2</button>
      <button class="tab day" data-page="d3" aria-label="第 3 天">3</button><button class="tab day" data-page="d4" aria-label="第 4 天">4</button><button class="tab day" data-page="d5" aria-label="第 5 天">5</button>
      <button class="tab day" data-page="d6" aria-label="第 6 天">6</button><button class="tab day" data-page="d7" aria-label="第 7 天">7</button><button class="tab day" data-page="d8" aria-label="第 8 天">8</button><button class="tab" data-page="cand">備選</button>
    </div></nav></div>
    <div class="day-title" id="dayTitle"></div>
    <div class="day-sub" id="daySub"></div>
    <button type="button" class="map-btn" id="mapBtn" aria-label="看地圖" hidden><i class="ti ti-map"></i></button>
    <button type="button" class="edit-btn" id="editBtn" aria-label="編輯行程"><i class="ti ti-pencil"></i></button>
  </header>
  <div class="tl" id="tl"></div>
  <div class="ov" id="ov" hidden></div>
  <div class="cand-page" id="cand" hidden></div>
  <div class="trips-page" id="trips" hidden></div>
  <div class="wiz" id="wiz" hidden></div>
  <div class="map-view" id="mapView" hidden><div class="gmap" id="gmap"></div><div class="map-msg" id="mapMsg"></div>
    <div class="map-cover" aria-hidden="true"></div>
    <div class="map-strip" id="mapStrip"></div>
    <div class="map-zoom"><button type="button" data-zoom="1" aria-label="放大"><i class="ti ti-plus"></i></button><button type="button" data-zoom="-1" aria-label="縮小"><i class="ti ti-minus"></i></button></div></div>
</div>
<div class="wiz-bar"><button type="button" class="btn ghost" id="wizBack">取消</button><button type="button" class="btn primary" id="wizNext">下一步</button></div>
<button type="button" class="trip-new" id="tripNew"><i class="ti ti-plus"></i>建立旅程</button>
<button type="button" class="fab" id="fab" aria-label="新增行程"><i class="ti ti-plus"></i></button>
<button type="button" class="fab-sub" id="routeFab" aria-label="計算這天的交通時間"><i class="ti ti-route"></i></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"></div>
<script>
const PX = 1.25;                     // 1 分鐘 = 1.25px（1 小時 = 75px）
const tl = document.getElementById('tl');
const tabsEl = document.querySelector('.tabs');
function updateTabFade() {
  const max = tabsEl.scrollWidth - tabsEl.clientWidth;
  tabsEl.classList.toggle('fade-l', tabsEl.scrollLeft > 2);
  tabsEl.classList.toggle('fade-r', tabsEl.scrollLeft < max - 2);
}
tabsEl.addEventListener('scroll', updateTabFade, { passive: true });

const editIc = '<span class="edit-ic" aria-hidden="true"><i class="ti ti-pencil"></i></span>';
const subEditIc = '<span class="sub-ed" aria-hidden="true"><i class="ti ti-pencil"></i></span>';
// 合併區塊裡的店家、多選一選項的筆記（筆記可能是 PDF 整理的，也可能是自己寫的）
const subNoteKey = sub => sub.note || sub.orig || sub.name;

const expanders = [];
function makeExpander(el, top, h, trigger) {
  el.style.height = h + 'px';
  place(el, top);
  if (!live) return;
  const ex = { el, top, h, trigger };
  expanders.push(ex);
  trigger.setAttribute('aria-expanded', 'false');
  const toggle = () => {
    const open = el.classList.toggle('open');
    trigger.setAttribute('aria-expanded', open);
    const chev = trigger.querySelector('.chev');
    if (chev) chev.className = 'ti chev ' + (open ? 'ti-chevron-up' : 'ti-chevron-down');
    relayout();
  };
  trigger.addEventListener('click', e => { if (e.target.closest('.nav, .list')) return; toggle(); });
  trigger.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
}
function relayout() {
  for (const ex of expanders) {
    ex.extra = ex.el.classList.contains('open') ? Math.max(0, ex.el.scrollHeight + 2 - ex.h) : 0;
    ex.el.style.height = ex.h + ex.extra + 'px';
  }
  let total = 0;
  for (const el of movable) {
    const t = +el.dataset.t;
    const off = expanders.filter(ex => ex.top < t).reduce((a, ex) => a + ex.extra, 0);
    el.style.top = t + off + 'px';
  }
  for (const ex of expanders) total += ex.extra;
  tl.style.height = Math.max(baseH, addBottom) + total + 'px';
}

function renderGrid() {
  target = tl; live = true;
  for (let h = START; h <= END; h++) {
    place(div('hr', (h % 24) + ':00'), (h - START) * 60 * PX - 7);   // 過了午夜顯示 0:00、1:00
    place(div('ln'), (h - START) * 60 * PX);
  }
}
function buildLayer(page, isLive) {
  const layer = div('layer');
  target = layer; live = isLive;
  renderCards(itemsOf(page), page);
  target = null; live = true;
  return layer;
}
function renderCards(items, day) {
  // 時間重疊的卡片標紅框提醒
  const clash = new Set();
  items.forEach((a, i) => items.slice(i + 1).forEach(b => { if (m(b.s) < m(a.e) && m(a.s) < m(b.e)) { clash.add(a.id); clash.add(b.id); } }));
  // 時間重疊的卡片並排顯示（像 Google 日曆），才不會互相蓋住
  const cols = {};
  let cluster = [], clusterEnd = -1;
  const flush = () => { const n = Math.max(...cluster.map(c => cols[c.id].col)) + 1; cluster.forEach(c => cols[c.id].n = n); cluster = []; };
  for (const it of items) {
    if (cluster.length && m(it.s) >= clusterEnd) flush();
    const used = new Set(cluster.filter(c => m(c.e) > m(it.s)).map(c => cols[c.id].col));
    let col = 0; while (used.has(col)) col++;
    cols[it.id] = { col }; cluster.push(it); clusterEnd = Math.max(clusterEnd, m(it.e));
  }
  if (cluster.length) flush();
  const setCol = (el, id) => {
    const { col, n } = cols[id]; if (n < 2) return;
    el.style.left = `calc(4px + (100% - 4px) * ${col} / ${n})`;
    el.style.right = 'auto';
    el.style.width = `calc((100% - 4px) / ${n} - 3px)`;
  };
  items.forEach((it, i) => {
    const prev = items[i - 1] || (i === 0 ? homePrev(day) : null);
    if (it.travel && prev) {
      // 交通時間：小泡泡放在上一張結尾和這一張開頭的正中間（太近就壓在兩張中間，重疊的話放在這一張的上緣）；
      // 空隙比泡泡高時，虛線把兩張卡片連起來。前後地點變了（換店、搬動）就變淡加問號
      const end = prev.home ? y(it.s) - 3 : y(prev.e) - 3, gap = y(it.s) - end, stale = routeStale(prev, it);   // 從住處出發：泡泡壓在這張卡片上緣
      if (gap > 18) { const ln = div('car-line' + (stale ? ' stale' : '')); ln.style.height = gap + 'px'; place(ln, Math.round(end)); }
      const el = div('car' + (stale ? ' stale' : ''), `<i class="ti ti-${modeIcon(parseRoute(it.troute).mode)}"></i>${esc(it.travel.replace(/\s+/g, ''))}${stale ? '<span class="q">?</span>' : ''}`);
      if (stale) el.title = '前後的地點變了，這個時間可能不準，可以重新計算';
      place(el, Math.round((gap >= 0 ? end + gap / 2 : y(it.s)) - 9));
    }
    const top = y(it.s), mins = m(it.e) - m(it.s), h = Math.max(mins * PX - 3, 28);
    const extra = clash.has(it.id) ? ' clash' : '';
    // 合併區塊：好幾站依序走；多選一：幾間都可以去，到時候挑一間。兩種都是可以展開的卡片
    const pick = !it.group && !!it.alts?.length;
    if (it.group || pick) {
      const g = div('grp ' + (it.cls || 'eat') + extra);
      g.dataset.id = it.id;
      g.setAttribute('role', 'button'); g.tabIndex = 0;
      const tags = (it.booked ? ' · <i class="ti ti-circle-check"></i> 已訂位' : '') + (it.alert ? ` · <i class="ti ti-alert-triangle"></i> ${esc(it.alert)}` : '');
      const rows = pick
        ? `<div class="cap">這幾間都可以去，到時候再一起選一間</div>${it.alts.map((a, i) => `
          <div class="stop" data-kind="alt" data-idx="${i}"><div class="num pick"></div>
            <div style="flex:1;min-width:0"><div class="n">${esc(a.name)}</div>${a.desc ? `<div class="o">${esc(a.desc)}</div>` : ''}
              ${a.alert || +a.dur ? `<div class="m">${+a.dur ? `<i class="ti ti-clock"></i> ${T(it.s)} · ${durLabel(+a.dur)}` : ''}${a.alert && +a.dur ? '　' : ''}${esc(a.alert || '')}</div>` : ''}</div>
            ${a.map ? navBtn(a.map, a.name) : ''}${subEditIc}
          </div>`).join('')}<button type="button" class="add-sub" data-kind="alt"><i class="ti ti-plus"></i> 新增選項</button>`
        : `${it.stops.map((st, i) => `
          <div class="stop${i < it.stops.length - 1 ? ' chain' : ''}" data-kind="stop" data-idx="${i}"><div class="num">${i + 1}</div>
            <div style="flex:1;min-width:0"><div class="n">${esc(st.name)}</div>${st.orig ? `<div class="o">${esc(st.orig)}</div>` : ''}${st.desc ? `<div class="o">${esc(st.desc)}</div>` : ''}
              <div class="m"><i class="ti ti-clock"></i> ${T(st.s)} · ${durLabel(st.dur)}${st.area ? `　<i class="ti ti-map-pin"></i> ${esc(st.area)}` : ''}${st.alert ? `　${esc(st.alert)}` : ''}</div></div>
            ${st.map ? navBtn(st.map, st.name) : ''}${subEditIc}
          </div>`).join('')}<button type="button" class="add-sub" data-kind="stop"><i class="ti ti-plus"></i> 新增一站</button>`;
      g.innerHTML = `
        <div class="head"><span class="t" style="font-size:15px;font-weight:600">${pick
          ? `<i class="ti ti-arrows-split-2"></i> ${esc(it.t)}`
          : `<i class="ti ti-stack-2"></i> ${esc(it.t)} · ${it.stops.length} 站`}${editIc}</span><span class="hd-tm">${T(it.s)}–${T(it.e)}</span><i class="ti ti-chevron-down chev"></i></div>
        <div class="sum"><div style="font-size:12px;line-height:1.6${pick ? ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis' : ''}">${pick
          ? esc(it.alts.map(a => a.name).join('／'))
          : esc(it.stops.map(st => st.short || st.name).join(' → '))}</div><div style="font-size:12px">${T(it.s)}–${T(it.e)} · ${durLabel(mins)}${tags}</div></div>
        <div class="list">${rows}</div>`;
      setCol(g, it.id);
      makeExpander(g, top, h, g);
      return;
    }
    const showNav = it.map && h >= MIN_NAV_H;
    // 描述：標題＋時間之外還放得下至少一行才顯示（半小時左右的小卡片就不顯示）
    const descLines = (it, h) => { const n = Math.floor((h - 52) / 16); return it.desc && it.desc !== PENDING && n >= 1 ? `<div class="d" style="-webkit-line-clamp:${n}">${esc(it.desc)}</div>` : ''; };
    const compact = h < COMPACT_H;
    const tags = (it.booked ? ' · <span class="tag-ok"><i class="ti ti-circle-check"></i> 已訂位</span>' : '') +
                 (it.alert ? ` · <i class="ti ti-alert-triangle"></i> ${esc(it.alert)}` : '') +
                 (it.desc === PENDING ? ' · <span class="tag-q"><i class="ti ti-loader-2 spin"></i> 查詢資訊中</span>' : '');   // 剛加入、背景還在查（小卡片看不到描述，放在時間這一行）
    const b = div('blk ' + it.cls + (showNav ? ' has-nav' : '') + (compact ? ' compact' : '') + extra,
      compact
        ? `<div class="t">${esc(it.t)}<span class="tm">· ${T(it.s)}–${T(it.e)}${it.desc === PENDING ? ' <i class="ti ti-loader-2 spin"></i>' : ''}</span></div>${showNav ? navBtn(it.map, it.t) : ''}${editIc}`
        : `<div class="t">${esc(it.t)}</div>${descLines(it, h)}<div class="s">${T(it.s)}–${T(it.e)} · ${durLabel(mins)}${tags}</div>${showNav ? navBtn(it.map, it.t) : ''}${editIc}`);
    b.dataset.id = it.id;
    setCol(b, it.id);
    b.style.height = h + 'px'; place(b, top);
  });
}
