          <div class="stop${i < it.stops.length - 1 ? ' chain' : ''}" data-kind="stop" data-idx="${i}"><div class="num">${i + 1}</div>
            <div style="flex:1;min-width:0"><div class="n">${esc(st.name)}</div>${st.orig ? `<div class="o">${esc(st.orig)}</div>` : ''}${st.desc ? `<div class="o">${esc(st.desc)}</div>` : ''}
              <div class="m"><i class="ti ti-clock"></i> ${T(st.s)} · ${durLabel(st.dur)}${st.area ? `　<i class="ti ti-map-pin"></i> ${esc(st.area)}` : ''}${st.alert ? `　${esc(st.alert)}` : ''}</div></div>
            ${st.map ? navBtn(st.map, st.name) : ''}${subEditIc}
          </div>`).join('')}<button type="button" class="add-sub" data-kind="stop"><i class="ti ti-plus"></i> 新增一站</button>`;
      g.innerHTML = `
        <div class="head"><span class="t" style="font-size:15px;font-weight:600">${pick
          ? `<i class="ti ti-arrows-split-2"></i> ${esc(it.t)}`
          : `<i class="ti ti-stack-2"></i> ${esc(it.t)} · ${it.stops.length} 站`}${editIc}</span><span class="hd-tm">${T(it.s)}–${T(it.e)}</span><i class="ti ti-chevron-down chev"></i></div>
        <div class="sum"><div style="font-size:12px;line-height:1.6${pick ? ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis' : ''}">${pick
          ? esc(it.alts.map(a => a.name).join('／'))
          : esc(it.stops.map(st => st.short || st.name).join(' → '))}</div><div style="font-size:12px">${T(it.s)}–${T(it.e)} · ${durLabel(mins)}${tags}</div></div>
        <div class="list">${rows}</div>`;
      setCol(g, it.id);
      makeExpander(g, top, h, g);
      return;
    }
    const showNav = it.map && h >= MIN_NAV_H;
    // 描述：標題＋時間之外還放得下至少一行才顯示（半小時左右的小卡片就不顯示）
    const descLines = (it, h) => { const n = Math.floor((h - 52) / 16); return it.desc && it.desc !== PENDING && n >= 1 ? `<div class="d" style="-webkit-line-clamp:${n}">${esc(it.desc)}</div>` : ''; };
    const compact = h < COMPACT_H;
    const tags = (it.booked ? ' · <span class="tag-ok"><i class="ti ti-circle-check"></i> 已訂位</span>' : '') +
                 (it.alert ? ` · <i class="ti ti-alert-triangle"></i> ${esc(it.alert)}` : '') +
                 (it.desc === PENDING ? ' · <span class="tag-q"><i class="ti ti-loader-2 spin"></i> 查詢資訊中</span>' : '');   // 剛加入、背景還在查（小卡片看不到描述，放在時間這一行）
    const b = div('blk ' + it.cls + (showNav ? ' has-nav' : '') + (compact ? ' compact' : '') + extra,
      compact
        ? `<div class="t">${esc(it.t)}<span class="tm">· ${T(it.s)}–${T(it.e)}${it.desc === PENDING ? ' <i class="ti ti-loader-2 spin"></i>' : ''}</span></div>${showNav ? navBtn(it.map, it.t) : ''}${editIc}`
        : `<div class="t">${esc(it.t)}</div>${descLines(it, h)}<div class="s"><i class="ti ti-clock"></i> ${T(it.s)}–${T(it.e)} · ${durLabel(mins)}${it.area ? `　<i class="ti ti-map-pin"></i> ${esc(it.area)}` : ''}${tags}</div>${showNav ? navBtn(it.map, it.t) : ''}${editIc}`);
    b.dataset.id = it.id;
    setCol(b, it.id);
    b.style.height = h + 'px'; place(b, top);
  });
}

function updateHeader(page) {
  const today = tripNow()?.day;

    const on = t.dataset.page === page;
    t.classList.toggle('today', t.dataset.page === today);
    t.classList.toggle('on', on);
    if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  if (isDay(page)) {
    const d = dayInfo(page);
    dayTitle.textContent = d.en;
    daySub.innerHTML = `${d.date}．${d.wd}${d.zh || editing ? `．<span id="subTheme">${esc(d.zh)}</span>` : ''}`;
  } else {
    dayTitle.textContent = PAGES[page].en;
    if (page === 'overview') daySub.textContent = TRIP ? `${dayInfo('d1').date}–${dayInfo(lastDay()).date}．${DAY_KEYS.length} 天 ${DAY_KEYS.length - 1} 夜` : '';
    else daySub.textContent = page === 'cand' ? `備選景點．${(DATA.cand || []).length} 個` : PAGES[page].sub;
  }
  document.documentElement.classList.toggle('on-trips', page === 'trips' || page === 'new');
  document.documentElement.classList.toggle('on-new', page === 'new');
  fab.classList.toggle('day', isDay(page) || page === 'cand');
  // 總覽頁沒有地圖，同一個位置改放房子：回到「我的旅程」
  const home = page === 'overview';

  mapBtn.setAttribute('aria-label', home ? '回到我的旅程' : mapMode ? '回到清單' : '看地圖');
  // 總覽沒有卡片可以編輯：右上角的鉛筆換成齒輪，點了打開旅程設定
  const eb = document.getElementById('editBtn');
  eb.innerHTML = `<i class="ti ${home ? 'ti-settings' : 'ti-pencil'}"></i>`;
  eb.setAttribute('aria-label', home ? '旅程設定' : '編輯行程');
  applyHeaderEditable();
  document.getElementById('routeFab').classList.toggle('day', isDay(page));
  document.getElementById('ebDay').textContent = isDay(page) ? `第 ${dayNum(page)} 天` : page === 'cand' ? '備選' : '';
  document.querySelector('.tab.on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  updateTabFade();
}

let renderedPage = null, wantPage = null, justCreated = false;
function renderPage(page) {
  const prevPage = renderedPage;
  // 重畫同一頁（例如進出編輯模式、存檔後）時，記住哪些區塊是展開的
  const keepOpen = page === renderedPage ? expanders.filter(ex => ex.el.classList.contains('open')).map(ex => ex.el.dataset.id) : [];
  renderedPage = page;
  computeRange();
  tl.innerHTML = ''; movable.length = 0; expanders.length = 0;
  tl.classList.remove('sliding');
  // 地圖模式：時間軸、備選清單收起來，改顯示地圖
  const onMap = mapOn(page);
  mapView.hidden = !onMap;
  document.documentElement.classList.toggle('on-map', onMap); syncTint();
  tripsEl.hidden = page !== 'trips';
  if (page === 'trips') renderTrips();
  wizEl.hidden = page !== 'new';
  if (page === 'new') { if (prevPage !== 'new') wizReset(); renderWiz(); }
  if (onMap) { ovEl.hidden = candEl.hidden = true; tl.style.display = 'none'; cardsEl = curLayer = null; drawMap(page); return; }
  ovEl.hidden = page !== 'overview';
  if (page === 'overview') renderOverview();
  candEl.hidden = page !== 'cand';
  if (page === 'cand') renderCand();
  if (!isDay(page)) { tl.style.display = 'none'; cardsEl = curLayer = null; return; }
  tl.style.display = ''; tl.style.height = baseH + 'px'; addBottom = 0;
  renderGrid();
  cardsEl = div('cards'); tl.appendChild(cardsEl);
  curLayer = buildLayer(page, true); cardsEl.appendChild(curLayer);
  if (!loaded) tl.appendChild(div('tl-msg', loadErrText()));
  else addButton(page);
  if (keepOpen.length) {
    // 重畫時直接是展開的樣子：先關掉高度、位置的動畫，不然會看到卡片縮回去又展開
    tl.classList.add('no-anim');
    requestAnimationFrame(() => requestAnimationFrame(() => tl.classList.remove('no-anim')));
    for (const ex of expanders) if (keepOpen.includes(ex.el.dataset.id)) {
      ex.el.classList.add('open');
      ex.trigger.setAttribute('aria-expanded', 'true');
      const chev = ex.trigger.querySelector('.chev');
      if (chev) chev.className = 'ti chev ti-chevron-up';
    }
    relayout();
  }
  markNow();
}

// 跟每天一樣的彩色卡片，沒有時間軸、由上往下排。編輯時「日期」選某一天就排進去
const candEl = document.getElementById('cand');
// 篩選類型、排列方式（最新加入／分類）記在這支手機
const CAND_VIEW_KEY = 'cm-cand-view';
let candView = { f: '', sort: 'new' };
try { Object.assign(candView, JSON.parse(localStorage.getItem(CAND_VIEW_KEY)) || {}); } catch {}
function renderCand() {
  if (!loaded) { candEl.innerHTML = `<div class="ov-empty">${loadErrText()}</div>`; return; }
  const all = DATA.cand || [];
  if (candView.f && !all.some(c => (c.cls || 'eat') === candView.f)) candView.f = '';   // 那一類都排走了，回到全部
  const shown = all.filter(c => !candView.f || (c.cls || 'eat') === candView.f).reverse();   // 後加入的在後面，反過來＝最新的在上面
  const card = it => {
    const multi = it.group || it.alts?.length;
    const names = it.group ? it.stops.map(x => x.short || x.name).join(' → ') : it.alts?.length ? it.alts.map(a => a.name).join('／') : '';
    // 外層只放營業時間（時鐘）、區域、其他提醒；預計時段不顯示（排進某一天時才用到，點開看得到）
    const parts = String(it.alert || '').split(/\s*[・·]\s*/).filter(Boolean), isHr = x => /營業|公休|休息|\d{1,2}:\d{2}/.test(x);
    const hrs = parts.filter(isHr), rest = parts.filter(x => !isHr(x));
    const area = it.area || (/^位置：(.+)$/m.exec(it.mine || '') || [])[1]?.trim() || '';   // 舊的備選：區域寫在筆記的「位置：」
    const seg = (ic, txt) => `<span class="cs-seg"><i class="ti ${ic}"></i> ${esc(txt)}</span>`;
    const line = [hrs.length && seg('ti-clock', hrs.join('・')), area && seg('ti-map-pin', area), rest.length && seg('ti-alert-triangle', rest.join('・')), it.booked && seg('ti-circle-check', '已訂位')].filter(Boolean).join('');
    return `<div class="blk ${it.cls || 'eat'}${it.map && !multi ? ' has-nav' : ''}" data-id="${it.id}">
      <div class="t">${multi ? `<i class="ti ${it.group ? 'ti-stack-2' : 'ti-arrows-split-2'}"></i> ` : ''}${esc(it.t)}</div>
      ${names ? `<div class="d">${esc(names)}</div>` : it.desc === PENDING ? '<div class="d"><i class="ti ti-loader-2 spin"></i> 查詢中，查好會自動填上</div>' : it.desc ? `<div class="d">${esc(it.desc)}</div>` : ''}
      ${line ? `<div class="s cs-line">${line}</div>` : ''}
      ${it.map && !multi ? navBtn(it.map, it.t) : ''}${editIc}</div>`;
  };
  let body;
  if (!all.length) body = '<div class="ov-empty">還沒有備選景點。按上面「加入新地點」搜尋店名，或貼上 Google 地圖的店家、清單連結</div>';
  else if (candView.sort === 'type' && !candView.f)
    body = TYPES.map(([k, n]) => { const g = shown.filter(c => (c.cls || 'eat') === k);
      return g.length ? `<div class="cand-grp ${k}"><span class="cp-dot"></span>${n}<b>${g.length}</b></div>` + g.map(card).join('') : ''; }).join('');
  else body = shown.map(card).join('');
  candEl.innerHTML = `<button type="button" class="btn ghost cand-import" id="candImport"><i class="ti ti-plus"></i> 加入新地點</button>
    ${all.length > 1 ? `<div class="cand-bar">
      <div class="cand-chips">${typeChips(all, candView.f, 'cand-filter')}</div>
      <span class="cand-sep" aria-hidden="true"></span>
      ${sortBtn()}</div>` : ''}
    <div class="cand-list${candAnim ? ' anim' : ''}">${body}</div>`;
  candAnim = false;
  candEl.querySelector('.cand-chips')?.addEventListener('scroll', chipFade, { passive: true });
  chipFade();
}
let candAnim = false;   // 換篩選／排列後重畫時，清單淡入
function chipFade() {
  const c = candEl.querySelector('.cand-chips'); if (!c) return;

// 排列切換鈕：一個圖示，點一下換另一種（時鐘＝最新加入、方塊＝依類型）

const sortBtn = spin => `<button type="button" class="cand-sortbtn${spin ? ' flip' : ''}" data-sort aria-label="排列：${SORTS[candView.sort][1]}，點一下切換"><i class="ti ${SORTS[candView.sort][0]}"></i></button>`;
// 編輯模式下點卡片＝編輯

// ---------- 總覽 ----------
const ovEl = document.getElementById('ov');
const TYPE_NAME = Object.fromEntries(TYPES);
// 標籤用短一點的名字：去掉括號裡的補充；「英文店名 中文說明」只留英文店名
function shortName(t) {
  t = t.replace(/[（(][^）)]*[）)]\s*$/, '').trim();
  const m = t.match(/^([A-Za-z0-9][A-Za-z0-9.&'’ -]*?)\s+[\u4e00-\u9fff]/);
  return m ? m[1] : t;
}
// 總覽目前在哪一頁（每天／住宿／待辦清單），記在這支手機
const OV_TABS = [['days', '每天'], ['stay', '住宿'], ['todo', '待辦清單']];
let ovTab = 'days';
try { const t = localStorage.getItem('cm-ov-tab'); if (OV_TABS.some(([k]) => k === t)) ovTab = t; } catch {}
const ovTabIdx = () => OV_TABS.findIndex(([k]) => k === ovTab);
function renderOverview() {
  const today = tripNow()?.day;
  const days = DAY_KEYS.map(k => ({ k, info: dayInfo(k), items: [...(DATA[k] || [])].sort((a, b) => m(a.s) - m(b.s)) }));
  let html = '';
  if (!loaded) { ovEl.innerHTML = `<div class="ov-empty">${loadErrText()}</div>`; return; }
  // 小統計：按摩算次數，其他類型同一家只算一次；合併區塊裡的每一站各算一家，多選一算一家；交通、住宿（其他）不算
  const count = {}, seen = new Set();
  for (const d of days) for (const it of d.items) {
    const add = (cls, name) => {
      if (cls === 'other') return;
      if (cls !== 'spa' && name && seen.has(name)) return;
      seen.add(name); count[cls] = (count[cls] || 0) + 1;
    };
    if (it.group && it.stops?.length) it.stops.forEach(st => add(it.cls, st.name));
    else add(it.cls, it.alts?.length ? it.id : it.t);
  }
  const unit = { eat: '家', spa: '次', cafe: '家', bar: '家', shop: '處', see: '處' };
  // 每天：左邊日期和主題，右邊列出當天要去的地方（「其他」類型只列機場，回家休息、放行李這類不列）
  const listed = it => it.cls !== 'other' || /機場|airport/i.test(it.t);
  const todos = CHECKS.filter(c => c.kind === 'todo').sort((a, b) => a.order - b.order);
  const tips = CHECKS.filter(c => c.kind === 'tip').sort((a, b) => a.order - b.order);
  if (TRIP) html += setupHtml();   // 封面照片不放總覽（佔空間），只在「我的旅程」列表顯示
  html += `<div class="ov-segbar"><div class="seg ov-seg" data-i="${ovTabIdx()}"><span class="seg-thumb"></span>
    ${OV_TABS.map(([k, t]) => `<button type="button" data-ovtab="${k}"${ovTab === k ? ' class="on"' : ''}>${t}</button>`).join('')}</div></div>`;
  if (ovTab === 'days') {
  html += days.map(d => {
    const places = d.items.filter(listed).map(it => `
      <span class="ov-place"><span class="ov-dot ${it.cls || 'eat'}"></span><span class="nm">${esc(it.t)}</span>${it.booked ? '<i class="ti ti-circle-check ov-ok"></i>' : ''}</span>`).join('');
    return `<button type="button" class="ov-row${d.k === today ? ' today' : ''}" data-go="${d.k}"><span class="ov-when"><b>${d.info.date} ${d.info.wd}${d.k === today ? '<span class="ov-today">今天</span>' : ''}</b>${esc(d.info.zh || '')}</span>
      <span class="ov-places">${places || '<span class="ov-empty">還沒有行程</span>'}</span><i class="ti ti-chevron-right"></i></button>`;
  }).join('');
  if (Object.keys(count).length) html += '<div class="ov-sec">這趟旅程</div><div class="ov-stats">' + TYPES.filter(([k]) => count[k]).map(([k, n]) =>
    `<span class="ov-stat ${k}">${n}<b>${count[k]}</b>${unit[k] || '個'}</span>`).join('') + '</div>';
  // 已訂位：用標籤，點了跳到那一天
  const booked = days.flatMap(d => d.items.filter(it => it.booked).map(it => ({ d, it })));
  html += '<div class="ov-sec">已訂位</div>' + (booked.length
    ? '<div class="ov-chips">' + booked.map(({ d, it }) =>
      `<button type="button" class="ov-chip ${it.cls || 'eat'}" data-go="${d.k}"><b>${d.info.date} ${T(it.s)}</b> ${esc(shortName(it.t))}</button>`).join('') + '</div>'
    : '<div class="ov-empty">還沒有勾「已訂位」的行程</div>');

  const canEdit = TRIP_ROLE === 'edit';
  if (!tripStays().length && !canEdit) html += '<div class="ov-empty">還沒有住處</div>';
  if (!tripStays().length && canEdit) html += '<button type="button" class="ov-stay add" id="staysAdd"><i class="ti ti-bed"></i><span><b>加入住處</b><small>每天第一段交通從住處算，加入行程可以一鍵回住處</small></span><i class="ti ti-plus"></i></button>';
  if (tripStays().length) html += stayListHtml()
    + (canEdit ? '<button type="button" class="wiz-add ov-stay-add" id="staysAdd"><i class="ti ti-plus"></i>加入住處</button>' : '');
  } else {
  // 待辦、注意事項都照新增的順序；做完的待辦留在原位，劃線變淡
  const addRow = (kind, ph) => `<label class="ck-add"><i class="ti ti-plus"></i><input type="text" class="ck-new" data-kind="${kind}" placeholder="${ph}" enterkeyhint="done" autocomplete="off"></label>`;
  html += `<div class="ck-list">${todos.map(c => `<div class="ck${c.done ? ' done' : ''}" data-ck="${c.id}">
      <button type="button" class="ck-box" aria-label="${c.done ? '取消勾選' : '勾選'}：${esc(c.text)}"><i class="ti ti-check"></i></button>
      <button type="button" class="ck-txt">${esc(c.text)}${c.who ? `<span class="ck-who">${esc(c.who)}</span>` : ''}</button></div>`).join('')}${addRow('todo', '新增待辦')}</div>`;
  html += `<div class="ov-sec">注意事項</div>
    <div class="ck-list">${tips.map(c => `<div class="ck" data-ck="${c.id}"><span class="ck-bullet"></span><button type="button" class="ck-txt">${esc(c.text)}</button></div>`).join('')}${addRow('tip', '新增注意事項')}</div>`;

  if (TRIP) {
    html += '<div class="ov-foot">';
    html += `<button type="button" class="inv-btn trip-set" id="tripSet"><i class="ti ti-settings"></i><span><b>旅程設定</b><small>名稱、目的地、日期、交通、封面、同行的人</small></span><i class="ti ti-chevron-right"></i></button>`;

function showPage(page, animate = true) {

const MAPS_KEY_STORE = 'trip-maps-key' + TEST_SUFFIX;
async function getMapsKey() {
  if (MAPS_KEY) return MAPS_KEY;

  if (!API) return '';
  try { const r = await fetch(API + '?action=config').then(x => x.json()); if (r.mapsKey) { try { localStorage.setItem(MAPS_KEY_STORE, r.mapsKey); } catch {} return r.mapsKey; } } catch {}

// input：目的地欄位；onPick({ name, label, region, center, en })：點了某個建議；onType()：又打字了（之前選的不算數）
// 金鑰沒開放地點建議、網路不通時不會跳出清單，照樣可以直接打字（建立時由 API 查）
// opts.request(q)：加在查詢裡的條件（預設只找城市、地區）；opts.resolve(prediction)：點了之後要拿哪些資料（預設：國家、座標、英文名）
function attachPlaceSuggest(input, onPick, onType, opts = {}) {
  const box = document.createElement('div'); box.className = 'ps-list'; box.hidden = true;
  input.insertAdjacentElement('afterend', box);
  input.setAttribute('autocomplete', 'off');
  let timer = null, seq = 0, token = null, items = [];
  const close = () => { box.hidden = true; box.innerHTML = ''; items = []; };
  const ask = async () => {
    const q = input.value.trim(), my = ++seq;
    if (!q || /https?:\/\//.test(q)) { close(); return; }   // 貼的是網址：不查地點建議
    let places;

      const key = await getMapsKey(); if (!key) return;
      await loadMaps(key); places = await google.maps.importLibrary('places');
      token = token || new places.AutocompleteSessionToken();   // 同一次選擇的查詢算一次計費
      const { suggestions } = await places.AutocompleteSuggestion.fetchAutocompleteSuggestions({ input: q, sessionToken: token, ...(opts.request ? opts.request(q) : { includedPrimaryTypes: ['(regions)'] }) });
      if (my !== seq || document.activeElement !== input) return;
      items = (suggestions || []).map(x => x.placePrediction).filter(Boolean).slice(0, 5);
    } catch { return; }
    box.innerHTML = items.map((p, i) => `<button type="button" data-i="${i}"><i class="ti ti-map-pin"></i><span><b>${esc(p.mainText?.text || p.text?.text || '')}</b><small>${esc(p.secondaryText?.text || '')}</small></span></button>`).join('');
    box.hidden = !items.length;
  };
  input.addEventListener('input', e => { if (e.isComposing) return; onType?.(); clearTimeout(timer); timer = setTimeout(ask, 250); });
  input.addEventListener('compositionend', () => { onType?.(); clearTimeout(timer); timer = setTimeout(ask, 250); });   // 注音、拼音選完字才查
  input.addEventListener('blur', () => setTimeout(close, 200));
  box.addEventListener('pointerdown', e => e.preventDefault());   // 點清單時輸入框不要先失去焦點
  box.addEventListener('click', async e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const p = items[+b.dataset.i]; close();
    const name = p.mainText?.text || p.text?.text || '', label = [name, p.secondaryText?.text].filter(Boolean).join('，');
    input.value = name;
    if (opts.resolve) { const tk = token; token = null; onPick(await opts.resolve(p, name, label, tk)); return; }
    try {
      const place = p.toPlace();
      await place.fetchFields({ fields: ['location', 'addressComponents'] });
      const en = new google.maps.places.Place({ id: place.id, requestedLanguage: 'en' });
      await en.fetchFields({ fields: ['displayName'] });
      const country = (place.addressComponents || []).find(c => c.types.includes('country'));
      const loc = place.location;

  $('edSave').addEventListener('click', saveEditor);

  // 交通時間：Segmented Control 選中的那格＝這一段的交通方式，格子裡是分鐘數；下面一行說明怎麼來的

  const routeSt = $('edRouteSt'), box = $('edModes'), self = () => ed.id ? findItem(ed.id)[1] : null;

// 原本排在這張「後面」的行程（用原本的開始時間判斷）
function laterItems() {
  if (!ed || ed.isNew) return [];
  return DATA[current].filter(x => x.id !== ed.id && m(x.s) >= m(ed.orig.s));
}

// 多個地點／多選一 換樣式：split＝每一站／每個選項各自變成一張卡片；group⇄pick 互換
function convertCard(id, to, snap) {
  const [day, it] = findItem(id); if (!it) return;
  const list = DATA[day];
  const subs = it.group ? it.stops || [] : it.alts || [];
  let msg;
  if (to === 'split') {
    const cards = subs.map((x, i) => {
      const s = it.group ? m(x.s) : m(it.s), e = it.group ? m(x.s) + x.dur : +x.dur ? m(it.s) + +x.dur : m(it.e);
      const p = placeOf(x, it.cls);
      if (!p.alert && i === 0 && it.alert) p.alert = it.alert;   // 整張卡片的提醒給第一張
      return cardOf(p, { s: hhmm(s), e: hhmm(Math.min(Math.max(e, s + 5), DAY_END)), travel: i === 0 ? it.travel || '' : '', troute: i === 0 ? it.troute || '' : '', booked: i === 0 && !!it.booked });
    });
    list.splice(list.indexOf(it), 1, ...cards);
    list.sort((a, b) => m(a.s) - m(b.s));
    msg = `已把「${it.t}」拆成 ${cards.length} 張卡片`;
  } else if (to === 'pick') {
    it.alts = subs.map(x => ({ ...placeOf(x), dur: +x.dur || 0 }));
    // 幾家選一家去：時段取停留最久的那一家（從原本的開始時間算），不是全部加起來
    const longest = Math.max(15, ...subs.map(x => +x.dur || 0));
    it.e = hhmm(Math.min(m(it.s) + longest, DAY_END));
    delete it.stops; it.group = false;
    msg = `「${it.t}」改成多選一，時段 ${T(it.s)}–${T(it.e)}`;
  } else {
    const n = Math.max(1, subs.length), dur = Math.max(5, Math.round((m(it.e) - m(it.s)) / n / 5) * 5);
    let at = m(it.s);   // 有各自的停留時間就照著排，沒有就平分
    it.stops = subs.map(x => { const d = +x.dur || dur, st = { ...placeOf(x), s: hhmm(Math.min(at, DAY_END - d)), dur: d }; at += d; return st; });
    delete it.alts; it.group = true; fitGroup(it);
    msg = `「${it.t}」改成多個地點，每站 ${dur} 分`;
  }
  saveData('改卡片樣式'); closeSheet(); renderPage(current);
  toast(msg, '復原', () => undoSnap(snap), UNDO_MS);
}
// 按儲存之後 3 秒內可以復原：存之前先拍一張快照（每天、備選的卡片和筆記）
const UNDO_MS = 3000;
const takeSnap = () => ({ data: Object.fromEntries(ALL_KEYS.map(k => [k, clone(DATA[k] || [])])), notes: clone(NOTES) });
function undoSnap(snap) {
  ALL_KEYS.forEach(k => { DATA[k] = snap.data[k]; });
  for (const [k, v] of Object.entries(snap.notes)) if (JSON.stringify(NOTES[k]) !== JSON.stringify(v)) { NOTES[k] = v; noteQueue[k] = ++noteSeq; }   // 筆記改回原本的樣子
  saveData('復原'); renderPage(current); updateHeader(current); toast('已復原');

// 從備選替換：被換掉的那張整張搬到備選（內容、筆記都留著，時間不動）

}

  if (ed.kind !== 'one') {

    const it = ed.isNew ? { id: uid() } : findItem(ed.id)[1];
    if (!ed.isNew && push && delta) laterItems().forEach(x => { x.s = hhmm(m(x.s) + delta); x.e = hhmm(m(x.e) + delta); });
    const first = placeOf({ ...it, ...fields, t });   // 店家資料整份變成第一站／第一個選項（提醒、營業時間都是那一家店的）

    if (swapOut()) { saveData(`換成「${t}」`); closeSheet(); renderPage(current); updateHeader(current);
      toast(`已把「${ed.oldT}」換成「${t}」，「${ed.oldT}」移到備選`, '復原', undo, UNDO_MS); return; }
    const cur = ed.group ? 'group' : ed.pick ? 'pick' : '';
    if (cur && ed.conv && ed.conv !== cur) { convertCard(ed.id, ed.conv, snap); return; }
  }

  if (ed.fromCand && ed.day === current) { toast(`已從備選排入「${t}」${clashText(ed.id, current)}`, '復原', undo, UNDO_MS); return; }

    return;
  }
  toast((ed.isNew ? '已新增' : push && delta ? `已儲存，後面 ${laterItems().length} 個行程一起${delta > 0 ? '順延' : '提前'}` : '已儲存') + syncNote(mates || []), '復原', undo, UNDO_MS);
}

// 行程或備選裡已經有同名的地點：回傳「備選」「第 N 天」
const dupOf = name => { const k = ALL_KEYS.find(k => (DATA[k] || []).some(x => x.t.toLowerCase() === name.toLowerCase())); return k ? (k === 'cand' ? '備選' : `第 ${dayNum(k)} 天`) : ''; };
// 地圖網址裡的「/@緯度,經度」（清單匯入的連結有）
const locFromUrl = u => { const mm = /\/@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(u || ''); return mm ? (+mm[1]).toFixed(6) + ',' + (+mm[2]).toFixed(6) : ''; };
// 背景補座標：有地點但還沒有座標的卡片、每一站、每個選項（新加的、改過地圖的），用 Google 地圖查一次存起來

let locRunning = false;
async function locateMissing() {
  if (locRunning || !loaded || !getAuth() || editing) return;

    if (it.desc === PENDING) continue;   // 還在背景查詢的，查好就有座標
    const ents = it.group || it.alts?.length ? [...(it.stops || []), ...(it.alts || [])] : [it];
    for (const x of ents) {
      const q = x.map || x.name || x.t, key = it.id + '|' + q;
      if (x.loc || !q || locTried.has(key) || (it.cls === 'other' && !/^https?:/.test(q))) continue;

  for (const j of jobs) {
    const fromUrl = locFromUrl(j.q);
    let loc = fromUrl, pid = '';
    if (!loc && found.has(j.q)) ({ loc, pid } = found.get(j.q));
    else if (!loc) {

// 貼上的內容：有網址就只拿網址（手機分享 Google 地圖清單會多一行「清單名 · 帳號名」、分享店家會帶店名地址，這些都不要）；

  const urls = (text.match(/https?:\/\/[^\s，。、（）「」『』【】《》]+/g) || []).map(u => u.replace(/[)\].,;!?'"]+$/, ''));
  const items = urls.length ? urls : text.split(/\n+/).map(l => l.trim()).filter(Boolean);

// 背景查詢：描述欄位是 PENDING 的卡片就是還沒查完的（存在雲端，所以關掉網頁、換手機打開都會接著查）

function resumeLookups() {
  if (!loaded || !getAuth()) return;
  for (const k of ALL_KEYS) for (const it of DATA[k] || [])
    if (it.desc === PENDING && !bgBusy.has(it.id)) { bgBusy.add(it.id); bgQueue.push({ id: it.id, link: /\/maps\/place\/[^/]+\/@/.test(it.map || '') ? it.map : it.t && it.t !== PENDING_T ? it.t : it.map }); }   // 地圖連結有店名和座標（清單匯入的）最準，其次用店名查
  while (bgRunning < 3 && bgQueue.length) { bgRunning++; bgLookup(bgQueue.shift()).finally(() => { bgRunning--; resumeLookups(); }); }

async function bgLookup({ id, link }) {

  catch (err) { if (err.code === 'network') { setTimeout(() => bgBusy.delete(id), 60000); return; } fail = err.message; }   // 沒網路：一分鐘後再試
  let [day, it] = findItem(id);

    // 貼的是清單連結、沒按查詢就加入：把這張換成清單裡的每個地點（已經有的跳過），再一個個查
    bgBusy.delete(id);
    const arr = DATA[day], add = list.places.filter(x => !dupOf(x.name));
    arr.splice(arr.indexOf(it), 1, ...add.map(x => ({ id: uid(), t: x.name, desc: PENDING, cls: 'other', s: '12:00', e: '13:00', map: x.map, loc: locFromUrl(x.map), travel: '', booked: false,
      alert: '', mine: x.note ? `清單備註：${x.note}` : '', note: '' })));
    saveData('從 Google 地圖清單導入');
    if (day === current && !drag) renderPage(current);
    toast(`清單「${list.title}」加入 ${add.length} 個地點，背景查詢中`);
    resumeLookups();
    return;
  }
  if (p && p.places) {
    // Google 地圖的資料先寫進去（卡片馬上有名稱、類型、時間），描述等 AI
    const fresh = day === 'cand' && it.s === '12:00' && m(it.e) - m(it.s) === 60;   // 還是剛加入備選時的預設值（已經排進某天的不動時間）
    if (it.t === PENDING_T || !it.t || (/[\u0E00-\u0E7F]/.test(it.t) && /[a-z]/i.test(p.name))) it.t = p.name;   // 泰文店名換成 Google 的英文名
    if (it.cls === 'other' && p.cls) it.cls = p.cls;
    if (fresh && p.start) { it.s = p.start; it.e = hhmm(Math.min(m(p.start) + (p.dur || 60), DAY_END)); }
    if (!it.alert) it.alert = placeAlert(p);
    if (!it.hours && p.hours) it.hours = p.hours;
    if (!it.map && p.gmap) it.map = p.gmap;
    if (p.loc && !it.pid) { it.loc = p.loc; it.pid = p.pid || ''; }   // Google 的座標比清單網址裡的準
    placeNote(it, p); placePhotoFor(it, p);

    if (day === current && !drag) renderPage(current);
    const d = await describe(p);
    [day, it] = findItem(id);
    bgBusy.delete(id);
    if (!it || it.desc !== PENDING) return;
    it.desc = d ? d.desc || '' : '';

      if (it.t === p.name && betterName(p.name, d.name)) it.t = d.name;
      if (d.area && !it.area) it.area = d.area;   // 區域存在卡片上（顯示在時間後面），不再寫進筆記
      const extra = [d.alert ? `提醒：${d.alert}` : ''].filter(Boolean);

  } else {
    bgBusy.delete(id);
    if (p) {
      if (it.t === PENDING_T || !it.t) it.t = p.name;
      it.desc = p.desc || '';
      if (it.cls === 'other' && p.cls) it.cls = p.cls;
      if (!it.alert) it.alert = p.alert || '';
      if (!it.area && p.area) it.area = p.area;
      if (day === 'cand' && m(it.e) - m(it.s) === 60 && p.dur) it.e = hhmm(Math.min(m(it.s) + p.dur, DAY_END));

    p.pay ? `💳 ${p.pay}` : '', p.hoursShort ? `🕒 ${p.hoursShort}` : '', placeTags(p)].filter(Boolean));   // 地址已經在筆記標題下面，不重複

  setNoteField(key, 'full', [p.hoursText ? '營業時間\n' + p.hoursText : '', p.summary ? 'Google 簡介\n' + p.summary : ''].filter(Boolean).join('\n\n'));

// 換天：從原本那天拿出來，放到新的那天（時間不變）

// 合併區塊的時間永遠等於「第一站開始」到「最後一站結束」
function fitGroup(card) {
  if (!card.stops?.length) return false;
  const s = hhmm(Math.min(...card.stops.map(x => m(x.s)))), e = hhmm(Math.max(...card.stops.map(x => m(x.s) + x.dur)));
  const changed = s !== card.s || e !== card.e;
  card.s = s; card.e = e; return changed;
}
// 多選一：有設停留時間的話，整張的長度取最久的那一家（從原本的開始時間算）
function fitPick(card) {
  const alts = card.alts || [];
  if (!alts.some(a => +a.dur)) return false;
  const len = m(card.e) - m(card.s);
  alts.forEach(a => { if (!+a.dur) a.dur = len; });   // 還沒設定的那幾家，當成原本的長度
  const longest = Math.max(...alts.map(a => +a.dur));
  const e = hhmm(Math.min(m(card.s) + longest, DAY_END)), changed = e !== card.e;
  card.e = e; return changed;
}

  const [, card] = findItem(cardId), list = subList(card, kind), isNew = idx == null, old = replace ? list[idx] : null;
  const last = card.stops?.[card.stops.length - 1];
  const at = last ? hhmm(m(last.s) + last.dur) : card.s;
  const c = fromCand && (DATA.cand || []).find(x => x.id === fromCand);
  const area = c && kind === 'stop' && !c.area ? /^位置：(.+)$/m.exec(c.mine || '') : null;   // 舊資料：導入時寫在筆記的「位置：寧曼」→ 一站的區域欄位（新的直接存在 area）
  const sub = c
    ? { ...placeOf(c), s: old ? old.s : at, dur: old ? old.dur : m(c.e) - m(c.s),
        ...(area ? { area: area[1].trim(), mine: (c.mine || '').replace(/^位置：.+$\n?/m, '').trim() } : {}) }
    : isNew ? (kind === 'stop' ? { s: at, dur: 15, name: '' } : { name: '' }) : list[idx];
  sed = { cardId, kind, idx, isNew, dur: +sub.dur || (kind === 'alt' ? m(card.e) - m(card.s) : 15), fromCand: c ? c.id : null, prefill: c ? sub : null, replace: !!old, cls: sub.cls || card.cls };
  const swaps = !isNew ? (DATA.cand || []).filter(x => x.id !== fromCand) : [];
  const isStop = kind === 'stop', nk = isNew && !c ? '' : subNoteKey(sub);
  const cands = isNew && !c ? DATA.cand || [] : [];
  openSheet(`
    <div class="sh-head"><div style="flex:1;min-width:0"><div class="sh-title" id="shTitle">${old ? '從備選替換' : c ? '從備選加入' : isNew ? (isStop ? '新增一站' : '新增選項') : (isStop ? '編輯店家' : '編輯選項')}</div>
      <div class="sh-sub">${esc(card.t)}</div></div>
      <button class="sh-close" aria-label="關閉"><i class="ti ti-x"></i></button></div>
    ${old ? `<div class="ed-hint"><i class="ti ti-arrows-exchange"></i> 儲存後，「${esc(old.name)}」會移到備選</div>` : ''}
    ${cands.length ? `<div id="sbCandWrap" class="sb-cand">${candDropHtml(cands)}</div>` : ''}
    <${swaps.length ? 'div' : 'label'} class="ed-field">${swaps.length ? `<span class="ed-lab-row"><span class="ed-lab">名稱</span>
      <button type="button" class="swap-btn" id="sbSwapBtn" aria-expanded="false"><i class="ti ti-arrows-exchange"></i> 從備選替換</button></span>
      <div id="sbSwapWrap">${candListHtml(swaps)}</div>` : '<span class="ed-lab">名稱</span>'}
      <input id="sbName" type="text" aria-label="名稱" value="${esc(sub.name)}" placeholder="${isStop ? '例如：山竹冰沙' : '例如：The Artist Spa'}" autocomplete="off"></${swaps.length ? 'div' : 'label'}>
    <div class="err" id="sbNameErr" hidden>請輸入名稱</div>
    <label class="ed-field"><span class="ed-lab">${isStop ? '原文店名' : '一句話說明'}</span>
      <input id="sbSub" type="text" value="${esc(isStop ? sub.orig : sub.desc)}" placeholder="${isStop ? '例如：Joost Smoothies' : '例如：高 CP 值人氣平價按摩'}" autocomplete="off"></label>
    ${isStop ? `
    <label class="ed-field"><span class="ed-lab">描述</span>
      <input id="sbDesc" type="text" value="${esc(sub.desc || '')}" placeholder="例如：米其林必比登推薦的泰北金麵" autocomplete="off" maxlength="80"></label>
    <div class="ed-field"><span class="ed-lab">時間</span>
      <div class="ed-time"><input id="sbS" type="time" step="300" value="${T(sub.s)}" aria-label="抵達時間">
        <span class="ed-arrow">→</span><span class="ed-endbox" id="sbEnd" aria-label="離開時間（自動算）"></span>
</div>
      ${durRulerHtml('sbRuler')}</div>
    <label class="ed-field"><span class="ed-lab">區域</span>
      <input id="sbArea" type="text" value="${esc(sub.area)}" placeholder="例如：寧曼區、Nimman Soi 13" autocomplete="off"></label>` : `
    <div class="ed-field"><span class="ed-lab">時間 <span class="ed-lab-hint">每一家同一個開始時間；整張的長度取最久的那一家</span></span>
      <div class="ed-time"><input id="sbS" type="time" step="300" value="${T(card.s)}" aria-label="開始時間（整張卡片一起改）">
        <span class="ed-arrow">→</span><span class="ed-endbox" id="sbEnd" aria-label="離開時間（自動算）"></span>
</div>
      ${durRulerHtml('sbRuler')}</div>`}
    <div class="ed-field"><span class="ed-lab">類型 <span class="ed-lab-hint">拆成獨立卡片時用這個顏色</span></span><div class="chips" id="sbCls">
      ${TYPES.map(([k, n]) => `<button type="button" class="chip ${k}${k === sed.cls ? ' on' : ''}" data-v="${k}">${n}</button>`).join('')}</div></div>
    <label class="ed-field"><span class="ed-lab">重點提醒</span>
      <input id="sbAlert" type="text" value="${esc(sub.alert || '')}" placeholder="例如：只收現金、16:30 關門" autocomplete="off"></label>
    <label class="ed-field"><span class="ed-lab">地圖 <span class="ed-lab-hint">貼上 Google 地圖的分享連結最準確</span></span>
      ${pinIn(`<span class="clr-wrap"><input id="sbMap" type="text" value="${esc(sub.map)}" placeholder="貼上分享連結，或輸入店名" autocomplete="off" inputmode="url"><button type="button" class="clr-btn" aria-label="清除" tabindex="-1"><i class="ti ti-x"></i></button></span>`, isGMap(sub.map))}</label>
    <div class="map-status" id="sbMapStatus"></div>
    ${!isNew && !c && placeMates(sub, sub).length ? `<div class="map-status">${mateHint(placeMates(sub, sub).length)}</div>` : ''}
    ${photoField('sbPhoto', nk)}
    <label class="ed-field"><span class="ed-lab">筆記摘要</span>
      <textarea id="sbMine" rows="3" placeholder="想提醒大家的事">${esc(sub.mine || '')}</textarea></label>
    ${fullNoteField('sbFull', nk)}
    <div class="err" id="sbErr" hidden></div>
    <div class="ed-actions">
      ${isNew || old ? '' : '<button type="button" class="btn ghost danger" id="sbDel"><i class="ti ti-trash"></i> 刪除</button>'}
      <button type="button" class="btn ghost ed-cancel">取消</button>
      <button type="button" class="btn primary" id="sbSave">${old ? '替換' : c ? '加入' : isNew ? '新增' : '儲存'}</button>
    </div>`, isNew && !cands.length && !c ? '#sbName' : '.sh-close');
  sheet.classList.add('soft');   // 淺色底、沒有框線的輸入框，圓角統一 12px
  wireCandDrop(sheet.querySelector('#sbCandWrap'), id => openSubEditor(cardId, kind, null, id));
  const $ = id => sheet.querySelector('#' + id);
  chipScroller($('sbCls'));
  $('sbCls').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    sed.cls = b.dataset.v; sheet.querySelectorAll('#sbCls .chip').forEach(x => x.classList.toggle('on', x === b));
  });
  // 從備選替換：改過欄位的提醒修改不會保留
  const sig = () => [...sheet.querySelectorAll('input,textarea')].map(x => x.value).join('\u0001') + sed.cls + sed.dur, sig0 = sig();
  $('sbSwapBtn')?.addEventListener('click', e => {
    e.preventDefault();
    const b = $('sbSwapBtn'), on = !b.classList.contains('open');
    b.classList.toggle('open', on); b.setAttribute('aria-expanded', on);
    $('sbSwapWrap').querySelector('.cand-drop').hidden = !on;
    if (on) presetType($('sbSwapWrap'), sed.cls);
  });
  wireCandDrop($('sbSwapWrap'), id => {
    if (sig() !== sig0 && !confirm('剛剛在這裡的修改不會保留，確定要換嗎？')) return;
    openSubEditor(cardId, kind, idx, id, true);
  }, { addEventListener() {} });
  const refresh = () => {
    $('sbMapStatus').innerHTML = mapStatusHtml($('sbMap').value.trim(), $('sbName').value.trim()); setPin($('sbMap'), isGMap($('sbMap').value.trim()));
    $('sbEnd').textContent = clock(($('sbS').value ? fromInput($('sbS').value) : m(isStop ? sub.s : card.s)) + sed.dur);
  };
  ['sbName', 'sbMap', 'sbS'].forEach(id => $(id)?.addEventListener('input', () => { $('sbNameErr').hidden = true; refresh(); }));
  wireRuler($('sbRuler'), () => sed.dur, v => { sed.dur = v; refresh(); }, !isNew && !old && !c);   // 停留多久：刻度尺
  wirePhoto('sbPhoto', nk);
  $('sbSave').addEventListener('click', saveSub);
  $('sbDel')?.addEventListener('click', deleteSub);
  refresh();
}
function saveSub() {
  const snap = takeSnap();
  const $ = id => sheet.querySelector('#' + id);
  const [, card] = findItem(sed.cardId), list = subList(card, sed.kind), isStop = sed.kind === 'stop';
  const name = $('sbName').value.trim();
  if (!name) { $('sbNameErr').hidden = false; $('sbName').focus(); return; }
  const old = sed.prefill || (sed.isNew ? {} : list[sed.idx]);
  const sub = { ...old, name, map: $('sbMap').value.trim(), mine: $('sbMine').value.trim(), cls: sed.cls, alert: $('sbAlert').value.trim() };
  if (name !== old.name) delete sub.short;                      // 改了名字，收合時就顯示新名字
  if (sub.map !== (old.map || '')) { sub.loc = ''; sub.pid = ''; }   // 地點換了：座標之後在背景重查
  if (!old.note && NOTES[subNoteKey(old)]) sub.note = subNoteKey(old);   // 改名後還找得到原本整理好的筆記
  const noteKey = sed.isNew && !sed.prefill ? name : subNoteKey(old);
  const fullChanged = setFullNote(noteKey, $('sbFull').value.trim()), photoChanged = savePhoto('sbPhoto', noteKey);
  if ((fullChanged && NOTES[noteKey]) || photoChanged) sub.note = noteKey;
  if (isStop) {
    const sMin = $('sbS').value ? fromInput($('sbS').value) : m(old.s || card.s);
    if (sMin + sed.dur > DAY_END) { $('sbErr').textContent = '最晚只能排到凌晨 05:00'; $('sbErr').hidden = false; return; }
    Object.assign(sub, { s: hhmm(sMin), dur: sed.dur, orig: $('sbSub').value.trim(), area: $('sbArea').value.trim(), desc: $('sbDesc').value.trim() });
  } else {
    Object.assign(sub, { desc: $('sbSub').value.trim(), dur: sed.dur });
    if (sed.prefill) delete sub.s;
    // 改了開始時間＝整張卡片一起移動（多選一每一家同一個開始時間）
    const sMin = $('sbS').value ? fromInput($('sbS').value) : m(card.s);
    if (sMin + sed.dur > DAY_END) { $('sbErr').textContent = '最晚只能排到凌晨 05:00'; $('sbErr').hidden = false; return; }
    if (hhmm(sMin) !== card.s) { const len = m(card.e) - m(card.s); card.s = hhmm(sMin); card.e = hhmm(Math.min(sMin + len, DAY_END)); }
  }
  // 從備選替換：原本那一家整份變成一張備選卡片（時間用它原本的時段）
  const out = sed.replace ? list[sed.idx] : null;
  if (out) {
    const os = isStop ? m(out.s) : m(card.s), od = isStop ? out.dur : +out.dur || m(card.e) - m(card.s);
    DATA.cand.push(cardOf(placeOf(out, card.cls), { s: hhmm(os), e: hhmm(Math.min(os + od, DAY_END)) }));
  }
  const mates = !sed.isNew && !sed.replace ? syncPlace(list[sed.idx], sub) : [];   // 同一個地點的其他卡片一起更新
  if (sed.isNew) list.push(sub); else list[sed.idx] = sub;
  let note = (sed.isNew ? (isStop ? '已新增一站' : '已新增選項') : '已儲存') + syncNote(mates);
  if (sed.fromCand) {   // 從備選挑的：搬進來之後，備選裡那張拿掉
    const i = DATA.cand.findIndex(x => x.id === sed.fromCand);
    if (i >= 0) DATA.cand.splice(i, 1);
    note = out ? `已把「${out.name}」換成「${name}」，「${out.name}」移到備選` : `已從備選加入「${name}」`;
  }
  if (isStop) {
    list.sort((a, b) => m(a.s) - m(b.s));
    // 改了某一站的時間：後面的站如果跟前一站重疊（被擠到），就往後順延到前一站結束
    let pushed = 0;
    for (let i = 1; i < list.length; i++) {
      const prevEnd = m(list[i - 1].s) + list[i - 1].dur;
      if (m(list[i].s) < prevEnd) { list[i].s = hhmm(Math.min(prevEnd, DAY_END - list[i].dur)); pushed++; }
    }
    if (pushed) note += `，後面 ${pushed} 站往後順延`;
    if (fitGroup(card)) note += `，區塊時間調整為 ${T(card.s)}–${T(card.e)}`;
  } else if (fitPick(card)) note += `，時段調整為 ${T(card.s)}–${T(card.e)}`;
  saveData(); closeSheet(); renderPage(current); toast(note, '復原', () => undoSnap(snap), UNDO_MS);
}
function deleteSub() {
  const [, card] = findItem(sed.cardId), list = subList(card, sed.kind), { idx, kind, cardId } = sed;
  if (kind === 'stop' && list.length <= 1) {
    const err = sheet.querySelector('#sbErr'); err.textContent = '合併區塊至少要有一站。要整個刪掉，請點區塊標題進入編輯'; err.hidden = false; return;
  }
  const removed = list.splice(idx, 1)[0];
  if (kind === 'alt' && !list.length) delete card.alts;
  if (kind === 'stop') fitGroup(card);
  saveData(); closeSheet(); renderPage(current);
  toast(`已刪除「${removed.name}」`, '復原', () => {
    const c = findItem(cardId)[1]; if (!c) return;
    subList(c, kind).splice(idx, 0, removed); if (kind === 'stop') fitGroup(c); saveData(); renderPage(current); toast('已復原');
  });
}

// ---------- 底部提示 ----------
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg, actionText, action, ms) {
  toastEl.innerHTML = `<span>${esc(msg)}</span>${actionText ? `<button type="button">${esc(actionText)}</button>` : ''}`;
  toastEl.classList.add('on');
  if (actionText) toastEl.querySelector('button').onclick = () => { toastEl.classList.remove('on'); action(); };
  clearTimeout(toastTimer);
  if (ms !== 0) toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms || (actionText ? 5000 : 2000));
}

// 旅行期間打開網站一律到今天（加到主畫面的捷徑會記住當時那一頁，所以不看網址）；其他時候照網址，沒有就到總覽
let shownToday = tripNow()?.day || null;
if (shownToday) history.replaceState(null, '', '#' + shownToday);
if (TRIP_ID && TRIP && TRIP_ROLE) rememberTrip(TRIP, TRIP_ROLE, TRIP_KEY, TRIP_CODE);
showPage(shownToday || location.hash.slice(1) || (TRIP_ID ? 'overview' : 'trips'), false);
try { if (sessionStorage.getItem('trip-enter')) { sessionStorage.removeItem('trip-enter'); if (current === 'overview') pageSlide('sl-in-r', ovEl); } } catch {}
try { justCreated = !!sessionStorage.getItem('trip-created'); sessionStorage.removeItem('trip-created'); } catch {}
try { const d = sessionStorage.getItem('trip-deleted'); if (d) { sessionStorage.removeItem('trip-deleted'); setTimeout(() => toast(`已刪除「${d}」`), 300); } } catch {}
{ const n = importCarry(); if (n) { renderTrips(); toast(n > 0 ? `已加入 ${n} 趟旅程` : '這些旅程本來就在列表裡了'); } }
if (resumeDraft && getAuth()) {
  editStart = resumeDraft;
  setEditing(true);
  if (draftCount()) toast('上次的修改還沒完成：按「完成」儲存，或按「取消」放棄', '知道了', () => {});
}
load();
</script>
