const dayTitle = document.getElementById('dayTitle'), daySub = document.getElementById('daySub');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isDay = p => DAY_KEYS.includes(p);
const dayNum = p => +p.slice(1);
let current = null, cardsEl = null, curLayer = null, busy = false;
const SLIDE_GAP = 28;   // 滑動時前後兩天卡片之間的距離

function updateHeader(page) {
  const today = tripNow()?.day;
  document.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.page === page;
    t.classList.toggle('today', t.dataset.page === today);
    t.classList.toggle('on', on);
    if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  if (isDay(page)) {
    const d = dayInfo(page);
    dayTitle.textContent = d.en;
    daySub.innerHTML = `${d.date}．${d.wd}${d.zh || editing ? `．<span id="subTheme">${esc(d.zh)}</span>` : ''}`;
  } else {
    dayTitle.textContent = PAGES[page].en;
    if (page === 'overview') daySub.textContent = TRIP ? `${dayInfo('d1').date}–${dayInfo(lastDay()).date}．${DAY_KEYS.length} 天 ${DAY_KEYS.length - 1} 夜` : '';
    else daySub.textContent = page === 'cand' ? `備選景點．${(DATA.cand || []).length} 個` : PAGES[page].sub;
  }
  document.documentElement.classList.toggle('on-trips', page === 'trips' || page === 'new');
  document.documentElement.classList.toggle('on-new', page === 'new');
  fab.classList.toggle('day', isDay(page) || page === 'cand');
  // 總覽頁沒有地圖，同一個位置改放房子：回到「我的旅程」
  const home = page === 'overview';
  mapBtn.hidden = !(home || isDay(page) || page === 'cand');
  mapBtn.innerHTML = `<i class="ti ${home ? 'ti-home' : mapMode ? 'ti-list' : 'ti-map'}"></i>`;
  mapBtn.setAttribute('aria-label', home ? '回到我的旅程' : mapMode ? '回到清單' : '看地圖');
  applyHeaderEditable();
  document.getElementById('routeFab').classList.toggle('day', isDay(page));
  document.getElementById('ebDay').textContent = isDay(page) ? `第 ${dayNum(page)} 天` : page === 'cand' ? '備選' : '';
  document.querySelector('.tab.on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  updateTabFade();
}

let renderedPage = null, wantPage = null, justCreated = false;
function renderPage(page) {
  const prevPage = renderedPage;
  // 重畫同一頁（例如進出編輯模式、存檔後）時，記住哪些區塊是展開的
  const keepOpen = page === renderedPage ? expanders.filter(ex => ex.el.classList.contains('open')).map(ex => ex.el.dataset.id) : [];
  renderedPage = page;
  computeRange();
  tl.innerHTML = ''; movable.length = 0; expanders.length = 0;
  tl.classList.remove('sliding');
  // 地圖模式：時間軸、備選清單收起來，改顯示地圖
  const onMap = mapOn(page);
  mapView.hidden = !onMap;
  document.documentElement.classList.toggle('on-map', onMap); syncTint();
  tripsEl.hidden = page !== 'trips';
  if (page === 'trips') renderTrips();
  wizEl.hidden = page !== 'new';
  if (page === 'new') { if (prevPage !== 'new') wizReset(); renderWiz(); }
  if (onMap) { ovEl.hidden = candEl.hidden = true; tl.style.display = 'none'; cardsEl = curLayer = null; drawMap(page); return; }
  ovEl.hidden = page !== 'overview';
  if (page === 'overview') renderOverview();
  candEl.hidden = page !== 'cand';
  if (page === 'cand') renderCand();
  if (!isDay(page)) { tl.style.display = 'none'; cardsEl = curLayer = null; return; }
  tl.style.display = ''; tl.style.height = baseH + 'px'; addBottom = 0;
  renderGrid();
  cardsEl = div('cards'); tl.appendChild(cardsEl);
  curLayer = buildLayer(page, true); cardsEl.appendChild(curLayer);
  if (!loaded) tl.appendChild(div('tl-msg', loadErrText()));
  else addButton(page);
  if (keepOpen.length) {
    for (const ex of expanders) if (keepOpen.includes(ex.el.dataset.id)) {
      ex.el.classList.add('open');
      ex.trigger.setAttribute('aria-expanded', 'true');
      const chev = ex.trigger.querySelector('.chev');
      if (chev) chev.className = 'ti chev ti-chevron-up';
    }
    relayout();
  }
  markNow();
}

// ---------- 備選景點 ----------
// 跟每天一樣的彩色卡片，沒有時間軸、由上往下排。編輯時「日期」選某一天就排進去
const candEl = document.getElementById('cand');
// 篩選類型、排列方式（最新加入／分類）記在這支手機
const CAND_VIEW_KEY = 'cm-cand-view';
let candView = { f: '', sort: 'new' };
try { Object.assign(candView, JSON.parse(localStorage.getItem(CAND_VIEW_KEY)) || {}); } catch {}
function renderCand() {
  if (!loaded) { candEl.innerHTML = `<div class="ov-empty">${loadErrText()}</div>`; return; }
  const all = DATA.cand || [];
  if (candView.f && !all.some(c => (c.cls || 'eat') === candView.f)) candView.f = '';   // 那一類都排走了，回到全部
  const shown = all.filter(c => !candView.f || (c.cls || 'eat') === candView.f).reverse();   // 後加入的在後面，反過來＝最新的在上面
  const card = it => {
    const mins = m(it.e) - m(it.s), multi = it.group || it.alts?.length;
    const names = it.group ? it.stops.map(x => x.short || x.name).join(' → ') : it.alts?.length ? it.alts.map(a => a.name).join('／') : '';
    const tags = (it.booked ? ' · <i class="ti ti-circle-check"></i> 已訂位' : '') + (it.alert ? ` · <i class="ti ti-alert-triangle"></i> ${esc(it.alert)}` : '');
    return `<div class="blk ${it.cls || 'eat'}${it.map && !multi ? ' has-nav' : ''}" data-id="${it.id}">
      <div class="t">${multi ? `<i class="ti ${it.group ? 'ti-stack-2' : 'ti-arrows-split-2'}"></i> ` : ''}${esc(it.t)}</div>
      ${names ? `<div class="d">${esc(names)}</div>` : it.desc === PENDING ? '<div class="d"><i class="ti ti-loader-2 spin"></i> 查詢中，查好會自動填上</div>' : it.desc ? `<div class="d">${esc(it.desc)}</div>` : ''}
      <div class="s">預計 ${T(it.s)}–${T(it.e)} · ${durLabel(mins)}${tags}</div>
      ${it.map && !multi ? navBtn(it.map, it.t) : ''}${editIc}</div>`;
  };
  let body;
  if (!all.length) body = '<div class="ov-empty">還沒有備選景點。按上面「加入新地點」搜尋店名，或貼上 Google 地圖的店家、清單連結</div>';
  else if (candView.sort === 'type' && !candView.f)
    body = TYPES.map(([k, n]) => { const g = shown.filter(c => (c.cls || 'eat') === k);
      return g.length ? `<div class="cand-grp ${k}"><span class="cp-dot"></span>${n}<b>${g.length}</b></div>` + g.map(card).join('') : ''; }).join('');
  else body = shown.map(card).join('');
  candEl.innerHTML = `<button type="button" class="btn ghost cand-import" id="candImport"><i class="ti ti-plus"></i> 加入新地點</button>
    ${all.length > 1 ? `<div class="cand-bar">
      <div class="cand-chips">${typeChips(all, candView.f, 'cand-filter')}</div>
      <span class="cand-sep" aria-hidden="true"></span>
      ${sortBtn()}</div>` : ''}
    <div class="cand-list${candAnim ? ' anim' : ''}">${body}</div>`;
  candAnim = false;
  candEl.querySelector('.cand-chips')?.addEventListener('scroll', chipFade, { passive: true });
  chipFade();
}
let candAnim = false;   // 換篩選／排列後重畫時，清單淡入
function chipFade() {
  const c = candEl.querySelector('.cand-chips'); if (!c) return;
  const max = c.scrollWidth - c.clientWidth;
  c.classList.toggle('fade-l', c.scrollLeft > 2);

}
addEventListener('resize', chipFade);
// 排列切換鈕：一個圖示，點一下換另一種（時鐘＝最新加入、方塊＝依類型）
const SORTS = { new: ['ti-clock', '最新加入'], type: ['ti-category', '依類型'] };
const sortBtn = spin => `<button type="button" class="cand-sortbtn${spin ? ' flip' : ''}" data-sort aria-label="排列：${SORTS[candView.sort][1]}，點一下切換"><i class="ti ${SORTS[candView.sort][0]}"></i></button>`;
// 編輯模式下點卡片＝編輯

// ---------- 總覽 ----------
const ovEl = document.getElementById('ov');
const TYPE_NAME = Object.fromEntries(TYPES);
// 標籤用短一點的名字：去掉括號裡的補充；「英文店名 中文說明」只留英文店名
function shortName(t) {
  t = t.replace(/[（(][^）)]*[）)]\s*$/, '').trim();
  const m = t.match(/^([A-Za-z0-9][A-Za-z0-9.&'’ -]*?)\s+[\u4e00-\u9fff]/);
  return m ? m[1] : t;
}
// 總覽目前在哪一頁（每天／待辦清單），記在這支手機
let ovTab = 'days';
try { ovTab = localStorage.getItem('cm-ov-tab') === 'todo' ? 'todo' : 'days'; } catch {}
function renderOverview() {
  const today = tripNow()?.day;
  const days = DAY_KEYS.map(k => ({ k, info: dayInfo(k), items: [...(DATA[k] || [])].sort((a, b) => m(a.s) - m(b.s)) }));
  let html = '';
  if (!loaded) { ovEl.innerHTML = `<div class="ov-empty">${loadErrText()}</div>`; return; }
  // 小統計：按摩算次數，其他類型同一家只算一次；合併區塊裡的每一站各算一家，多選一算一家；交通、住宿（其他）不算
  const count = {}, seen = new Set();
  for (const d of days) for (const it of d.items) {
    const add = (cls, name) => {
      if (cls === 'other') return;
      if (cls !== 'spa' && name && seen.has(name)) return;
      seen.add(name); count[cls] = (count[cls] || 0) + 1;
    };
    if (it.group && it.stops?.length) it.stops.forEach(st => add(it.cls, st.name));
    else add(it.cls, it.alts?.length ? it.id : it.t);

// 換封面：上傳照片，或從這趟筆記裡已有的照片挑一張；可以拖曳選要顯示的範圍
function openCover() {

  const notePhotos = [...new Set(Object.values(NOTES).map(n => splitPhoto(n.photo).src).filter(Boolean))].slice(0, 30);
  openSheet(`

    <div class="ed-actions">
      <button type="button" class="btn ghost ed-cancel">取消</button>
      <button type="button" class="btn primary" id="cvSave">儲存</button>
    </div>`);
  const $ = id => sheet.querySelector('#' + id), prev = $('cvPrev');
  const draw = () => {
    prev.innerHTML = coverHtml(cv.src ? joinPhoto(cv.src, cv.x, cv.y) : '', TRIP.en || tripCity() + '.');
    $('cvNone').hidden = !cv.src;
    $('cvSt').textContent = cv.busy ? '上傳中…' : cv.src ? '可以拖曳照片選要顯示的範圍' : '';
    $('cvSave').disabled = cv.busy;
  };
  // 拖曳調整範圍（跟筆記照片一樣存在網址後面 #p=x,y）
  let d0 = null;
  prev.addEventListener('pointerdown', e => { const img = prev.querySelector('img'); if (!img) return; const r = img.getBoundingClientRect(), k = Math.min(img.naturalWidth / r.width, img.naturalHeight / r.height);
    d0 = { x: e.clientX, y: e.clientY, px: cv.x, py: cv.y, ox: img.naturalWidth / k - r.width, oy: img.naturalHeight / k - r.height }; prev.setPointerCapture(e.pointerId); });

    const img = prev.querySelector('img'); if (img) img.style.objectPosition = `${cv.x}% ${cv.y}%`; });
  const end = () => { d0 = null; }; prev.addEventListener('pointerup', end); prev.addEventListener('pointercancel', end);
  sheet.querySelector('.cv-grid')?.addEventListener('click', e => { const b = e.target.closest('[data-src]'); if (!b) return; Object.assign(cv, { src: b.dataset.src, x: 50, y: 50 }); draw(); });

  $('cvFile').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    let shot; try { shot = await shrinkPhoto(f); } catch (err) { toast(err.message); return; }
    Object.assign(cv, { src: shot.dataUrl, x: 50, y: 50, busy: true }); draw();
    try { const up = await api({ ...getAuth(), action: 'uploadPhoto', data: shot.b64, mime: 'image/jpeg', name: 'cover' }, 60000);
      if (cv.src === shot.dataUrl) cv.src = up.url; }

    cv.busy = false; draw();
  });
  $('cvSave').addEventListener('click', async e => {
    const cover = cv.src ? joinPhoto(cv.src, cv.x, cv.y) : '';
    if (cover === (TRIP.cover || '')) { closeSheet(); return; }
    e.currentTarget.disabled = true;
    try { const r = await api({ ...getAuth(), action: 'saveTrip', cover }); setTrip({ ...TRIP, ...r.trip }); rememberTrip(TRIP, 'edit', TRIP_KEY, TRIP_CODE); cache(); closeSheet(); renderOverview(); toast('已更新封面'); }
    catch (x) { e.currentTarget.disabled = false; toast(x.message); }
  });
  draw();
}

// 打開「帶到其他裝置」的連結：合併進這支手機的列表（已經有的保留，補上編輯碼），名稱、日期等跟雲端要
function importCarry() {
  const m = /^#import=([\w-]+)/.exec(location.hash); if (!m) return 0;
  let list = [];
  try { list = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch {}
  const mine = myTrips();
  let added = 0;
  for (const [id, key, code] of Array.isArray(list) ? list : []) {
    if (!/^t\w+$/.test(id || '') || !key) continue;
    const old = mine.find(x => x.id === id);
    if (old) { if (!old.code && code) Object.assign(old, { code, role: 'edit', key }); continue; }
    mine.push({ id, key, code: code || '', role: code ? 'edit' : 'view' }); added++;
  }
  try { localStorage.setItem(MINE_KEY, JSON.stringify(mine.slice(0, 50))); } catch {}
  history.replaceState(null, '', location.pathname + location.search + '#trips');
  tripsFetched = false;
  return list.length ? added || -1 : 0;
}
// 複製到剪貼簿：https 用 Clipboard API；http（本機測試）用隱藏的輸入框＋copy 指令（要在點擊當下執行）
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) { try { await navigator.clipboard.writeText(text); return true; } catch {} }
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta);
  ta.focus(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  ta.remove();
  return ok;
}

function pressStart(e, x, y) {
  if (editing || !(isDay(current) || current === 'cand') || busy || sheet.classList.contains('on')) return;
  if (e.target.closest('.nav, .add-sub')) return;
  const row = e.target.closest('.layer .stop[data-kind]'), card = e.target.closest('.layer [data-id], .cand-page [data-id]');
  if (!card) return;
  const el = row || card;
  press = { x, y, el, timer: setTimeout(() => pressFire(card.dataset.id, row), PRESS_MS) };
  setTimeout(() => { if (press?.el === el) el.classList.add('pressing'); }, 120);   // 手指停住一下才開始縮，捲動時不會一直閃
}
function pressCancel() {
  if (!press) return;
  clearTimeout(press.timer); press.el.classList.remove('pressing'); press = null;
}
function pressFire(id, row) {
  const el = press?.el; pressCancel();
  pressFired = true; setTimeout(() => pressFired = false, 600);
  navigator.vibrate?.(10);
  const open = () => row ? openSubEditor(id, row.dataset.kind, +row.dataset.idx) : openEditor(id);
  if (!findItem(id)[1]) return;
  if (getAuth()) open(); else openAuth(open);
}
for (const el of [tl, candEl]) {
  el.addEventListener('touchstart', e => { if (e.touches.length === 1) pressStart(e, e.touches[0].clientX, e.touches[0].clientY); else pressCancel(); }, { passive: true });
  el.addEventListener('touchmove', e => { if (press && (Math.abs(e.touches[0].clientX - press.x) > MOVE_TOL || Math.abs(e.touches[0].clientY - press.y) > MOVE_TOL)) pressCancel(); }, { passive: true });
  el.addEventListener('touchend', pressCancel);
  el.addEventListener('touchcancel', pressCancel);
  el.addEventListener('mousedown', e => { if (e.button === 0) pressStart(e, e.clientX, e.clientY); });
}
addEventListener('mousemove', e => { if (press && (Math.abs(e.clientX - press.x) > MOVE_TOL || Math.abs(e.clientY - press.y) > MOVE_TOL)) pressCancel(); });
addEventListener('mouseup', pressCancel);
addEventListener('scroll', pressCancel, { passive: true });
// 長按放開後的那一下點擊，不要被當成「展開／收合」或「導航」
[tl, candEl].forEach(el => el.addEventListener('click', e => { if (pressFired) { pressFired = false; e.stopPropagation(); e.preventDefault(); } }, true));

const headerEl = document.querySelector('header');

// 可以左右滑的標籤列：還能往哪邊滑，那一側就淡出；一打開先把選中的那顆捲到看得見
function chipScroller(row) {
  if (!row) return;
  const fade = () => { const max = row.scrollWidth - row.clientWidth; row.classList.toggle('fade-l', row.scrollLeft > 2); row.classList.toggle('fade-r', row.scrollLeft < max - 2); };
  const on = row.querySelector('.chip.on, .on');
  if (on && on.offsetLeft + on.offsetWidth > row.clientWidth) row.scrollLeft = on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;

function wireCandDrop(wrap, onPick, btn) {

// Google 的地點類型 → 我們的類型
function guessCls(types) {
  const t = (types || []).join(' ');
  return /spa|massage|beauty/.test(t) ? 'spa' : /cafe|coffee|bakery|dessert|tea_house|ice_cream/.test(t) ? 'cafe' : /bar|pub|night_club|wine/.test(t) ? 'bar'
    : /restaurant|food|meal|diner/.test(t) ? 'eat' : /shopping|store|market|mall/.test(t) ? 'shop'
    : /tourist|museum|temple|church|park|zoo|aquarium|landmark|gallery|attraction|historical|place_of_worship|hiking/.test(t) ? 'see' : /lodging|hotel|airport|station/.test(t) ? 'other' : 'eat';
}
const CLS_DUR = { eat: 60, cafe: 45, bar: 90, spa: 90, see: 90, shop: 60, other: 30 };
// 搜尋地點的中心：旅程的目的地座標；沒有（舊資料、建立時沒查到）就用住處、已經排的店家，再沒有就用 Google 查一次目的地名稱
let biasAt = null, biasFor = '';
async function tripBias() {
  if (!TRIP || biasFor === TRIP.id + TRIP.dest + TRIP.center) return biasAt;
  biasFor = TRIP.id + TRIP.dest + TRIP.center;
  const ll = v => { const mm = /^\s*(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/.exec(v || ''); return mm ? { lat: +mm[1], lng: +mm[2] } : null; };
  biasAt = ll(TRIP.center) || ll(tripStays().find(h => h.loc)?.loc) || ll(ALL_KEYS.flatMap(k => DATA[k] || []).find(it => it.loc)?.loc);
  if (biasAt || !TRIP.dest) return biasAt;
  try {
    const key = await getMapsKey(); if (!key) return null;
    await loadMaps(key);
    const { Place } = await google.maps.importLibrary('places');
    const { places } = await Place.searchByText({ textQuery: TRIP.dest, fields: ['location'], maxResultCount: 1 });
    const loc = places?.[0]?.location; if (loc) biasAt = { lat: loc.lat(), lng: loc.lng() };
  } catch {}
  return biasAt;
}

  $('edHome')?.addEventListener('click', e => {

// 原本排在這張「後面」的行程（用原本的開始時間判斷）
function laterItems() {
  if (!ed || ed.isNew) return [];
  return DATA[current].filter(x => x.id !== ed.id && m(x.s) >= m(ed.orig.s));
}

// 多個地點／多選一 換樣式：split＝每一站／每個選項各自變成一張卡片；group⇄pick 互換
function convertCard(id, to, snap) {
  const [day, it] = findItem(id); if (!it) return;
  const list = DATA[day];
  const subs = it.group ? it.stops || [] : it.alts || [];
  let msg;
  if (to === 'split') {
    const cards = subs.map((x, i) => {
      const s = it.group ? m(x.s) : m(it.s), e = it.group ? m(x.s) + x.dur : +x.dur ? m(it.s) + +x.dur : m(it.e);
      const p = placeOf(x, it.cls);
      if (!p.alert && i === 0 && it.alert) p.alert = it.alert;   // 整張卡片的提醒給第一張
      return cardOf(p, { s: hhmm(s), e: hhmm(Math.min(Math.max(e, s + 5), DAY_END)), travel: i === 0 ? it.travel || '' : '', troute: i === 0 ? it.troute || '' : '', booked: i === 0 && !!it.booked });
    });
    list.splice(list.indexOf(it), 1, ...cards);
    list.sort((a, b) => m(a.s) - m(b.s));
    msg = `已把「${it.t}」拆成 ${cards.length} 張卡片`;
  } else if (to === 'pick') {
    it.alts = subs.map(x => ({ ...placeOf(x), dur: +x.dur || 0 }));
    // 幾家選一家去：時段取停留最久的那一家（從原本的開始時間算），不是全部加起來
    const longest = Math.max(15, ...subs.map(x => +x.dur || 0));
    it.e = hhmm(Math.min(m(it.s) + longest, DAY_END));
    delete it.stops; it.group = false;
    msg = `「${it.t}」改成多選一，時段 ${T(it.s)}–${T(it.e)}`;
  } else {
    const n = Math.max(1, subs.length), dur = Math.max(5, Math.round((m(it.e) - m(it.s)) / n / 5) * 5);
    let at = m(it.s);   // 有各自的停留時間就照著排，沒有就平分
    it.stops = subs.map(x => { const d = +x.dur || dur, st = { ...placeOf(x), s: hhmm(Math.min(at, DAY_END - d)), dur: d }; at += d; return st; });
    delete it.alts; it.group = true; fitGroup(it);
    msg = `「${it.t}」改成多個地點，每站 ${dur} 分`;
  }
  saveData('改卡片樣式'); closeSheet(); renderPage(current);
  toast(msg, '復原', () => undoSnap(snap), UNDO_MS);
}
// 按儲存之後 3 秒內可以復原：存之前先拍一張快照（每天、備選的卡片和筆記）
const UNDO_MS = 3000;
const takeSnap = () => ({ data: Object.fromEntries(ALL_KEYS.map(k => [k, clone(DATA[k] || [])])), notes: clone(NOTES) });
function undoSnap(snap) {
  ALL_KEYS.forEach(k => { DATA[k] = snap.data[k]; });
  for (const [k, v] of Object.entries(snap.notes)) if (JSON.stringify(NOTES[k]) !== JSON.stringify(v)) { NOTES[k] = v; noteQueue[k] = ++noteSeq; }   // 筆記改回原本的樣子
  saveData('復原'); renderPage(current); updateHeader(current); toast('已復原');
}
// 從備選替換：被換掉的那張整張搬到備選（內容、筆記都留著，時間不動）
function swapOut() {
  if (!ed.replaceId) return false;
  const [day] = findItem(ed.replaceId);
  if (day && day !== 'cand') moveDay(ed.replaceId, day, 'cand');
  return true;
}
function saveEditor() {
  const snap = takeSnap(), undo = () => undoSnap(snap);
  const $ = id => sheet.querySelector('#' + id);
  const t = $('edT').value.trim();
  if (!t) { $('edTErr').hidden = false; $('edT').focus(); return; }
  const gt = ed.kind !== 'one' ? $('edGT').value.trim() : '';
  // 完整筆記：新卡片用名稱當筆記代號；這張卡片原本沒有連到筆記的話，順便連上
  const fullEl = $('edFull'), noteKey = ed.noteKey || t;

  const photoTouched = savePhoto('edPhoto', noteKey);
  if (ed.kind !== 'one' && !gt) { $('edGTErr').hidden = false; $('edGT').focus(); return; }
  const sMin = $('edS').value ? fromInput($('edS').value) : m(ed.s), eMin = sMin + ed.dur;
  const timeErr = msg => { $('edTimeErr').textContent = msg; $('edTimeErr').hidden = false; };
  if (eMin > DAY_END) return timeErr('最晚只能排到凌晨 05:00');
  const push = $('edPush')?.checked && ed.day === ed.fromDay;
  const delta = ed.isNew ? 0 : eMin - m(ed.orig.e);
  if (push && laterItems().some(x => m(x.e) + delta > DAY_END)) return timeErr('順延後有行程會超過凌晨 05:00，請調整一下');
  if (!ed.isNew && ed.booked && (hhmm(sMin) !== ed.orig.s || hhmm(eMin) !== ed.orig.e) &&
      !confirm('這是已訂位的行程，確定要改時間嗎？')) return;
  const fields = { t, s: hhmm(sMin), e: hhmm(eMin), travel: ed.tval };
  // 交通時間怎麼來的：按「計算」選的＝auto；自己填的、只換了方式的＝manual（記下當時的起點終點，地點變了一樣會提醒）
  const nowKey = () => routeKey(prevOf(ed.day, ed.replaceId || ed.id, sMin), ed.id ? findItem(ed.id)[1] : null);
  if (ed.tsel === 'calc') fields.troute = `auto|${ed.tmode}|${ed.tkey}`;
  else if (ed.tsel === 'manual' || ed.tchanged) fields.troute = ed.tval ? `manual|${ed.tmode}|${ed.tsel === 'manual' ? nowKey() : parseRoute(ed.troute).key || nowKey()}` : '';
  else if (ed.fromCand) fields.troute = '';
  if (!ed.group) Object.assign(fields, {
    cls: ed.cls, ...(ed.pick ? {} : { map: $('edMap').value.trim(), desc: $('edDesc').value.trim() }),
    ...(fullEl && (NOTES[noteKey] || photoTouched) ? { note: noteKey } : {}), booked: $('edBooked').checked,
    alert: $('edAlert').value.trim(), mine: $('edMine').value.trim(),
  });
  if (fields.map !== undefined && fields.map !== ed.map) Object.assign(fields, ed.home && fields.map === (ed.home.map || ed.home.name)
    ? { loc: ed.home.loc || '', pid: ed.home.pid || '' } : { loc: '', pid: '' });   // 地點換了：座標之後在背景重查（回住處的直接用住處的座標）
  if (ed.kind !== 'one') {
    // 這張卡片變成第一站／第一個選項，卡片本身改用新的標題
    const it = ed.isNew ? { id: uid() } : findItem(ed.id)[1];
    if (!ed.isNew && push && delta) laterItems().forEach(x => { x.s = hhmm(m(x.s) + delta); x.e = hhmm(m(x.e) + delta); });
    const first = placeOf({ ...it, ...fields, t });   // 店家資料整份變成第一站／第一個選項（提醒、營業時間都是那一家店的）
    Object.assign(it, fields, { t: gt }); PLACE_KEYS.filter(k => k !== 'cls').forEach(k => it[k] = '');
    if (ed.kind === 'group') { it.group = true; it.stops = [{ ...first, s: fields.s, dur: ed.dur }]; delete it.alts; }
    else it.alts = [{ ...first, dur: ed.dur }];
    if (ed.isNew) DATA[ed.day].push(it); else moveDay(it.id, ed.fromDay, ed.day);
    swapOut();
    saveData(); closeSheet(); renderPage(current);
    toast(`已建立「${gt}」，展開後可以加入更多${ed.kind === 'group' ? '站' : '選項'}`, '復原', undo, UNDO_MS);
    return;
  }
  if (ed.isNew) {
    DATA[ed.day].push({ id: uid(), ...fields });
  } else {
    if (push && delta) laterItems().forEach(x => { x.s = hhmm(m(x.s) + delta); x.e = hhmm(m(x.e) + delta); });

    if (ed.group) { const shift = sMin - m(ed.orig.s); if (shift) findItem(ed.id)[1].stops.forEach(x => x.s = hhmm(m(x.s) + shift)); }

    moveDay(ed.id, ed.fromDay, ed.day);
    if (swapOut()) { saveData(`換成「${t}」`); closeSheet(); renderPage(current); updateHeader(current);
      toast(`已把「${ed.oldT}」換成「${t}」，「${ed.oldT}」移到備選`, '復原', undo, UNDO_MS); return; }
    const cur = ed.group ? 'group' : ed.pick ? 'pick' : '';
    if (cur && ed.conv && ed.conv !== cur) { convertCard(ed.id, ed.conv, snap); return; }
  }

    return;
  }
  toast((ed.isNew ? '已新增' : push && delta ? `已儲存，後面 ${laterItems().length} 個行程一起${delta > 0 ? '順延' : '提前'}` : '已儲存') + syncNote(mates || []), '復原', undo, UNDO_MS);
}

// ---------- 從 Google 地圖導入（備選頁） ----------
// 貼上一個或多個分享連結 → 雲端解開連結拿店名，再請 Gemini 查描述／類型／提醒 → 預覽可以改 → 加入備選
// 一次加好幾個（貼了清單連結、好幾個連結）：用原本的匯入畫面列出來勾選，放進備選

function openImport() {

      <div class="sh-sub">在 Google 地圖按「分享」→「複製連結」，貼在下面，一行一個（最多 10 個）；也可以貼整個清單的連結</div></div>
      <button class="sh-close" aria-label="關閉"><i class="ti ti-x"></i></button></div>
    <label class="ed-field"><span class="ed-lab">Google 地圖連結 <span class="ed-lab-hint">貼上就會開始查，打店名按 Enter</span></span>
      <textarea id="imLinks" rows="3" placeholder="https://maps.app.goo.gl/…" autocomplete="off" spellcheck="false"></textarea></label>
    <div class="im-list" id="imList"></div>

  const out = sed.replace ? list[sed.idx] : null;
  if (out) {
    const os = isStop ? m(out.s) : m(card.s), od = isStop ? out.dur : +out.dur || m(card.e) - m(card.s);
    DATA.cand.push(cardOf(placeOf(out, card.cls), { s: hhmm(os), e: hhmm(Math.min(os + od, DAY_END)) }));
  }
  const mates = !sed.isNew && !sed.replace ? syncPlace(list[sed.idx], sub) : [];   // 同一個地點的其他卡片一起更新
  if (sed.isNew) list.push(sub); else list[sed.idx] = sub;
  let note = (sed.isNew ? (isStop ? '已新增一站' : '已新增選項') : '已儲存') + syncNote(mates);
  if (sed.fromCand) {   // 從備選挑的：搬進來之後，備選裡那張拿掉
    const i = DATA.cand.findIndex(x => x.id === sed.fromCand);
    if (i >= 0) DATA.cand.splice(i, 1);
    note = out ? `已把「${out.name}」換成「${name}」，「${out.name}」移到備選` : `已從備選加入「${name}」`;
  }
  if (isStop) {
    list.sort((a, b) => m(a.s) - m(b.s));
    // 改了某一站的時間：後面的站如果跟前一站重疊（被擠到），就往後順延到前一站結束
    let pushed = 0;
    for (let i = 1; i < list.length; i++) {
      const prevEnd = m(list[i - 1].s) + list[i - 1].dur;
      if (m(list[i].s) < prevEnd) { list[i].s = hhmm(Math.min(prevEnd, DAY_END - list[i].dur)); pushed++; }
    }
    if (pushed) note += `，後面 ${pushed} 站往後順延`;
    if (fitGroup(card)) note += `，區塊時間調整為 ${T(card.s)}–${T(card.e)}`;
  } else if (fitPick(card)) note += `，時段調整為 ${T(card.s)}–${T(card.e)}`;
  saveData(); closeSheet(); renderPage(current); toast(note, '復原', () => undoSnap(snap), UNDO_MS);
}
function deleteSub() {
  const [, card] = findItem(sed.cardId), list = subList(card, sed.kind), { idx, kind, cardId } = sed;
  if (kind === 'stop' && list.length <= 1) {
    const err = sheet.querySelector('#sbErr'); err.textContent = '合併區塊至少要有一站。要整個刪掉，請點區塊標題進入編輯'; err.hidden = false; return;
  }
  const removed = list.splice(idx, 1)[0];
  if (kind === 'alt' && !list.length) delete card.alts;
  if (kind === 'stop') fitGroup(card);
  saveData(); closeSheet(); renderPage(current);
  toast(`已刪除「${removed.name}」`, '復原', () => {
    const c = findItem(cardId)[1]; if (!c) return;
    subList(c, kind).splice(idx, 0, removed); if (kind === 'stop') fitGroup(c); saveData(); renderPage(current); toast('已復原');
  });
}

// ---------- 底部提示 ----------
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg, actionText, action, ms) {
  toastEl.innerHTML = `<span>${esc(msg)}</span>${actionText ? `<button type="button">${esc(actionText)}</button>` : ''}`;
  toastEl.classList.add('on');
  if (actionText) toastEl.querySelector('button').onclick = () => { toastEl.classList.remove('on'); action(); };
  clearTimeout(toastTimer);
  if (ms !== 0) toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms || (actionText ? 5000 : 2000));
}

// 旅行期間打開網站一律到今天（加到主畫面的捷徑會記住當時那一頁，所以不看網址）；其他時候照網址，沒有就到總覽
let shownToday = tripNow()?.day || null;
if (shownToday) history.replaceState(null, '', '#' + shownToday);
if (TRIP_ID && TRIP && TRIP_ROLE) rememberTrip(TRIP, TRIP_ROLE, TRIP_KEY, TRIP_CODE);
showPage(shownToday || location.hash.slice(1) || (TRIP_ID ? 'overview' : 'trips'), false);
try { justCreated = !!sessionStorage.getItem('trip-created'); sessionStorage.removeItem('trip-created'); } catch {}
{ const n = importCarry(); if (n) { renderTrips(); toast(n > 0 ? `已加入 ${n} 趟旅程` : '這些旅程本來就在列表裡了'); } }
if (resumeDraft && getAuth()) {
  editStart = resumeDraft;
  setEditing(true);
  if (draftCount()) toast('上次的修改還沒完成：按「完成」儲存，或按「取消」放棄', '知道了', () => {});
}
load();
</script>
