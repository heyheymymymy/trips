.rt-ride{margin-left:6px;border-left:4px solid var(--border);padding:6px 0 6px 18px}   /* 交通卡片：灰色、沒有下拉，只是給你看時間，不能在這裡改 */
.rt-ride-card{background:var(--fill);color:var(--text2);border-radius:12px;padding:10px 14px 12px}
.rt-ride-top{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.rt-ride-top .ti{font-size:16px}
.rt-ride-top span{flex:1}
.rt-ride-top b{color:var(--text2);font-size:13.5px}
.rt-ride-st{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600;color:var(--text2);line-height:1.4}
.rt-ride-st span:first-child{flex:1;min-width:0}
.rt-ride-tm{flex:none;font-size:13px;font-weight:500;color:var(--muted)}
.rt-ride-legs{padding:2px 0}
.rt-ride-leg{position:relative;padding:3px 0 3px 16px;font-size:12.5px;color:var(--muted);line-height:1.4}
.rt-ride-leg::before{content:'';position:absolute;left:3px;top:calc(.7em + 3px - 3.5px);width:5px;height:5px;border-radius:50%;background:var(--muted)}
.rt-ride-leg:not(:last-child)::after{content:'';position:absolute;left:5px;top:calc(.7em + 3px + 3px);bottom:calc(-.7em - 3px + 5px);border-left:1.5px dotted var(--muted)}
.rt-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:0;border-radius:8px;background:var(--fill);color:var(--text2);font:inherit;font-size:14px;white-space:nowrap}
.rt-chip .ti{font-size:16px}
button.rt-chip{cursor:pointer}
.rt-chip.new{color:var(--accent-fg);font-weight:600}
.rt-chip.off{color:var(--muted)}
.rt-chip .ti-chevron-down{color:var(--text);font-size:15px;margin-left:-2px}
.rt-tag{font-size:12px;color:var(--muted)}
.rt-done{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 9px 0 7px;border-radius:999px;background:var(--spa-bg);color:var(--spa-fg);font-size:12px;font-weight:600;white-space:nowrap}
.rt-done .ti{font-size:14px}
.rt-err{width:100%;font-size:12px;color:var(--muted)}
.rt-menu{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.rt-menu button{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border:0;border-radius:999px;background:var(--fill);color:var(--text2);font:inherit;font-size:13px;cursor:pointer}
.rt-menu button.on{background:var(--accent-bg);color:var(--accent-fg);font-weight:600}
.rt-menu button:disabled{opacity:.5;cursor:default}
.rt-menu button span{color:var(--muted);font-weight:400}
.ed-travel{display:flex;gap:8px;align-items:center}
.ed-travel .seg{flex:1;min-width:0}
.ed-tmin{flex:none;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text2)}
.sheet .ed-tmin input{width:58px;height:36px;padding:0 6px;text-align:center}
.ed-travel-st{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.5}
.ed-travel-foot{display:flex;align-items:flex-start;gap:10px;margin-top:6px}
.ed-travel-foot .ed-travel-st{flex:1;min-width:0;margin-top:2px}
.ed-switch.sm{flex:none;margin:0;gap:6px;font-size:12px;color:var(--text2)}
.ed-switch.sm input.sw{width:34px;height:20px;border-radius:10px}
.ed-switch.sm input.sw::after{top:2px;left:2px;width:16px;height:16px}
.ed-switch.sm input.sw:checked::after{transform:translateX(14px)}
.ed-tfix{flex:1;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;background:var(--fill2);font-size:14px;font-weight:600;color:var(--text)}   /* 手動填：只剩當時選的交通方式 */
.seg.ed-modes .md-min{margin-left:4px}
.seg.ed-modes .seg-thumb{width:calc((100% - 6px) / var(--n, 2));transform:translateX(calc(var(--i, 0) * 100%))}   /* 交通方式的數量不固定 */
.seg.ed-modes button{display:inline-flex;align-items:center;justify-content:center;gap:4px}
.seg.ed-modes button[disabled]{opacity:.4}
.eb-st{font-weight:400;color:var(--text2)}
.eb-st.err{border:0;background:none;padding:0;font:inherit;font-weight:600;color:#C2412D;cursor:pointer}
.tl-msg{position:absolute;left:52px;right:0;top:40px;text-align:center;font-size:14px;line-height:1.7;color:var(--muted);z-index:5;pointer-events:none}
.edit-ic{display:none;position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.75);
  align-items:center;justify-content:center;font-size:13px}
.edit-ic i{display:block;line-height:1}
.blk.compact .edit-ic{top:50%;transform:translateY(-50%)}
.editing .edit-ic{display:flex}
.editing .nav{display:none}
.sub-ed{display:none;align-self:center;width:22px;height:22px;flex:none;border-radius:50%;background:var(--fill2);color:var(--text2);
  align-items:center;justify-content:center;font-size:12px}
.sub-ed i{display:block;line-height:1}
.editing .sub-ed{display:flex}
.editing .stop{cursor:pointer}
/* 拖曳 */
/* 卡片長按＝編輯，不要選取文字或跳出系統的「拷貝」選單 */
.layer .blk,.layer .grp,.cand-page .blk,.st-row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.blk,.grp,.stop{transition-property:height,top,transform,background-color}
.pressing{transform:scale(.97);transition:transform .55s ease!important}
.stop.pressing{transform:none;background:rgba(0,0,0,.04)}
.dragging{pointer-events:none;opacity:.4}   /* 卡片留在原位變半透明，虛線框標出新位置 */
.drop-target{box-shadow:inset 0 0 0 2px var(--accent-fg)}
/* 拖進展開的卡片：整張虛線框，插入的位置畫一條線 */
.drop-into{box-shadow:inset 0 0 0 2px var(--accent-fg)}
.sub-ph{display:flex;align-items:center;gap:6px;height:38px;margin:6px 0 0;padding:0 12px;border:1.5px dashed var(--accent-fg);border-radius:10px;background:rgba(154,74,37,.05);color:var(--accent-fg);font-size:13px;font-weight:600;box-sizing:border-box;pointer-events:none}   /* 等一下會加在這裡 */
.drop-into .list{background:color-mix(in srgb,var(--c-bg,var(--eat-bg)) 60%,#fff)}
.stop.ins,.add-sub.ins{box-shadow:0 -3px 0 var(--accent-fg)}
.stop.ins-after{box-shadow:0 3px 0 var(--accent-fg)}
/* 把某一站／某個選項拖出來：原本那列變淡，手指下面跟著一張小卡片；時間軸上標出會放在幾點 */
.stop.sub-dragging{opacity:.3}
.sub-ghost{position:fixed;z-index:40;pointer-events:none;background:#fff;border-radius:10px;padding:8px 12px;margin:0;
  box-shadow:0 10px 24px rgba(60,30,10,.22);opacity:.92;border:0}
.sub-ghost .nav,.sub-ghost .sub-ed{display:none}
/* 合併區塊的一站本身是 position:relative（畫連接線用），複製出來的小卡片要蓋過去，不然會掉到頁面最底下看不到 */
.stop.sub-ghost[data-kind]{position:fixed}
.sub-ghost::after{display:none}
.drop-slot{position:absolute;left:50px;right:4px;z-index:4;border-top:2px dashed var(--accent-fg);pointer-events:none}
.drop-box{position:absolute;left:4px;right:0;z-index:31;border:2px dashed var(--accent-fg);border-radius:8px;pointer-events:none;animation:dropIn .18s ease-out;
  background:color-mix(in srgb,var(--accent-fg) 6%,transparent)}
@keyframes dropIn{from{opacity:0;transform:scale(.96)}}
.drop-box span{position:absolute;left:6px;top:4px;font-size:12px;font-weight:600;color:var(--accent-fg);background:var(--bg,#fff);
  padding:1px 6px;border-radius:4px;box-shadow:0 1px 4px rgba(60,30,10,.18)}
.drop-slot span{position:absolute;left:0;top:2px;font-size:11px;font-weight:600;color:var(--accent-fg);background:var(--bg,#fff);padding:0 4px;border-radius:4px}
.drag-on .blk:not(.dragging),.drag-on .grp:not(.dragging){transition:box-shadow .12s}
.add-sub{display:none;width:100%;height:38px;margin:6px 0 4px;border:1px dashed var(--border);border-radius:10px;background:#fff;
  color:var(--text2);font-size:14px;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.editing .add-sub,html.desk-edit .add-sub{display:flex}   /* 電腦版有編輯碼：展開多個地點／多選一，最下面直接有「＋ 新增一站／選項」（10/24 拿掉編輯鈕後找不到） */
/* 可展開的卡片：右上角是展開箭頭，鉛筆改放在標題後面，兩個按鈕才不會擠在一起 */
.grp .head .t{display:flex;align-items:center;gap:4px;min-width:0}
.grp .head .edit-ic{position:static;flex:none;margin-left:4px}
.grp .chev{padding:4px;margin:-4px}
.editing .blk,.editing .grp{cursor:pointer}
.editing .cards{cursor:copy}
.clash{box-shadow:inset 0 0 0 2px #E24B4A}
.tag-ok{white-space:nowrap}
.tag-q{white-space:nowrap;opacity:.8}
.sh-pending{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--fill);font-size:13px;line-height:1.5;color:var(--text2)}
.fab{position:fixed;right:max(20px,calc(50vw - 220px));bottom:calc(24px + env(safe-area-inset-bottom));z-index:40;width:52px;height:52px;border-radius:50%;
  border:0;background:var(--accent-fg);color:#fff;font-size:24px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(60,30,10,.22);cursor:pointer}
.fab i{display:block;line-height:1}
/* 編輯模式：能動的卡片（一般、合併、多選一、交通）外框一圈淡淡的虛線，用自己類型的框線色；航班是自動產生的，不能拖，保持原樣。
   被拿起來的那張另外有深咖啡色粗虛線（.drop-box），兩種深淺分得出來 */
.editing .layer .blk:not(.flight),.editing .layer .grp{outline:1px dashed var(--c-bd,rgba(154,74,37,.35));outline-offset:-1px}
.editing .layer .blk.ride{outline-color:rgba(154,74,37,.3)}
.editing .fab.day{display:none}   /* 10/21 拿掉：編輯模式點空白處就能新增 */
/* ＋ 上方的淺色小按鈕：計算這天的交通（樣式跟頁首的編輯按鈕一樣，不搶 ＋ 的風頭） */
.fab-sub{position:fixed;right:calc(max(20px,calc(50vw - 220px)) + 7px);bottom:calc(88px + env(safe-area-inset-bottom));z-index:40;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:#fff;color:var(--accent-fg);font-size:18px;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(60,30,10,.12);cursor:pointer}
.fab-sub i{display:block;line-height:1}
.editing .fab-sub.day{display:none}   /* 10/21 拿掉「計算這天的交通」 */
.editing .toast{bottom:calc(24px + env(safe-area-inset-bottom))}   /* 編輯模式右下沒有按鈕：提示放回下面 */
/* 左右各留 16px、置中、寬度照文字長度：原本 left:50% 會讓提示最多只有半個螢幕寬，短短一句也被折成兩行 */
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(142px + env(safe-area-inset-bottom));z-index:60;transform:translateY(20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 14px;border-radius:12px;background:#2b2622;color:#fff;font-size:14px;
  transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{flex:none;white-space:nowrap;border:0;background:none;color:#F7C9A8;font-size:14px;font-weight:600;padding:4px;cursor:pointer}
/* 編輯面板 */
.ed-field{display:block;margin-top:16px}
.ed-lab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.ed-lab-hint{font-weight:400;margin-left:4px}
.au{text-align:center;padding:16px 4px 6px}
.au-hi{display:flex;align-items:center;justify-content:center;gap:6px;font-size:28px;font-weight:700;line-height:1}
.au-box{display:inline-flex;align-items:center;justify-content:center;min-width:120px;max-width:70%;transition:width .15s;height:58px;padding:0 16px;border:2px dashed var(--accent-fg);border-radius:14px;box-sizing:border-box}
.au-box #auName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.au-box.typing #auName{display:none}
.sheet .au-box input[type=text],.sheet .au-box input[type=text]:focus{width:4.5em;min-height:0;height:auto;padding:0;border:0;border-radius:0;background:none;font:inherit;font-size:28px;font-weight:700;text-align:center;outline:none}   /* 跟「安安，」一樣大 */
.sheet .au-box input::placeholder{font-size:28px;color:var(--muted)}
.au .au-chips{justify-content:center;gap:8px;margin-top:16px}   /* 跟「編輯碼」到四個格子一樣的距離（要寫 .au，不然會被 .pick-chips 的 8px 蓋掉） */
.au-chips .chip{height:40px;padding:0 20px;font-size:16px;font-weight:600;color:var(--text)}
.au-chips .chip.on{color:#fff}
.au-chips .pick-other{color:var(--text2);font-weight:500}
.au-chg{margin:12px auto 0;padding:4px;border:0;background:none;font:inherit;font-size:13px;color:var(--text2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;display:block}
.au-sep{border:0;border-top:1px solid var(--line);margin:30px -20px 24px}
.sheet.dlg.center:has(.au){padding-bottom:0}   /* 按鈕列自己有下方留白，不要再多一截 */
.sheet.dlg:has(.au) .ed-actions{margin-top:22px;padding:8px 20px 14px;border-top:0}   /* 開始編輯：拿掉上面的分隔線，按鈕貼近卡片底部 */
.au-lab{font-size:15px;font-weight:700;margin-bottom:14px}
.au-hint{margin-top:16px;font-size:13px;color:var(--text2)}
.au .err{text-align:center}
.sheet .au-x{position:absolute;top:14px;right:14px;z-index:1}
.nick-as{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:14px;color:var(--text2)}
.nick-as b{color:var(--text)}
.nick-as span{flex:1;min-width:0}
.nick-chg{flex:none;padding:4px 2px;border:0;background:none;font:inherit;font-size:14px;color:var(--accent-fg);cursor:pointer}
.ed-lab-row{display:flex;align-items:center;gap:8px}
.ed-lab-row .ed-lab{flex:1;min-width:0}
.swap-btn{flex:none;display:inline-flex;align-items:center;gap:4px;margin:-6px -6px 0 0;padding:4px 8px;border:0;border-radius:999px;background:none;color:var(--accent-fg);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.swap-btn.open,.swap-btn:active{background:var(--accent-bg)}
.ed-t-acts{display:flex;flex-wrap:wrap;gap:4px 10px;margin-left:auto}   /* 名稱下面靠右（10/27） */
.ed-t-wrap > .ed-t-swap{position:absolute;right:4px;top:50%;transform:translateY(-50%);z-index:1;display:flex;align-items:center;gap:4px;height:36px;padding:0 0 0 8px;border:0;background:none;font:inherit;cursor:pointer}
.ed-t-swap small{font-size:12px;color:var(--muted)}
.ed-t-swap i{width:34px;height:34px;border-radius:10px;font-size:20px;color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.ed-t-swap.open i{background:var(--accent-fg);color:#fff}
.ed-t-wrap:has(.ed-t-swap) > input{padding-right:118px}
.ed-t-wrap.multi > .ed-t-swap{display:none}   /* 名稱框最右邊：從備選替換（10/27）；改成多個地點時第一站右邊是 ✕ 拿掉 */
#edSwapWrap .cand-drop{margin:0 0 8px}
.map-status{margin-top:6px;font-size:13px;line-height:1.5;color:var(--text2)}
.map-status i{vertical-align:-1px}
.map-status .ok{color:#3F5E3A;font-weight:600}
.map-status a{color:var(--accent-fg)}
.sheet input[type=text],.sheet input[type=password],.sheet input[type=time],.sheet textarea{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid transparent;
  border-radius:12px;background:var(--fill);color:var(--text);font-family:inherit;-webkit-appearance:none;appearance:none}
.sheet input[type=time]{width:auto;min-width:120px}
.sheet textarea{resize:vertical;line-height:1.5}
.sheet input:focus,.sheet textarea:focus{outline:none;background:#fff;border-color:var(--accent-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--fill);font-size:14px;color:var(--text2);cursor:pointer}
.chip.on{background:var(--accent-fg);color:#fff;font-weight:600}   /* 小標籤選中：陶土橘實心白字 */
.pick-chips{margin-top:8px}
.chip.ty-add{display:inline-flex;align-items:center;gap:3px;border:1px dashed var(--border);background:none;flex:none}
.ty-form{margin-top:10px;padding:12px;border-radius:12px;background:var(--fill);animation:dropIn .16s ease}
.ty-form .ty-name{background:#fff !important}
.ty-colors{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ty-c{width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:var(--bg);color:var(--fg);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ty-c i{opacity:0}
.ty-c.on{border-color:var(--fg)}
.ty-c.on i{opacity:1}
.ty-acts{display:flex;gap:8px;margin-top:12px}
.ty-acts .btn{height:38px;font-size:14px}
.ty-acts .btn.ghost{background:#fff}
.ts-types .chip.editing{box-shadow:0 0 0 2px currentColor}
.ts-ty-form{margin-top:10px;padding:12px;border-radius:12px;background:var(--fill);animation:dropIn .16s ease}
.ts-ty-form input{background:#fff !important}
.pick-chips .pick-other{display:inline-flex;align-items:center;gap:4px;border:1px dashed var(--border);background:none}   /* 跟「＋加入新旅伴」一樣的虛線框 */
.pick-chips .pick-other.on{border-color:transparent;background:var(--accent-fg)}
.pick-chips .pick-other i{font-size:14px}
.chip.on.eat{background:var(--eat-bg);color:var(--eat-fg)}.chip.on.spa{background:var(--spa-bg);color:var(--spa-fg)}
.chip.on.cafe{background:var(--cafe-bg);color:var(--cafe-fg)}.chip.on.shop{background:var(--shop-bg);color:var(--shop-fg)}
.chip.on.bar{background:var(--bar-bg);color:var(--bar-fg)}.chip.on.see{background:var(--see-bg);color:var(--see-fg)}.chip.on.hotel{background:var(--hotel-bg);color:var(--hotel-fg)}.chip.on.other{background:var(--other-bg);color:var(--other-fg)}
.ed-row{display:flex;align-items:center;gap:12px}
.ed-to{font-size:15px;color:var(--text2)}
.ed-dur{min-width:96px;text-align:center;font-size:15px;font-weight:600}
/* 時間：一行「開始 → 結束 ｜ − 長度 +」，三個格子差不多寬、撐滿整行（長度那格稍寬，放得下「1h40m」）；結束是自動算的（灰色、不能點）。下一行長度快選 */
.ed-time{display:flex;align-items:center;gap:4px}
.sheet .ed-time input[type=time]{min-width:0;width:0;flex:1 1 0;padding:10px 4px;text-align:center}
.ed-time input[type=time]::-webkit-calendar-picker-indicator{display:none}   /* 電腦版瀏覽器的時鐘圖示會把格子撐寬；點格子一樣會跳出選擇器 */
.ed-time input[type=time]::-webkit-date-and-time-value{text-align:center}
.ed-time input.auto,.ed-time input.auto::-webkit-date-and-time-value,.ed-time input.auto::-webkit-datetime-edit{color:var(--muted)}   /* 結束時間：自動算的是灰色，自己調過才變黑 */
.ed-arrow{color:var(--muted);flex:none;font-size:14px;margin:0 6px}
.ed-endbox{flex:1 1 0;min-width:0;font-size:16px;padding:10px 4px;border:1.5px solid transparent;border-radius:12px;background:var(--fill);color:var(--muted);line-height:normal;white-space:nowrap;text-align:center;overflow:hidden}
.ed-mid{font-size:12px;color:var(--muted);margin-top:4px}
.ed-len{flex:1.2 1 0;min-width:0;display:flex;align-items:center;justify-content:space-between;margin-left:6px;height:44px}
.ed-len .step{width:26px;height:26px;flex:none;border:0;background:var(--line)}
.ed-len .ed-dur{min-width:0;font-size:14px;white-space:nowrap}
.chips.sm{flex:1;min-width:0;margin:0 0 0 4px}
.chips.sm{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.chips.sm::-webkit-scrollbar{display:none}
.chips.sm{gap:5px}
/* 備選頁：跟時間軸一樣的彩色卡片，由上往下排 */
.cand-page{padding:16px 16px 96px;touch-action:pan-y pinch-zoom}
/* ---------- 我的旅程（示意，還沒接資料） ---------- */
.trips-page{padding:16px 16px 110px}
.on-trips .tabs,.on-trips .edit-btn,.on-trips .map-btn{display:none}
.on-trips.on-new .trip-new{display:none !important}
/* 旅程卡片（10/24 照 Figma）：白邊圓角照片（沒照片才放手寫英文地名＋當地問候語）；下面建立的人的 Google 大頭照、名稱、日期 */
.trip-card{display:block;width:100%;margin:0 0 22px;padding:0;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.trip-cover{position:relative;aspect-ratio:425/276;border:5px solid #fff;border-radius:18px;background:var(--accent-bg);box-shadow:0 2px 16px rgba(0,0,0,.25);overflow:hidden;display:flex;align-items:center;justify-content:center;container-type:inline-size}
.trip-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.trip-hi{position:relative;display:flex;flex-direction:column;align-items:center;color:var(--accent-fg)}   /* 只有沒放封面照片才出現 */
.trip-hi .en{font-family:"BioRhyme","Playwrite US Trad",serif;font-weight:800;font-size:min(8.5cqw,115cqw / var(--n,6));line-height:1.2;white-space:nowrap}   /* 地名越長字越小，不超出照片；10/27 改 BioRhyme 800、字小一點，英文地名本身在封面上下正中間 */
.trip-hi .hi{position:absolute;top:100%;left:0;right:0;margin-top:1cqw;text-align:center;font-size:4.5cqw;font-weight:500;line-height:1.3}   /* 當地問候語：英文地名正下方置中，不推動地名的位置 */
.trip-badge{position:absolute;top:10px;right:10px;padding:5px 13px;border-radius:999px;background:#fff;color:#0080a7;font-size:13px;font-weight:600}
.trip-body{display:flex;align-items:center;gap:12px;padding:12px 4px 0}
.trip-who{flex:none;width:36px;height:36px;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.18);overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--fill);color:var(--text2);font-size:16px}
.trip-who img{width:100%;height:100%;object-fit:cover}
.trip-txt{display:block;flex:1;min-width:0}
.trip-name{display:block;font-size:18px;font-weight:500;line-height:1.35;color:#313131;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-meta{display:block;margin-top:1px;font-size:14px;font-weight:500;color:#919191;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-card.past .trip-cover{aspect-ratio:auto;height:76px;border-width:4px;border-radius:14px;background:var(--fill);box-shadow:0 1px 6px rgba(0,0,0,.12)}
.trip-card.past .trip-hi{margin:0;color:var(--muted)}
.trip-card.past .trip-hi .en{font-size:min(24px,120cqw / var(--n,6));line-height:1.4}
.trip-card.past .trip-hi .hi{display:none}
.trip-card.past .trip-who{width:30px;height:30px;font-size:14px}
.trip-card.past .trip-name{font-size:16px}
.trip-card.past .trip-meta{font-size:13px}
.trip-demo{margin-left:6px;font-size:11px;font-weight:400;color:var(--muted)}
.trip-new{position:fixed;right:max(20px,calc(50vw - 220px));bottom:calc(24px + env(safe-area-inset-bottom));z-index:40;height:46px;padding:0 18px 0 14px;border:0;border-radius:999px;
  background:var(--accent-fg);color:#fff;font:inherit;font-size:15px;font-weight:600;display:none;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(60,30,10,.22);cursor:pointer}
.trip-new i{font-size:20px;line-height:1}
.on-trips .trip-new{display:flex}
/* 總覽頁副標題：點了回到「我的旅程」 */
.trip-sw{display:inline-flex;align-items:center;gap:3px;max-width:100%;padding:3px 8px 3px 11px;border:0;border-radius:999px;background:var(--fill);
  font:inherit;font-size:13px;color:var(--text2);cursor:pointer;vertical-align:middle}
.trip-sw i{font-size:14px;line-height:1;color:var(--muted)}
.editing .trip-sw{pointer-events:none;opacity:.5}
.trip-sw span{min-width:0;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-members{display:flex;flex-wrap:wrap;gap:6px}
.ov-members span:not(.ov-empty){padding:4px 10px;border-radius:999px;background:var(--fill);font-size:13px;color:var(--text)}
/* 旅程設定：同行的人（建立的人每個名字後面有 ×，下面一格可以新增） */
.ts-mem span:not(.ov-empty){display:inline-flex;align-items:center;gap:2px;padding:6px 12px;font-size:14px}
.ts-mem-x{width:22px;height:22px;margin:-4px -6px -4px 2px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ts-mem-add{display:flex;gap:8px;margin-top:10px;animation:dropIn .16s ease}
.ts-mem-new{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border:1px dashed var(--border);border-radius:999px;background:none;font:inherit;font-size:14px;color:var(--text2);cursor:pointer}
.ts-mem-new i{font-size:15px}
.ts-mem-add input{flex:1;min-width:0}
.ts-mem-add .btn{flex:none;padding:0 16px}
.inv{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.inv-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:12px;background:var(--fill);font:inherit;text-align:left;color:var(--text);cursor:pointer}
.inv-btn > i:first-child{flex:none;width:24px;height:24px;color:var(--text);font-size:21px;display:flex;align-items:center;justify-content:center}
.inv-btn > span{flex:1;min-width:0}
.inv-btn b{display:block;font-size:15px}
.inv-btn small{display:block;margin-top:1px;font-size:12px;color:var(--text2)}
.inv-btn > i:last-child:not(:first-child){color:var(--muted);font-size:18px}
.ov-stays{display:flex;flex-direction:column;gap:8px}
.ov-sec-row{display:flex;align-items:baseline}
.ov-sec-act{margin-left:auto;padding:0;border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--accent-fg);cursor:pointer}
button.ov-stay{width:100%;font:inherit;text-align:left;cursor:pointer}
.ov-stay.add > i:last-child{color:var(--accent-fg)}
/* 住宿列表：左邊編號圈圈＋虛線串起第一間、第二間…，右邊卡片是照片、名稱、日期、晚數 */
.st-list{display:flex;flex-direction:column;gap:12px}
.st-item{position:relative;display:flex;align-items:center;gap:10px}
.st-item + .st-item::before{content:"";position:absolute;left:13px;bottom:50%;height:calc(100% + 12px - 28px);margin-bottom:14px;border-left:1.5px dashed var(--line)}
.st-step{flex:none;position:relative;z-index:1;width:28px;height:28px;border:1.5px solid;border-radius:50%;background:var(--page);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.st-row{flex:1;min-width:0;text-decoration:none;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border:0;border-radius:12px;background:var(--fill);font:inherit;text-align:left;color:var(--text);cursor:pointer}
.st-pic{flex:none;position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px}
.st-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.st-row > span:nth-child(2){flex:1;min-width:0}
.st-row b{display:block;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st-row small{display:block;margin-top:3px;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-row small.st-n{margin-top:1px}
.st-row > i:last-child{color:var(--muted);font-size:18px}
.st-list + .wiz-add{margin-top:6px}
.st-own{display:flex;align-items:center;gap:6px;margin:10px 0 0;padding:4px 0;border:0;background:none;font:inherit;font-size:13px;color:var(--accent-fg);cursor:pointer;text-align:left}
.st-addr + .st-own{margin-top:-6px}   /* 跟輸入框拉開一點；接在地址下面時不用再空那麼多 */
/* 旅程設定最下面：刪除旅程（只有建立的人看得到） */
.ts-cover{position:relative;height:132px;border-radius:16px;overflow:hidden;background:var(--accent-bg);touch-action:none;cursor:grab}   /* 跟「我的旅程」卡片上的封面一樣高 */
.ts-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ts-cover.moving .ph-hand{opacity:0}
.ts-cover.empty{display:flex;align-items:center;justify-content:center;background:none;border:1px dashed var(--border);cursor:pointer;touch-action:auto}
.ts-cover + .st-own{margin-top:8px}
.ts-del{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:24px;padding:12px;border:0;background:none;font:inherit;font-size:15px;color:#C2412D;cursor:pointer}
.btn.primary.danger-fill{background:#C2412D;border-color:#C2412D;color:#fff}
.btn.primary.danger-fill[disabled]{opacity:.4}
/* 我的旅程：長按選單 */
.tm-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tm-opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:12px;background:var(--fill);font:inherit;text-align:left;color:var(--text);cursor:pointer}
.tm-opt > i{flex:none;width:24px;height:24px;color:var(--text);font-size:21px;display:flex;align-items:center;justify-content:center}
.tm-opt span{flex:1;min-width:0}
.tm-opt b{display:block;font-size:15px}
.tm-opt.danger b,.tm-opt.danger > i{color:#C2412D}
.tm-opt small{display:block;margin-top:2px;font-size:12px;color:var(--text2);line-height:1.4}
.trip-card,.trip-card *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.trip-card img{pointer-events:none}   /* 長按封面不要跳出 iPhone 的圖片預覽 */
/* 住處資訊：地址一行一行，點了複製 */
.st-addrs{display:flex;flex-direction:column;gap:6px}
.st-al{display:flex;align-items:flex-start;gap:8px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:var(--fill);font:inherit;text-align:left;color:var(--text);cursor:pointer}
.st-al span{flex:1;min-width:0;font-size:15px;line-height:1.5;user-select:text;-webkit-user-select:text}
.st-al i{flex:none;color:var(--muted);font-size:17px;margin-top:3px}
.st-al-wait{font-size:12px;color:var(--muted)}
.stay-strip{display:flex;align-items:center;margin-top:12px;padding:14px 8px;border:1.5px solid transparent;border-radius:12px;background:var(--fill)}
.ss-c{flex:1;min-width:0;text-align:center}
.ss-c small{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.ss-d{display:inline-flex;align-items:center;gap:3px}
.ss-d b{font-size:21px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.ss-wd{font-size:10px;line-height:1.15;color:var(--text2);text-align:center}
.ss-none{font-size:14px!important;font-weight:500!important;color:var(--muted)!important}
.ss-arrow{flex:none;font-size:22px;color:var(--text)}
.ss-bar{flex:none;width:1px;align-self:stretch;margin:4px 4px;background:#E3E3E3}
.ss-n{flex:.8}
/* 旅程設定的日期列：整條可以點，展開／收起月曆 */
.ts-strip{position:relative;width:100%;margin-top:4px;padding:16px 8px;font:inherit;color:inherit;text-align:center;cursor:pointer}
.ts-strip.on{border-color:var(--accent-fg)}
.ts-strip .ss-d{gap:6px}
.ts-strip .ss-d b{font-size:18px}
.ts-strip .ss-n b{font-size:17px}
.ts-cal{animation:dropIn .2s ease}
.st-photo .clr-wrap{display:none}   /* 住處照片只留「上傳」，不用貼網址 */
.st-photo .ph-row{display:none}
/* 編輯住處：地址放大放明顯，點了開 Google 地圖 */
.st-addr{display:flex;align-items:center;gap:10px;margin:-2px 0 14px;padding:4px 2px;color:var(--text);text-decoration:none}
.st-addr > i:first-child{flex:none;font-size:22px;color:var(--accent-fg)}
.st-addr > span{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.4}
.st-addr small{display:block;font-size:11px;font-weight:400;color:var(--text2);margin-bottom:1px}
.st-addr > i:last-child{flex:none;color:var(--muted);font-size:18px}
.st-cal + .st-cal{margin-top:8px}
.st-cal .cal-h{justify-content:center}
.cal-d.out{color:#D5CEC5;cursor:default;display:flex;align-items:center;justify-content:center}
/* 其他住處：半透明的粗色帶蓋在數字上（像螢光筆），從入住日中間畫到退房日中間 */
.cal-bar{position:absolute;top:2px;bottom:2px;z-index:2;opacity:.22;pointer-events:none}   /* 跟選取中的範圍一樣粗 */
.cal-bar.r{left:50%;right:0}
.cal-bar.l{left:0;right:50%}
.cal-bar.r.end{left:calc(50% - 18px);border-radius:18px 0 0 18px}   /* 入住日：圓頭從數字開始 */
.cal-bar.l.end{right:calc(50% - 18px);border-radius:0 18px 18px 0}   /* 退房日：圓頭停在數字 */
.st-legend{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:12px;color:var(--text2)}
.st-legend i{display:inline-block;width:16px;height:10px;margin-right:6px;border-radius:5px;vertical-align:-1px;opacity:.3}
.ov-stay{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:12px;background:var(--fill);color:var(--text);text-decoration:none}
.ov-stay > i:first-child{flex:none;width:34px;height:34px;border-radius:50%;background:var(--other-bg);color:var(--other-fg);font-size:18px;display:flex;align-items:center;justify-content:center}
.ov-stay > span{flex:1;min-width:0}
.ov-stay b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-stay small{display:block;margin-top:1px;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-stay > i:last-child{color:var(--muted);font-size:18px}
.seg.ed-modes.m3 button{font-size:13px;gap:2px}
.ov-hero{position:relative;display:block;width:100%;margin:0 0 14px;padding:0;border:0;border-radius:16px;background:none;text-align:left;font:inherit;cursor:pointer}
.ov-hero .cover{height:160px}
.ov-hero.has .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,14,10,.55),rgba(20,14,10,0) 55%)}
.ov-hero .cover .en{margin-bottom:34px}
.ov-hero-t{position:absolute;left:16px;right:56px;bottom:12px;color:var(--accent-fg)}
.ov-hero.has .ov-hero-t{color:#fff}
.ov-hero-t b{display:block;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-hero-t span{display:block;margin-top:1px;font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.ov-hero-cam{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:16px}
.setup{margin:0 0 16px;padding:12px 14px 6px;border-radius:16px;background:var(--fill)}
.setup-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.setup-toggle{display:flex;align-items:center;gap:8px;padding:2px 0;border:0;background:none;font:inherit;color:var(--text);cursor:pointer}
.setup-toggle b{font-size:15px}
.setup-toggle span{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.setup-toggle i{font-size:16px;color:var(--muted);transition:transform .2s}
.setup:not(.fold) .setup-toggle i{transform:rotate(180deg)}
.setup-skip{margin-left:auto;padding:4px 0;border:0;background:none;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
/* 收合：列表高度動畫（grid 0fr ↔ 1fr） */
.setup-rows{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}
.setup-rows > *{min-height:0}
.setup-rows{overflow:hidden}
.setup.fold .setup-rows{grid-template-rows:0fr}
.setup.fold{padding-top:10px;padding-bottom:10px}   /* 收起來：只剩標題這一行，上下留白一樣 */
.setup.fold .setup-h{margin-bottom:0}
.setup-row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;font:inherit;text-align:left;color:var(--text);cursor:pointer}
.setup-row:first-of-type{border-top:0}
.setup-row > i:first-child{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--accent-fg);font-size:16px;display:flex;align-items:center;justify-content:center}
.setup-row > span{flex:1;min-width:0}
.setup-row b{display:block;font-size:14px}
.setup-row small{display:block;font-size:12px;color:var(--text2)}
.setup-row > i:last-child:not(:first-child){color:var(--muted)}
.setup-row.ok b{color:var(--muted);text-decoration:line-through}
.setup-row.ok > i:first-child{background:none;color:var(--spa-fg);font-size:22px}
.cv-prev{margin-top:16px;touch-action:none}
.cv-prev .cover{height:170px}
.cv-st{min-height:18px;margin-top:6px;font-size:12px;color:var(--text2)}
.cv-acts{display:flex;gap:8px;margin-top:6px}
.cv-acts:not(:has(:not([hidden]))){display:none}
.cv-prev.empty{cursor:pointer}
.cv-pick{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:center;gap:4px;font-size:13px;color:var(--accent-fg)}
.cv-acts .btn{flex:1;height:40px;font-size:14px}
.cv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cv-grid button{aspect-ratio:1;border:0;border-radius:10px;background:var(--fill2) center/cover no-repeat;cursor:pointer}
.ov-foot{margin-top:28px;padding-top:2px;border-top:1px solid var(--line)}
.sheet input.ts-time{display:block;width:100%;min-width:0;text-align:left;-webkit-appearance:none;appearance:none;box-sizing:border-box}   /* 每天幾點出門：跟其他輸入框一樣占滿 */
.ts-more{display:flex;flex-direction:column;margin-top:4px}
/* 淺色表單（旅程設定、編輯卡片，面板加 .soft）：圓角統一 12px（圓形、膠囊除外）；輸入框、日期條、月曆、選項都是淺灰底、沒有框線，正在打字的輸入框變白底加咖啡色框 */
.sheet.soft input[type=text],.sheet.soft input[type=time],.sheet.soft textarea,.sheet.soft .ts-strip,.sheet.soft .cal,.sheet.soft .wiz-opt,.sheet.soft .ts-cover,.sheet.soft .btn,.sheet.soft .ed-endbox,.sheet.soft .seg,.sheet.soft .ph-frame,.sheet.soft .cand-drop{border-radius:12px}
.sheet.soft .seg button,.sheet.soft .seg-thumb{border-radius:9px}
/* 編輯卡片最上面的卡片樣式：全圓角膠囊（10/27 使用者給的參考圖），不寫標題 */
.sheet.ed-look .ed-kind-top{margin:0 0 14px}
.sheet.ed-look .ed-kind-top .ed-field{margin:0}
.sheet.ed-look .ed-kind-top .ed-lab{display:none}
.sheet.ed-look .ed-kind-top .seg{height:44px;padding:4px;border-radius:999px;background:var(--fill2)}
.sheet.ed-look .ed-kind-top .seg-thumb{top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:999px;box-shadow:0 1px 4px rgba(60,40,20,.18)}
.sheet.ed-look .ed-kind-top .seg button{border-radius:999px;font-size:15px}
.sheet.ed-look .ed-kind-top .seg button.on{color:var(--accent-fg)}
.sheet.soft input[type=text],.sheet.soft input[type=time]{height:44px;background:var(--fill);border-color:transparent}
.sheet.soft textarea,.sheet.soft .ed-endbox{background:var(--fill);border-color:transparent}
.sheet.soft input:focus,.sheet.soft textarea:focus{background:#fff;border-color:var(--accent-fg)}
.sheet.soft .ts-strip{background:var(--fill);border-color:transparent}
.sheet.soft .ts-strip.on{border-color:var(--accent-fg)}
.sheet.soft .cal{background:var(--fill);border-color:transparent}
.sheet.soft .wiz-opt{background:var(--fill);border-color:transparent}
.sheet.soft .wiz-opt.on{border-color:var(--accent-fg)}   /* 上面那條比 .wiz-opt.on 優先，選中的框線要再寫一次 */
.sheet.soft .wiz-opt > i{width:auto;height:auto;background:none;font-size:20px}   /* 交通方式的圖示不要圓圈 */
.sheet.soft .ts-mem-add .btn{background:var(--fill);border-color:transparent}
.sheet.soft .ts-mem span:not(.ov-empty){background:var(--fill)}   /* 同行的人名字：跟輸入框同一個淺灰 */
.ts-more .inv-btn.trip-set{margin-top:0}
/* 修改紀錄 */
.hs-list{display:flex;flex-direction:column}
.hs-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hs-row:first-child{border-top:0}
.hs-main{flex:1;min-width:0}
.hs-main b{display:block;font-size:14px;font-weight:600}
.hs-main small{display:block;margin-top:1px;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs-time{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hs-row .btn{flex:none;height:34px;padding:0 14px;font-size:13px}
.inv-btn.trip-set{margin-top:12px;background:none;padding-left:0;padding-right:4px}   /* 沒有外框：跟上面的內容對齊左邊 */
.inv-btn.trip-set > i:first-child{color:var(--text)}
/* 分享編輯碼：大卡片，數字一格一格；下面兩顆並排的按鈕 */
.inv-code{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 16px 26px;border-radius:20px;background:var(--fill);text-align:center}
.inv-code > span{font-size:14px;font-weight:600;color:var(--text2)}
.inv-digits{display:flex;gap:10px}
.inv-digits b{width:46px;height:54px;border-radius:12px;background:var(--fill2);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--accent-fg);font-variant-numeric:tabular-nums}
.inv-code small{font-size:13px;font-weight:500;color:var(--text2)}
.inv-pair{display:flex;gap:8px}
.inv-tile{flex:1;min-width:0;height:64px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:18px;background:var(--fill);font:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer}   /* 字跟上面「分享編輯碼」一樣大 */
.inv-tile i{font-size:18px}
.inv-tile:active{background:var(--fill2)}
/* 編輯碼四格輸入：透明輸入框蓋在四個格子上 */
.code-boxes{position:relative;display:flex;justify-content:center;gap:10px;margin-top:2px}
.code-boxes i{width:52px;height:58px;border-radius:12px;background:var(--fill);border:1.5px solid transparent;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:28px;font-weight:700;color:var(--accent-fg);font-variant-numeric:tabular-nums}
.code-boxes i.cur{border-color:var(--accent-fg);background:#fff}
.sheet .code-boxes input.code-input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:transparent;color:transparent;caret-color:transparent;font-size:16px;opacity:.01;outline:none}
.share-text{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--fill);font-size:14px;line-height:1.6;color:var(--text);word-break:break-all;-webkit-user-select:text;user-select:text}
.inv-reset{align-self:center;margin-top:2px;padding:6px;border:0;background:none;font:inherit;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer}
.trips-empty{padding:60px 16px;text-align:center;font-size:14px;color:var(--text2);line-height:1.7}
.trips-empty small{display:block;margin-top:14px;font-size:12px;color:var(--muted)}
.trips-carry{margin-top:22px;text-align:center}
/* Google 登入：入口在「我的旅程」左上角的頭像（沒登入是灰色的頭）、第一次建立旅程時問一次 */
/* 登入後：我的旅程左上角放頭像，點了往下展開帳號選單（名字、信箱、登出） */
.acct-btn{position:absolute;left:10px;top:calc(18px + env(safe-area-inset-top));width:38px;height:38px;padding:0;border:0;border-radius:50%;background:none;color:var(--text2);font-size:24px;display:none;align-items:center;justify-content:center;cursor:pointer}   /* 漢堡：標題左邊 */
html:not(.on-new) .acct-btn:not([hidden]){display:flex}   /* 我的旅程、旅程裡都在標題列左邊 */
html:not(.on-new) .editing .acct-btn,html.tut .acct-btn{display:none}
.acct-btn img{width:100%;height:100%;object-fit:cover}
.am-set{margin-top:4px;border-top:1px solid var(--line);border-radius:0 0 10px 10px}   /* 旅程設定：跟上面帳號的東西隔開 */
.acct-menu{position:absolute;left:12px;top:calc(60px + env(safe-area-inset-top));z-index:20;min-width:240px;max-width:calc(100% - 24px);padding:6px;border-radius:14px;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.04);animation:dropIn .16s ease}
.acct-menu[hidden]{display:none}
.am-priv{display:block;padding:8px 10px 4px;font-size:11px;color:var(--muted);text-decoration:none}
.am-priv:active{color:var(--text2)}
.am-login{margin-bottom:4px;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;padding-bottom:12px}
.am-who{display:flex;align-items:center;gap:10px;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.am-who .acct-pic{width:36px;height:36px}
.am-who b{display:block;font-size:14px}
.am-who small{display:block;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am-who > span:last-child{min-width:0}
.am-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;border-radius:10px;background:none;font:inherit;font-size:14px;color:var(--text);text-align:left;cursor:pointer}
.am-item i{font-size:18px}
.am-scale{cursor:default}.am-scale:active{background:none}
.am-seg{display:flex;margin-left:auto;padding:2px;border-radius:8px;background:var(--fill)}
.am-seg button{padding:4px 10px;border:0;border-radius:6px;background:none;font:inherit;font-size:13px;color:var(--text2);cursor:pointer}
.am-seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
a.am-item{text-decoration:none;box-sizing:border-box}
.am-item:active{background:var(--fill)}
.am-val{margin-left:auto;color:var(--text2);max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am-item .am-go{font-size:16px;color:var(--muted);margin-left:-4px}
.acct-pic{flex:none;width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--other-bg);color:var(--text2);display:flex;align-items:center;justify-content:center}
.acct-pic img{width:100%;height:100%;object-fit:cover}
.g-btn{display:flex;justify-content:center;min-height:44px;align-items:center;margin-top:18px}
.g-note{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.g-note a{color:var(--text2)}
.sheet.center .sh-head{text-align:center}
.sheet.dlg.center{padding:28px 20px 26px}   /* 沒有底部按鈕列：上下多留一點 */
.sheet.center .g-btn{margin-top:24px}
.sheet.center .g-note{margin-top:18px}
.g-note a{white-space:nowrap}
.sheet.center .sh-head > div{padding-left:40px}   /* 右邊有關閉鈕，左邊空一樣寬，標題才會在正中間 */
.line-out{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.line-out .btn.primary{flex:none;height:48px;background:#2F2C29;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;max-width:280px;text-decoration:none;box-sizing:border-box}
.g-skip{display:block;margin:10px auto 0;padding:6px 4px;border:0;background:none;font:inherit;font-size:13px;color:var(--text2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.trips-carry button{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1px solid var(--border);border-radius:999px;background:#fff;font:inherit;font-size:14px;color:var(--text);cursor:pointer}
.trips-carry small{display:block;margin:8px auto 0;max-width:280px;font-size:12px;line-height:1.5;color:var(--muted)}
.trips-empty .en{font-family:"BioRhyme","Isometra",serif;font-weight:800;font-size:30px;color:var(--accent-fg);margin-bottom:8px}
/* 還沒有旅程：一張虛線大卡片（點了建立旅程），右下角手寫風的箭頭提示 */
.trips-empty:has(.te-card){padding:0}
.te-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:201px;padding:0 16px;border:1.5px dashed #9a948d;border-radius:16px;background:var(--fill);box-shadow:0 6px 18px rgba(60,40,20,.08);font:inherit;color:var(--accent-fg);cursor:pointer}
.te-en{font-family:"Instrument Serif",serif;font-style:italic;font-size:32px;line-height:1.1;margin-bottom:2px}
.te-card b{font-size:20px;font-weight:600}
.te-login{margin-top:8px;font-size:13px;color:var(--text2);text-decoration:underline;text-underline-offset:3px}
.te-note{position:relative;width:200px;margin:14px 0 0 auto;padding-top:62px;transform:translateX(-14px)}
.te-note svg{position:absolute;left:10px;top:0;width:36px;height:56px;color:var(--text)}
.te-note span{display:block;transform:rotate(-12deg);font-size:14px;font-weight:600;line-height:1.5;color:var(--accent-fg)}
body.trips-none .trip-new{display:none !important}
/* 操作教學：外層全螢幕 iframe；裡面的練習畫面加上提示框和手指動畫 */
.tin{text-align:center;padding:8px 4px 0}
.tin-ill{position:relative;width:150px;height:118px;margin:4px auto 14px}
.tin-c{position:absolute;left:12px;right:12px;height:30px;border-radius:9px}
.tin-c.a{top:6px;background:var(--eat-bg)}
.tin-c.b{top:44px;background:var(--cafe-bg);box-shadow:0 4px 12px rgba(60,40,20,.14);animation:tinCard 2.8s ease-in-out infinite}
.tin-c.c{top:82px;background:var(--spa-bg)}
.tin-hand{position:absolute;left:80px;top:56px;width:36px;height:40px;color:var(--text);animation:tinHand 2.8s ease-in-out infinite}
@keyframes tinCard{0%,25%{transform:none}55%,80%{transform:translateY(22px) scale(1.03)}100%{transform:none}}
@keyframes tinHand{0%{transform:translate(12px,14px)}15%,25%{transform:none}55%,80%{transform:translateY(22px)}100%{transform:translate(12px,14px)}}
.tin-t{font-size:24px;font-weight:700;line-height:1.3;color:var(--text)}
.tin p{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--text2)}
.sheet.dlg:has(.tin) .ed-actions{margin-top:20px;border-top:0;padding-top:0}
.tin-skip{display:block;margin:2px auto 4px;padding:8px;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
@media (prefers-reduced-motion:reduce){.tin-c.b,.tin-hand{animation:none}}
html.tut #mapBtn,html.tut #acctBtn,html.tut #routeFab,html.tut .sync{visibility:hidden}
.android .editing .layer [data-id]{touch-action:none}   /* 安卓編輯模式：卡片上不讓瀏覽器自己捲（不然長按拖曳攔不住），上下滑改由網站自己捲（dragPan） */
.fe-legs{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.fe-leg{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--text);text-align:left;cursor:pointer}
.fe-leg.on{border-color:var(--accent-fg);background:var(--accent-bg)}
.fe-leg i{font-size:20px;color:var(--muted)}.fe-leg.on i{color:var(--accent-fg)}
.fe-leg b{display:block;font-size:15px}.fe-leg small{display:block;font-size:12px;color:var(--text2)}
.fe-legs-hint{font-size:12px;color:var(--muted)}
.cand-redo{display:flex;align-items:center;gap:8px;width:100%;margin:-4px 0 12px;padding:10px 14px;border:0;border-radius:12px;background:var(--fill);font:inherit;font-size:14px;color:var(--text2);text-align:left;cursor:pointer}
.cand-redo span{flex:1}.cand-redo b{color:var(--accent-fg);font-weight:700}
.dbg-touch{position:fixed;left:6px;bottom:6px;z-index:9999;max-width:calc(100% - 12px);padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.8);color:#7CFC7C;font:10px/1.35 ui-monospace,Menlo,monospace;white-space:pre-wrap;pointer-events:none}   /* 觸控偵錯（debug=touch） */
.tut-ui{position:fixed;inset:0;z-index:70;pointer-events:none}
.tut-box{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));max-width:456px;height:188px;display:flex;flex-direction:column;margin:0 auto;padding:16px 20px 0;border-radius:22px;background:#fff;
  box-shadow:0 6px 24px rgba(60,40,20,.18),0 0 0 1px var(--line);pointer-events:auto;transition:top .2s,bottom .2s}
html.tut header{position:relative;padding-top:calc(210px + env(safe-area-inset-top))}   /* 不黏在上面：往下捲時讓出畫面給卡片 */
html.tut .sheet:not(.dlg){max-height:calc(100vh - 214px - env(safe-area-inset-top))}   /* 面板不要蓋到提示框 */   /* 提示框固定在最上面，標題列往下讓出位置 */
.tut-top{display:flex;align-items:center;gap:12px}
.tut-dots{display:flex;align-items:center;gap:5px;flex:1}
.tut-dots i{flex:1;height:5px;border-radius:3px;background:var(--fill2);transition:flex-grow .3s,background .3s}
.tut-dots i.on{flex-grow:2.6;background:var(--accent-fg)}
.tut-dots i.ok{background:#D9B8A6}
.tut-dots small{flex:none;margin-left:8px;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.tut-skip{padding:4px 0;border:0;background:none;font:inherit;font-size:13px;color:var(--text2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tut-txt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 0;text-align:center;text-wrap:balance;font-size:17px;font-weight:600;line-height:1.5;color:var(--text)}   /* 置中在進度列下面到框底的空間 */
.tut-txt > span,.tut-txt > div{display:block}
.tut-nav{display:flex;justify-content:space-between;margin:0 -8px;padding:0 0 12px}
.tut-nav button{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 12px 0 8px;border:0;border-radius:999px;background:var(--fill);font:inherit;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer}
.tut-nav .tut-next{padding:0 8px 0 12px}
.tut-nav button:disabled{opacity:.35;cursor:default}
.tut-oki{font-size:28px;font-weight:400;line-height:1}
.tut-box.ok .tut-txt{color:var(--spa-fg)}
.tut-warn{color:#B4532A}
.tut-box.ok{animation:tutPop .3s ease}
.tut-ui.done .tut-box{height:auto;padding-bottom:16px}
@keyframes tutPop{40%{transform:scale(1.03)}}
.tut-win{text-align:center;padding:6px 2px 2px}
.tut-win > i{font-size:40px;color:var(--spa-fg)}
.tut-win > b{display:block;margin:2px 0 8px;font-size:20px}
.tut-win ul{margin:0 0 14px;padding:0;list-style:none;text-align:left;font-size:14px;color:var(--text2);line-height:1.6}
.tut-win li{padding:6px 0;border-top:1px solid var(--line)}
.tut-win li b{color:var(--text)}
.tut-win .btn{width:100%}
.tut-ui.done{background:rgba(20,20,18,.35);pointer-events:auto}
.tut-ui.done .tut-box{top:50%;transform:translateY(-50%)}
.tut-hand{position:fixed;width:0;height:0}
/* 拖曳示範：跟真的拖曳一樣只有虛線框，跟著手指移到目的地 */
.tut-ui .tut-ghost{position:fixed;box-sizing:border-box;border:2px dashed var(--accent-fg);border-radius:8px;opacity:0;pointer-events:none;animation:tutGhost 3s ease-in-out infinite}
.tut-ghost .tut-tag{position:absolute;right:8px;top:-12px;padding:2px 9px;border-radius:999px;background:var(--accent-fg);color:#fff;font-size:12px;font-weight:700;opacity:0;animation:tutTag 3s ease-in-out infinite}
@keyframes tutGhost{0%,15%{opacity:0;transform:none}22%,35%{opacity:1;transform:none}75%,85%{opacity:1;transform:translate(var(--dx),var(--dy))}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes tutTag{0%,60%{opacity:0}72%,88%{opacity:1}100%{opacity:0}}
.hand-svg{display:block;width:100%;height:100%;overflow:visible}
.tut-hand .hand-svg{position:absolute;left:-5px;top:-3px;width:34px;height:37px;color:#2b2622}
.tut-ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:3px solid var(--accent-fg);opacity:0}
.tut-hand.g-tap{animation:tutTap 1.6s ease-in-out infinite}
.tut-hand.g-tap .tut-ring{animation:tutTapRing 1.6s ease-out infinite}
@keyframes tutTap{0%,100%{transform:translate(7px,9px)}30%,55%{transform:translate(0,0)}}   /* 小按鈕也看得出是點在哪裡：只稍微抬起，停久一點 */
@keyframes tutTapRing{0%,30%{opacity:0;transform:scale(.4)}36%{opacity:.9;transform:scale(.6)}75%,100%{opacity:0;transform:scale(1.4)}}
.tut-hand.g-press{animation:tutPress 2.4s ease-in-out infinite}
.tut-hand.g-press .tut-ring{animation:tutPressRing 2.4s linear infinite}
@keyframes tutPress{0%,100%{transform:translate(14px,18px)}15%,75%{transform:translate(0,0)}}
@keyframes tutPressRing{0%,15%{opacity:0;transform:scale(.5)}20%{opacity:.9;transform:scale(.5)}70%{opacity:.9;transform:scale(1.25)}80%,100%{opacity:0;transform:scale(1.25)}}
.tut-hand.g-drag{animation:tutDrag 3s ease-in-out infinite}
.tut-hand.g-drag .tut-ring{animation:tutDragRing 3s linear infinite}
@keyframes tutDrag{0%{transform:translate(14px,18px);opacity:0}8%{opacity:1}15%,35%{transform:translate(0,0);opacity:1}75%,85%{transform:translate(var(--dx),var(--dy));opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes tutDragRing{0%,15%{opacity:0;transform:scale(.5)}20%,35%{opacity:.9;transform:scale(.9)}75%{opacity:.9;transform:scale(.9)}85%,100%{opacity:0;transform:scale(1.3)}}
.tut-hand.g-swipe{animation:tutSwipe 2.2s ease-in-out infinite}
.tut-hand .tut-arrow{position:absolute;left:-40px;top:-16px;font-size:32px;line-height:1;color:var(--accent-fg);opacity:0;display:none}   /* 指尖（手的原點）旁邊、同一個高度：往左滑在指尖左邊 */
.tut-hand.to-right .tut-arrow{left:10px}
.tut-hand.g-swipe .tut-ring{display:none}
.tut-hand.g-swipe .tut-arrow{display:block;animation:tutSwipeArrow 2.2s linear infinite}
@keyframes tutSwipeArrow{0%,20%{opacity:0}28%,62%{opacity:1}76%,100%{opacity:0}}
@keyframes tutSwipe{0%{transform:translate(30px,18px);opacity:0}10%{opacity:1}20%{transform:translate(0,0)}65%,75%{transform:translate(var(--dx),var(--dy));opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes tutSwipeRing{0%,18%{opacity:0;transform:scale(.6)}22%,65%{opacity:.9;transform:scale(.8)}80%,100%{opacity:0;transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.tut-ui .tut-ghost,.tut-ghost .tut-tag{animation:none;opacity:0}.tut-hand{animation:none !important}.tut-hand .tut-ring,.tut-hand .tut-arrow{animation:none !important;opacity:.9}}
/* ---------- 建立旅程（示意） ---------- */
.wiz{padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.wiz-prog{display:flex;gap:4px;margin:0 0 4px}
.wiz-prog span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wiz-prog span.on{background:var(--accent-fg)}
.wiz-h{margin:18px 0 2px;font-size:20px;font-weight:700}
.wiz-p{margin:0;font-size:14px;color:var(--text2);line-height:1.5}
.wiz input[type=text]{display:block;width:100%;min-height:44px;font-size:16px;padding:10px 12px;border:1.5px solid transparent;
  border-radius:12px;background:var(--fill);color:var(--text);font-family:inherit;-webkit-appearance:none;appearance:none;text-align:left}
.wiz input:focus{outline:none;background:#fff;border-color:var(--accent-fg)}
/* 日期：自己畫的月曆，第一下點出發、第二下點回程（iPhone 內建的日期選擇器一點開就會自動填今天） */
.cal{margin-top:2px;padding:10px 10px 6px;border:0;border-radius:12px;background:var(--fill)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h b{font-size:15px;font-variant-numeric:tabular-nums}
.cal-h button{width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-h button:disabled{opacity:.3}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal-w{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 4px}
.cal-d{position:relative;height:40px;border:0;background:none;padding:0;font:inherit;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;cursor:pointer}
.cal-d span{position:relative;z-index:1;display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center}
.cal-d.past{color:var(--muted)}
.cal-d.today span{box-shadow:inset 0 0 0 1px var(--border)}
.cal-d.in::before,.cal-d.s.has-e::before,.cal-d.e::before{content:"";position:absolute;top:2px;bottom:2px;left:0;right:0;background:rgba(154,74,37,.12)}   /* 範圍：陶土橘淡一點（灰底上淡橘底會髒）*/
.cal-d.s.has-e::before{left:50%}
.cal-d.e::before{right:50%}
.cal-d.s span,.cal-d.e span{background:var(--accent-fg);color:#fff;font-weight:600;box-shadow:none}
.wiz-note{margin-top:10px;font-size:13px;color:var(--text2);line-height:1.5}
.wiz-note.err{color:#C2412D}
.wiz-stay{margin-top:16px;padding:14px;border-radius:14px;background:var(--fill)}
.wiz-stay .ed-field:first-child{margin-top:0}
.wiz-stay-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px}
.wiz-stay-h button{border:0;background:none;color:var(--muted);font-size:18px;padding:0;cursor:pointer}
.chips.nights{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips.nights::-webkit-scrollbar{display:none}
.chips.nights .chip{flex:none;height:32px;padding:0 12px;font-size:13px;font-variant-numeric:tabular-nums}
.ov-stay-add{width:fit-content;margin-left:auto}
.ov-add-full{width:100%;height:40px;margin-top:10px;border:0;border-radius:12px;background:var(--fill);color:var(--accent-fg);font:inherit;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}   /* 跟時間線的「＋ 加入行程」一樣 */
/* 機票：去程、回程上下並排。起飛、抵達時間最大，下面機場代碼＋航廈；中間虛線上的小飛機照時間往前移（飛行中） */
.fl-group + .fl-group{margin-top:16px}
/* 時間線上的航班卡片：陶土橘底、白字（網站主色，一天裡最醒目），重點用淡橘；從機票自動產生，不能拖 */
.blk.flight{--fl:#6C5043;--fl-ink:#313131;--fl-air:var(--accent-fg);--fl-bg:#EEEDEA;--fl-on:#EEEDEA;background:none;box-shadow:none;padding:0;overflow:hidden;border-radius:8px;cursor:pointer}   /* 航班：一整張，上下暖灰、中間咖啡色配淺色字（Figma node 108-846 最後版）；飛行段上下是粗的格子虛線（賽車格），右下角 HELLO＋目的地英文 */
.fb-seg{position:absolute;left:0;right:0;padding:8px 12px 8px 34px;box-sizing:border-box;overflow:hidden}
.fb-seg.wait,.fb-seg.land{background:var(--fl-bg);color:var(--fl-ink)}
.fb-seg.air{background:var(--fl-air);color:var(--fl-on)}
.fb-seg.air::before,.fb-seg.air::after{content:"";position:absolute;left:34px;right:0;height:4px;background:repeating-linear-gradient(to right,var(--fl-bg) 0 5px,transparent 5px 9px)}   /* 飛行段上下兩條粗的格子虛線（賽車格），跟上下灰色同色 */   /* 飛行那段上下兩條細線 */
.fb-seg.air::before{top:0}.fb-seg.air::after{bottom:0}
.fb-seg.land{padding-top:7px}   /* 入境那段的字靠上（Figma） */
.fb-t{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:600;line-height:22px;white-space:nowrap}   /* 大項標題跟其他卡片的名稱一樣大 */
.fb-t .ti{font-size:16px;flex:none}
.fb-l{margin-top:2px;font-size:13.5px;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-pill{flex:none;display:inline-block;margin-left:4px;padding:0 8px;border-radius:999px;background:#fff;color:var(--fl);font-size:12px;font-weight:600;line-height:20px;white-space:nowrap}
.fb-tz{font-size:11.5px;font-weight:500;opacity:.75}
.fb-bc{margin-top:5px;color:var(--fl);font-weight:500}   /* 提前、預估、預計：方形白底標籤，放在說明下面 */
.fb-r.mid .fb-bc{margin:0}   /* 提前、預估：跟一般卡片下面那排時間標籤一樣的方形白底標籤 */
.fb-r{position:absolute;left:12px;right:12px;font-size:15px;font-weight:600;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-r b{font-weight:600}
.fb-r.top{top:8px;padding-left:22px}
.fb-r.bot{bottom:8px;padding-left:22px}
.fb-r.mid{top:50%;transform:translateY(-50%);z-index:3;display:flex;align-items:center;gap:8px;padding-left:0}
.fb-plane{position:relative;z-index:2;flex:none;width:19px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--fl-air);color:var(--fl-on)}   /* 放在虛線上、把後面那一段虛線蓋掉 */
.fb-plane svg{width:17px;height:17px;transform:rotate(45deg)}
.fb-r .fb-dot{left:4px;top:5.5px}
.fb-tags{position:absolute;right:12px;top:10px;text-align:right;font-size:13.5px;font-weight:500;line-height:1.3;letter-spacing:.3px}   /* 航班號、TPE → NGO：靠右兩行，跟右下角 HELLO NAGOYA 同樣排法 */   /* 航班號、TPE → NGO：靠右純文字 */
.fb-rail{position:absolute;left:20.5px;top:15px;width:2px;background:repeating-linear-gradient(to bottom,var(--fl) 0 2px,transparent 2px 5px);z-index:1;pointer-events:none}   /* 虛線用漸層畫（iPhone 上細的 dotted 邊框常常不見） */
.fb-dot{position:absolute;width:11px;height:11px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--fl);background:var(--fl-bg);z-index:2}
.fb-dot.first{left:16px;top:13px}
.fb-dot.end{left:16px;bottom:9px}
.fb-seg.air .fb-dot{border-color:var(--fl-on);background:var(--fl-air)}
.fb-hello{position:absolute;right:12px;bottom:10px;text-align:right;font-size:13.5px;font-weight:500;line-height:1.3;letter-spacing:.3px}   /* HELLO＋目的地英文 */
.fb-rail.in{top:0;bottom:0;background:repeating-linear-gradient(to bottom,var(--fl-on) 0 2px,transparent 2px 5px)}   /* 深色那段裡的虛線是白色 */
.fb-seg.air .fb-r .fb-dot{left:4px}
.fb-st{font-size:11px;font-weight:600;padding:0 6px;border-radius:999px;background:#FFE2CC;color:var(--accent-fg)}
.fb-st.bad{background:#fff;color:#C2412D}
/* 交通卡片：白底細框＋站點直線（跟一般卡片的色塊分開，一看就知道是移動） */
.blk.ride{--rd-bg:#FBEFEF;display:flex;flex-direction:column;box-sizing:border-box;background:var(--rd-bg);border:0;color:var(--text);padding:5px 10px 6px;cursor:pointer}   /* 淺粉紅底、沒有外框（比酒吧卡片的粉紅更淡，分得出來） */
.rd-h{display:flex;align-items:center;gap:5px;min-width:0;padding-right:24px;font-size:15px;font-weight:600;line-height:22px;color:var(--accent-fg)}   /* 跟其他卡片名稱一樣大 */
.rd-h .ti{flex:none;font-size:16px}
.rd-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-x{flex:none;font-size:12px;font-weight:500;color:var(--text2)}
.rd-rail{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;margin-top:4px}
.rd-rail::before{content:"";position:absolute;left:10.5px;top:8px;bottom:10px;width:2px;background:repeating-linear-gradient(to bottom,var(--accent-fg) 0 2px,transparent 2px 5px)}   /* 線（虛線）、圓點的位置和粗細跟航班卡片一樣 */
.rd-leg{position:relative;padding-left:24px;font-size:13px;line-height:18px}
.rd-rail.at{display:block}   /* 圓點對準時間：每一段用 top 放 */
.rd-rail.at::before{content:none}
.rd-rail.at .rd-leg{position:absolute;left:0;right:0}
.rd-line{position:absolute;left:10.5px;width:2px;background:repeating-linear-gradient(to bottom,var(--accent-fg) 0 2px,transparent 2px 5px)}
.rd-leg::before{content:"";position:absolute;left:6px;top:3.5px;width:11px;height:11px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--accent-fg);background:var(--rd-bg)}
.rd-leg.end::before{background:var(--accent-fg)}
.rd-l,.rd-d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-l b{font-weight:600}
.rd-ov{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;background:#FBE9DD;color:#9A4A25;font-size:11px;font-weight:600;line-height:16px;vertical-align:1px}   /* 跟起點、終點卡片重疊的分鐘數 */
.rd-d{font-size:12px;color:var(--text2)}
.rd-sum{margin-top:2px;font-size:12px;line-height:18px;color:var(--text2);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1}
.blk.ride .edit-ic{background:var(--fill)}
.bk-home{font-size:.95em;margin-right:4px;vertical-align:-1px}   /* 回住處休息的房子圖示 */
.blk.ride .chev{flex:none;margin-left:auto;font-size:15px;color:var(--muted)}
.editing .blk.ride .chev{display:none}
.rd-more{display:none;position:relative;margin-top:4px}
.rd-more::before{content:"";position:absolute;left:10.5px;top:8px;bottom:10px;width:2px;background:repeating-linear-gradient(to bottom,var(--accent-fg) 0 2px,transparent 2px 5px)}
.rd-more .rd-leg + .rd-leg{margin-top:8px}
.blk.ride.open .rd-more{display:block}
.blk.ride.open .rd-rail,.blk.ride.open .rd-sum{display:none}
.seg.n4 .seg-thumb{width:calc((100% - 6px) / 4)}
.seg[data-i="3"] .seg-thumb{transform:translateX(300%)}
/* 交通卡片的編輯面板：起始點一格、每一段轉乘左邊時間右邊車次，圓點用虛線串起來 */
.rd-ends{position:relative;border-radius:12px;background:var(--fill);padding:4px 0}
.rd-ends::before{content:"";position:absolute;left:19px;top:30px;bottom:30px;border-left:2px dotted var(--accent-fg)}
.rd-end{position:relative;display:flex;align-items:center;gap:12px;height:48px;padding:0 14px}
.rd-end + .rd-end::before{content:"";position:absolute;top:0;left:38px;right:0;border-top:1px solid var(--border)}   /* 起點、終點中間的分隔線：從文字開頭拉到右邊 */
.sheet.soft .rd-end input,.sheet.soft .rd-end input:focus{flex:1;min-width:0;height:44px;padding:0;border:0;background:none;font-size:17px;outline:none}   /* 打字中也不要框（底是灰的，看得出在哪一格）*/
.rd-ok{flex:none;margin-right:-6px;font-size:18px;color:var(--spa-fg)}   /* 連到前後卡片：名字前面綠色勾勾（跟其他已連結地點一樣），後面的 × 取消連結 */
.rd-unlink[hidden]{display:none}
.rd-ends{padding-right:44px}

.af-drop .cp-filter{flex:none}
.af-drop .cand-empty{padding:24px 12px;text-align:center;font-size:13px;color:var(--muted)}
.af-plain[hidden]{display:none}
.af-plain{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border:0;border-radius:12px;background:var(--fill);font:inherit;text-align:left;color:var(--text);cursor:pointer}
.af-plain > i{flex:none;width:24px;height:24px;color:var(--text);font-size:21px;display:flex;align-items:center;justify-content:center}
.af-plain small{display:block;font-size:12px;color:var(--text2)}
.af-cands{display:flex;flex-wrap:wrap;gap:6px}
.af-panel{margin-top:10px}
.af-cands .chip{height:32px;padding:0 12px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.af-card{margin-top:14px;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff}
.af-mapwrap{position:relative}
/* 加入地點的大地圖：四邊淡出到白色 */
.af-slot{height:280px;margin:12px -6px 0}
.af-bigmap{position:absolute;z-index:1;height:280px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(to right,transparent 0,#000 10%,#000 90%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(to right,transparent 0,#000 10%,#000 90%,transparent 100%);mask-composite:intersect}
.af-map2{position:absolute;inset:-40px -28px;background:#F6F1EA}   /* 地圖比看得到的框大一圈：四邊淡出蓋掉的是地圖外圍，中心不變 */
.af-map2.nomap::after{content:"地圖載入不了";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}

.af-maphint{margin-top:10px;text-align:center;font-size:12px;color:var(--muted)}
/* 加入地點地圖上這天的行程：圓點對準位置，白底圓角包住點和店名 */
.af-tag{position:absolute;transform:translate(-13px,-50%);display:flex;align-items:center;gap:5px;max-width:150px;padding:4px 9px 4px 8px;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(60,40,20,.2);font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;pointer-events:none}
.af-tag span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.af-tag i{flex:none;width:9px;height:9px;border-radius:50%}
.af-me{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#2F7BF5;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,245,.18),0 1px 3px rgba(0,0,0,.3);pointer-events:none}
.af-map{position:relative;height:170px;background:var(--fill2)}
.af-map.nomap::after{content:"地圖載入不了，位置以 Google 的資料為準";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.af-pin{position:absolute;transform:translate(-50%,-100%);font-size:34px;line-height:1;color:var(--accent-fg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));pointer-events:none}
.af-recenter{position:absolute;right:10px;bottom:10px;z-index:2;width:36px;height:36px;border:0;border-radius:50%;background:#fff;color:var(--accent-fg);font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
.af-recenter[hidden]{display:none}
.af-info{padding:12px 14px 4px}
.af-info b{font-size:16px}
.af-rate{margin-left:8px;font-size:13px;color:#B7791F}
.af-info small{display:block;margin-top:2px;font-size:13px;color:var(--text2);line-height:1.45}
.af-acts{display:flex;gap:8px;padding:10px 14px 14px}
.af-acts .btn{flex:1;height:42px;font-size:15px}
.af-time{margin-bottom:8px}
.ps-list{position:absolute;left:0;right:0;top:100%;z-index:30;margin-top:4px;padding:4px;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(60,40,20,.14)}
.ps-list[hidden]{display:none}
.ps-list button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;font:inherit;text-align:left;color:var(--text);cursor:pointer}
.ps-list button:active,.ps-list button:hover{background:var(--fill)}
.ps-list i{flex:none;color:var(--muted);font-size:17px}
.ps-list span{min-width:0}
.ps-list b{display:block;font-size:15px;font-weight:600}
.ps-list small{display:block;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-lab-hint .ti-map-pin-check{color:var(--spa-fg)}
.cover{position:relative;display:flex;align-items:center;justify-content:center;height:150px;border-radius:16px;overflow:hidden;background:var(--accent-bg)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .en{font-family:"BioRhyme","Isometra",serif;font-weight:800;font-size:34px;color:var(--accent-fg);padding:0 16px;text-align:center;line-height:1.1}
.wiz-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:480px;margin:0 auto;display:none;gap:8px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--page);border-top:1px solid var(--line)}
.on-new .wiz-bar{display:flex}
.wiz-bar .btn.ghost{min-width:96px}
.cand-page .blk{position:relative;left:auto;right:auto;margin-bottom:8px;padding-bottom:8px}
.cand-page .blk .d{-webkit-line-clamp:2}
.cand-import{width:100%;margin-bottom:12px;padding:22px 12px;border:0;border-radius:12px;background:#FAF7F3;color:var(--accent-fg);font:inherit;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}   /* 跟時間線空的時候「＋ 加入第一個行程」一樣 */
.cand-import i{font-size:22px}
.cand-import small{font-size:12px;font-weight:400;color:var(--text2)}
.cand-bar{display:flex;align-items:center;margin-bottom:12px}
.cand-chips{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.cand-chips::-webkit-scrollbar{display:none}
/* 跟天數列一樣：還能往左／往右滑時，該側邊緣淡出 */
.cand-chips{--fl:0px;--fr:0px;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);
          mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
.cand-chips.fade-l{--fl:24px}
.cand-chips.fade-r{--fr:24px}
.chips.sm.cand-filter{flex-wrap:nowrap;width:max-content;margin:0}
.chips.sm.cand-filter .chip,.cand-sortbtn{box-sizing:border-box;height:26px;line-height:1;-webkit-appearance:none;appearance:none}   /* 標籤和切換鈕一樣高 */
.chips.sm.cand-filter .chip{flex:none;padding:0 10px;font-size:12px}
.cand-sep{flex:none;width:1px;height:20px;margin:0 8px;background:var(--border)}
.cand-chips:empty + .cand-sep{display:none}   /* 標籤往左滑時被這條線擋住，不會蓋到切換鈕 */
.cand-sortbtn{flex:none;width:34px;margin-left:auto;padding:0;border:0;border-radius:999px;background:var(--fill);color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cand-sortbtn i{line-height:1}
.cand-sortbtn.flip i{animation:sortSpin .3s ease}
@keyframes sortSpin{from{transform:rotate(-90deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.cand-list.anim{animation:dropIn .22s ease}
.clr-wrap{position:relative;display:block;flex:1;min-width:0}
.sheet .clr-wrap input{padding-right:40px}
.clr-btn{position:absolute;top:50%;right:4px;width:32px;height:32px;margin-top:-16px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:15px;display:grid;place-items:center;cursor:pointer}
.clr-btn:active{background:var(--fill2)}
.clr-wrap input:placeholder-shown + .clr-btn,.clr-wrap input:disabled + .clr-btn{display:none}
.cand-grp{display:flex;align-items:center;gap:6px;margin:14px 0 6px;font-size:13px;font-weight:600;color:var(--c-fg);background:none}
.cand-grp b{font-size:11px;font-weight:600;color:var(--muted)}
.im-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.im-list:empty{display:none}
.im-row{position:relative;padding:10px;border:0;border-radius:12px;background:var(--fill);display:flex;flex-direction:column;gap:6px}
.im-row input[type=text],.im-row select{width:100%;height:38px;padding:0 10px;border:1.5px solid transparent;border-radius:10px;font:inherit;font-size:16px;background:#fff;color:inherit;min-width:0}
.im-top{display:flex;align-items:center;gap:8px}
.im-top .im-use{flex:none;width:20px;height:20px;accent-color:var(--accent-fg)}
.im-top .im-name{font-weight:600}
.im-row2{display:flex;gap:6px}
.im-note{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.im-note i{flex:none;font-size:14px}
.im-facts{font-size:12px;color:var(--text2);padding:0 2px}
.im-note:empty{display:none}
.im-wait{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;padding-right:28px}
.im-wait b{font-weight:inherit;display:flex;align-items:center;gap:4px}
.im-wait b i{flex:none}
.im-wait span{font-size:11px;word-break:break-all;opacity:.8}
.im-row.bad .im-wait{color:#B23B3B}
.im-lhead{display:flex;align-items:center;gap:8px;min-height:24px;font-size:15px}
.im-lhead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im-lhead span{font-size:12px;color:var(--muted);flex:none}
.im-lhead i{font-size:18px}
.im-lhead button{flex:none;border:0;background:none;color:var(--accent-fg);font:inherit;font-size:13px;padding:4px 0 4px 4px;cursor:pointer}
.im-row.im-lite{padding:8px 10px;gap:4px}
.im-row.im-listhead{border:0;padding:12px 14px}   /* 清單名稱這一列：上下置中、左右跟下面的地點卡片一樣留白 */
.im-x{position:absolute;top:6px;right:6px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:inherit;font-size:16px;cursor:pointer}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips.sm .chip{height:30px;padding:0 4px;font-size:13px;flex:1 1 0;min-width:0}   /* 每個長度標籤一樣寬，平均排滿一行 */
#edCls .chip,#sbCls .chip,#afCls .chip{flex:none;height:30px;padding:0 12px;font-size:13px}   /* 類型標籤跟日期、長度標籤一樣大 */
/* 類型標籤維持一行：排不下就左右滑，還能滑的那一側邊緣淡出（之後類型會變多） */
#edCls,#sbCls,#edDay,#afCls,#afDay{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;--fl:0px;--fr:0px;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);
          mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
#edCls::-webkit-scrollbar,#sbCls::-webkit-scrollbar,#edDay::-webkit-scrollbar,#afCls::-webkit-scrollbar,#afDay::-webkit-scrollbar{display:none}
#edCls.fade-l,#sbCls.fade-l,#edDay.fade-l,#afCls.fade-l,#afDay.fade-l{--fl:24px}
#edCls.fade-r,#sbCls.fade-r,#edDay.fade-r,#afCls.fade-r,#afDay.fade-r{--fr:24px}
/* 加入行程的日期：跟頁首的天數一樣是正圓數字，「備選」是膠囊 */
#afDay .chip.cand{flex:none;height:34px;padding:0 12px;border-radius:999px;margin-left:4px}
#edDay .chip{flex:1 0 auto;min-width:30px;padding:0 6px}   /* 天數少：平均排滿一行；天數多到放不下：不再縮小，改成左右滑 */
.chips.sm.day-chips .chip{white-space:nowrap}
.btn.cand-open{width:100%;justify-content:flex-start;gap:8px;margin-top:16px}   /* 跟其他欄位一樣隔 16px */
.cand-open .cnt{margin-left:auto;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-bg,#f3e6dc)}
.cand-pick{display:flex;flex-direction:column;gap:6px}
.sh-head + .day-pick{margin-top:16px}
/* 編輯既有卡片（照資訊頁排）：照片、店名、描述跟資訊頁同樣的位置和大小，下面的內容淡入 */
.sheet.ed-look .ed-photo-top{margin:0 0 16px}   /* 跟欄位之間一樣 16px（10/27） */
.sheet.ed-look .ed-photo-top .ph-frame{border-radius:0}   /* 資訊頁的照片是直角 */
.sheet.ed-look .ed-photo-top .ph-st:empty{display:none}
.sheet.ed-look .ed-head{align-items:flex-start}
.sheet.ed-look .ed-head .ed-field{margin:0}
.sheet.ed-look .ed-head .ed-field > .ed-lab{display:none}
.sheet.ed-look .ed-head .ed-lab-row .ed-lab{display:none}
.sheet.ed-look .ed-head .ed-field:has(.multi) .ed-lab{display:block}   /* 改成多個地點／多選一：名稱變成「第一站」，標籤要看得到 */
.sheet.ed-look .ed-head .ed-lab-row{margin-bottom:8px}
.sheet.ed-look .ed-head .ed-field{display:flex;flex-direction:column}
.sheet.ed-look .ed-head #edTWrap{order:-1}   /* 店名跟右邊的 ✕ 對齊；「從備選替換」放在店名下面（10/23 原本在上面把版面推歪） */
.sheet.ed-look .ed-head .ed-lab-row{order:1;margin:6px 0 0}
.sheet.ed-look .ed-head #edSwapWrap{order:2}
.sheet.ed-look .ed-head .ed-field > .ed-t-lab{display:block;order:-3}   /* 名稱框上面的小字「名稱」（10/27），多站、多選一時改顯示「第一站」那排 */
.sheet.ed-look .ed-head .ed-field:has(.multi) > .ed-t-lab{display:none}
.sheet.ed-look .ed-head .ed-field:has(.multi) > .ed-lab,.sheet.ed-look .ed-head .ed-field:has(.multi) .ed-lab-row{order:-2;margin:0 0 8px}   /* 多個地點／多選一：「第一站」「選項 1」標題在名稱框上面（10/27） */
.ed-map-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ed-map-acts:not(:has(.ed-act:not([hidden]))){display:none}
.ed-act{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border:0;border-radius:16px;background:var(--fill);color:var(--text);font:inherit;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.ed-act[hidden]{display:none}
.ed-act i{font-size:15px;color:var(--text2)}
.ed-act:hover{background:var(--fill2)}   /* 地圖欄位下面一排：在 Google 地圖找、重新查詢（10/27） */
.sheet.ed-look .ed-head #edT{font-size:18px;font-weight:600}
.sheet.ed-look .ed-head .sh-sub{margin-top:6px}
.sheet.ed-look .ed-head .sh-sub i{font-size:13px;vertical-align:-1px}
.sheet.ed-look .ed-head > button{margin-top:7px}
.sheet.ed-look .ed-desc{margin-top:16px}
.sheet.ed-look .ed-head .ed-field:not(:has(.multi)) .ed-lab-row{height:0;margin:0;align-items:flex-start;position:relative;z-index:1}
.sheet.ed-look .ed-head .ed-field:not(:has(.multi)) .ed-t-acts{margin-top:10px}   /* 「重新查詢資訊」不佔高度，名稱框到「描述」跟其他欄位一樣 16px（10/27） */
.sheet.ed-look > .ed-lock,.sheet.ed-look > .ed-hint{margin:0 0 16px}   /* 已訂位、替換的提醒放在名稱上面（10/27） */
.sheet.ed-look .ed-del-row{width:100%;margin-top:24px}
.ed-more{margin:28px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
@keyframes edIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet.ed-in > :not(.grab):not(.ed-photo-top):not(.ed-head),.sheet.info-in > :not(.grab):not(.sh-photo):not(.sh-head){animation:edIn .25s ease both}
.cand-drop{margin-top:8px;padding:8px;border:1px solid var(--border);border-radius:12px;animation:dropIn .18s ease}
.cand-drop .cand-pick{max-height:248px;overflow-y:auto;margin:0;-webkit-overflow-scrolling:touch}
.cand-drop .cp-filter{flex-wrap:nowrap;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.cand-drop .cp-filter::-webkit-scrollbar{display:none}
.cand-drop .cp-filter .chip{flex:none;padding:0 12px}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.cand-chev{transition:transform .18s ease}
.cand-open.open .cand-chev{transform:rotate(180deg)}
.sheet.swap > *:not(.grab){animation:dropIn .2s ease}   /* 跟標題隔開，跟編輯面板的欄位間距一樣 */
.cp-item[hidden]{display:none}
.cp-main{flex:1;min-width:0;display:flex;flex-direction:column}
.cp-desc{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cp-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c-fg,var(--accent-fg))}
.cp-name{min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-dur{flex:none;font-size:12px;opacity:.7}
.day-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dp-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;height:52px;border:0;border-radius:12px;background:var(--fill);font:inherit;color:inherit;cursor:pointer}
